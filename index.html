<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d1330">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Bouncy Bird</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; height: 100dvh; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: radial-gradient(circle at 50% 30%, #1a2750 0%, #10173a 48%, #0a0f24 100%);
    font-family: "Manrope", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* Drifting aurora lights behind the stage */
  body::before, body::after {
    content: '';
    position: fixed;
    width: 62vmax;
    height: 62vmax;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    transition: opacity .25s ease;
  }
  body::before {
    background: radial-gradient(circle, rgba(64, 140, 255, .4), transparent 62%);
    top: -22vmax; left: -16vmax;
    animation: drift1 26s ease-in-out infinite alternate;
  }
  body::after {
    background: radial-gradient(circle, rgba(255, 110, 180, .28), transparent 62%);
    bottom: -26vmax; right: -16vmax;
    animation: drift2 34s ease-in-out infinite alternate;
  }
  body[data-theme="dark"]::before,
  body[data-theme="dark"]::after {
    opacity: .55;
  }
  body[data-theme="dark"]::before {
    background: radial-gradient(circle, rgba(139, 92, 246, .45), transparent 62%);
  }
  body[data-theme="dark"]::after {
    background: radial-gradient(circle, rgba(236, 72, 153, .30), transparent 62%);
  }
  body[data-theme="amoled"]::before,
  body[data-theme="amoled"]::after {
    opacity: .06;
  }
  @keyframes drift1 { to { transform: translate(7vmax, 5vmax) scale(1.18); } }
  @keyframes drift2 { to { transform: translate(-6vmax, -7vmax) scale(1.12); } }

  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding:
      env(safe-area-inset-top, 0px)
      env(safe-area-inset-right, 0px)
      env(safe-area-inset-bottom, 0px)
      env(safe-area-inset-left, 0px);
    z-index: 1;
  }
  canvas {
    display: block;
    border-radius: 8px;
    margin: 0;
    cursor: pointer;
    touch-action: none;
    box-shadow:
      0 24px 60px -16px rgba(0, 0, 0, .6),
      0 0 0 1px rgba(255, 255, 255, .09);
    animation: pop-in .45s ease-out both;
  }
  body[data-theme="dark"] canvas {
    box-shadow:
      0 24px 60px -16px rgba(0, 0, 0, .6),
      0 0 0 1px rgba(255, 255, 255, .09),
      0 0 60px rgba(167, 139, 250, .12);
  }
  body[data-theme="amoled"] canvas {
    box-shadow:
      0 10px 28px -12px rgba(0, 0, 0, .9),
      0 0 0 1px rgba(255, 255, 255, .05);
  }
  @keyframes pop-in {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  #ui {
    position: fixed;
    top: 14px;
    right: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 3;
  }
  .ctl {
    width: 38px;
    height: 38px;
    border: 1px solid rgba(255, 255, 255, .65);
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: rgba(255, 255, 255, .94);
    color: #1c3550;
    cursor: pointer;
    box-shadow: 0 5px 16px rgba(0, 0, 0, .3);
    transition: transform .15s ease, opacity .2s ease, box-shadow .15s ease, background .2s ease, color .2s ease;
  }
  body[data-theme="dark"] .ctl {
    background: rgba(40, 28, 65, .92);
    color: #f0eaff;
    border-color: rgba(167, 139, 250, .3);
  }
  body[data-theme="amoled"] .ctl {
    background: rgba(16, 16, 16, .95);
    color: #d8dbe0;
    border-color: rgba(255, 255, 255, .1);
  }
  .ctl:hover { transform: translateY(-2px) scale(1.08); box-shadow: 0 8px 20px rgba(0, 0, 0, .34); }
  .ctl:active { transform: scale(.96); }
  .ctl[disabled] { cursor: default; }
  #hint {
    position: fixed;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: 600;
    color: rgba(255, 255, 255, .92);
    letter-spacing: .4px;
    background: rgba(10, 30, 50, .42);
    padding: 5px 12px;
    border-radius: 999px;
    backdrop-filter: blur(4px);
    pointer-events: none;
    white-space: nowrap;
    z-index: 3;
  }
  @media (pointer: coarse) { #hint { display: none; } }
  @media (pointer: coarse), (max-width: 640px), (max-height: 680px) {
    canvas, body[data-theme="dark"] canvas, body[data-theme="amoled"] canvas { border-radius: 0; box-shadow: none; margin: 0; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="400" height="600" aria-label="Bouncy Bird oyunu. Zıplamak için Space, Yukarı Ok tuşu veya dokunma."></canvas>
  <div id="ui">
    <button id="btnSound" class="ctl" aria-label="Sesi aç veya kapat"></button>
    <button id="btnPause" class="ctl" aria-label="Duraklat veya devam et"></button>
  </div>
  <div id="hint">SPACE / ↑ zıpla &nbsp;·&nbsp; P duraklat &nbsp;·&nbsp; M ses</div>
</div>

  'use strict';

  // Sabit genişlik, ekrana göre büyüyen oyun dünyası. Menüler 400×600 kalır.
  const W = 400, GROUND_H = 90;

  /* Metinleri yuvarlanmış koordinatlarda çiz, 12px altına inme, gölgeleri keskin tut. */
  (function setupCrispContext() {
    try {
      const proto = CanvasRenderingContext2D.prototype;
      const fd = Object.getOwnPropertyDescriptor(proto, 'font');
      if (fd && fd.get && fd.set) {
        Object.defineProperty(ctx, 'font', {
          configurable: true,
          get() { return fd.get.call(ctx); },
          set(v) {
            const s = String(v);
            const bumped = s.replace(/(\d+(?:\.\d+)?)px/, (m, n) => Number(n) < 12 ? '12px' : m);
            fd.set.call(ctx, bumped);
          }
        });
      }
      const bd = Object.getOwnPropertyDescriptor(proto, 'shadowBlur');
      if (bd && bd.get && bd.set) {
        Object.defineProperty(ctx, 'shadowBlur', {
          configurable: true,
          get() { return 0; },
          set() { bd.set.call(ctx, 0); }
        });
      }
      const rawFill = ctx.fillText.bind(ctx);
      const rawStroke = ctx.strokeText.bind(ctx);
      ctx.fillText = function (text, x, y, maxW) {
        if (maxW === undefined) rawFill(text, Math.round(x), Math.round(y));
        else rawFill(text, Math.round(x), Math.round(y), maxW);
      };
      ctx.strokeText = function (text, x, y, maxW) {
        if (maxW === undefined) rawStroke(text, Math.round(x), Math.round(y));
        else rawStroke(text, Math.round(x), Math.round(y), maxW);
      };
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      try { ctx.textRendering = 'optimizeLegibility'; } catch (_) { /* ignore */ }
    } catch (_) { /* eski tarayıcı: düz çizime devam */ }
  })();

    },

    ],

      { s: 20, g: 0, w: 2 }, { s: 0, g: 2, w: 2 }, { s: 12, g: 0, w: 2 },

  /* ---------------- procedural music ---------------- */
  let musicGain = null, musicTimer = null, musicStep = 0, musicNext = 0;
  const MUS_TEMPO = { klasik: 112, zaman: 132, zen: 88, ters: 112, gunluk: 112, boss: 140 };
  const MUS_SCALE = [0, 3, 5, 7, 10, 12, 15];     // minör pentatonik
  function musOn() { return SAVE.settings.mus && !muted; }
  function musicTempo() {
    if (boss && state === 'playing') return MUS_TEMPO.boss;
    return MUS_TEMPO[mode] || 112;
  }
  function musicLayerMode() {
    if (boss && state === 'playing') return 'boss';
    if (state === 'playing') return 'full';
    return 'calm';
  }
  function musicStart() {
    if (musicTimer || !audioCtx || !musOn()) return;
    musicNext = audioCtx.currentTime + .1;
    musicTimer = setInterval(musicPump, 55);
  }
  function musicStop() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  }
  function musicPump() {
    if (!audioCtx || !musOn()) { musicStop(); return; }
    if (!musicGain) {
      musicGain = audioCtx.createGain();
      musicGain.gain.value = SAVE.settings.musVol * .5;
      musicGain.connect(audioCtx.destination);
    }
    musicGain.gain.value = SAVE.settings.musVol * .5;
    const tempo = musicTempo();
    const stepDur = 60 / tempo / 2;             // 8'lik nota
    const lMode = musicLayerMode();
    while (musicNext < audioCtx.currentTime + .18) {
      const step = musicStep % 32;
      const bass = 65.4 * Math.pow(2, (MUS_SCALE[(Math.floor(musicStep / 32)) % 3] || 0) / 12);
      const pat = MUS_SCALE[(musicStep * 3 + Math.floor(musicStep / 8) * 5) % MUS_SCALE.length];
      const f = 261.63 * Math.pow(2, pat / 12);

      // Pad: her 32 adımda bir (step === 0), mevcut bas kökünün 1/4 frekansında, sine, süre 3.5 sn, vol .04
      if (step === 0) {
        musVoice(bass / 4, musicNext, 3.5, .04, 'sine');
      }

      // Arpej: her 8 adımda bir, melodi notasının +12 ve +19 yarım ton üstü, triangle, 0.15 sn, vol .03; ikinci kopya 0.08 sn gecikmeli
      if (step % 8 === 0) {
        const f12 = f * 2;
        const f19 = f * Math.pow(2, 19 / 12);
        musVoice(f12, musicNext, 0.15, .03, 'triangle');
        musVoice(f19, musicNext, 0.15, .03, 'triangle');
        musVoice(f12, musicNext + 0.08, 0.15, .03, 'triangle');
        musVoice(f19, musicNext + 0.08, 0.15, .03, 'triangle');
      }

      // Bas: calm modunda yok; full'da 'sine', boss'ta 'sawtooth'
      if (lMode !== 'calm' && step % 8 === 0) {
        musVoice(bass, musicNext, stepDur * 3.2, .16, lMode === 'boss' ? 'sawtooth' : 'sine');
      }

      // Melodi & Echo: calm modunda yok
      if (lMode !== 'calm' && step % 2 === 0) {
        musVoice(f, musicNext, stepDur * .9, .07, 'triangle');
        if (step % 8 === 6) musVoice(f * 2, musicNext + stepDur, stepDur * .7, .04, 'triangle');
        // Echo: ana melodi notası ayrıca musicNext + .25 (stepDur*.6, vol .025) ve musicNext + .5 (stepDur*.4, vol .012) zamanında, triangle
        musVoice(f, musicNext + .25, stepDur * .6, .025, 'triangle');
        musVoice(f, musicNext + .5, stepDur * .4, .012, 'triangle');
      }

      // Vuruş (Hat): calm modunda yok; boss modunda her 2 adımda bir, full modunda her 4 adımda bir
      if (lMode === 'boss') {
        if (step % 2 === 0) musHat(musicNext, .05);
      } else if (lMode === 'full') {
        if (step % 4 === 2) musHat(musicNext, .05);
      }

      musicNext += stepDur;
      musicStep++;
    }
  }
  function musVoice(f, t0, dur, vol, type) {
    if (activeVoices >= MAX_VOICES) return;
    try {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      activeVoices++;
      o.onended = () => { activeVoices = Math.max(0, activeVoices - 1); };
      o.connect(g); g.connect(musicGain);
      o.start(t0); o.stop(t0 + dur + .02);
    } catch (_) { /* ignore */ }
  }
  function musHat(t0, vol) {
    try {
      const n = Math.floor(audioCtx.sampleRate * .04);
      const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const src = audioCtx.createBufferSource(); src.buffer = buf;
      const g = audioCtx.createGain();
      g.gain.value = vol;
      const f = audioCtx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 5200;
      src.connect(f); f.connect(g); g.connect(musicGain);
      src.start(t0);
    } catch (_) { /* ignore */ }
  }

  /* ---------------- world ---------------- */
  function speed() {

  function currentGap() {
    const dm = D();
    return Math.max(118, BASE_GAP * dm.gapMul - Math.min(34, score * 1.1)) + (rng() * 8 - 4);
  }

  function effGap(p) {
    // Boru boşluğu nefes alıyorsa anlık boşluk (çarpışma da bunu kullanır).
    if (!p.breathAmp) return p.gapBase;
    return p.gapBase + Math.sin(time * p.breathSpd + p.breathPh) * p.breathAmp;
  }

  function addPipe() {
    const gap = currentGap();
    // Merkez aralığı FLOOR'a göre ölçeklenir; ardışık merkez adımı sabit MAX_STEP px kalır.
    const lo = PIPE_SAFE_TOP + gap / 2;
    const hi = FLOOR - PIPE_SAFE_BOTTOM - gap / 2;
    let center = lo + rng() * Math.max(0, hi - lo);
    if (lastGapCenter !== null) {
      center = Math.max(lastGapCenter - MAX_STEP, Math.min(lastGapCenter + MAX_STEP, center));
      center = clamp(center, lo, hi);
    }
    lastGapCenter = center;
    const p = { x: W + 20, top: center - gap / 2, gap, gapBase: gap, center, scored: false };

    // Kademeli engeller (puan eşikleriyle açılır, hiçbiri geçilemez değildir)
    const O = CONFIG.obstacles;
    if (score >= O.breath && rng() < .3) {
      p.breathAmp = O.breathAmp; p.breathSpd = 1.1 + rng() * .9; p.breathPh = rng() * 6.28;
      p.gapBase = Math.max(128, gap); p.center = center;
    }
    if (score >= O.moving && rng() < .26 && !p.breathAmp) {
      p.moveAmp = O.moveAmp; p.moveSpd = O.moveSpd(); p.movePh = rng() * 6.28;
      p.moveBase = center;
    }
    if (score >= O.saw && rng() < .16 && !p.breathAmp) {
      const reach = Math.min(O.sawReach(), effGap(p) - 96);   // boşlukta her zaman ≥90px geçit kalır
      if (reach > 16) {
        p.saw = { side: rng() < .5 ? 'top' : 'bot', t: rng() * 6.28, spd: 1.6 + rng() * 1.2, reach, r: 13 };
      }
    }
    // Borunun anlık geometrisi (hareketli borular için)
    layoutPipe(p);
    pipes.push(p);

    // Bonus yıldız boşlukta, hafif kaydırmalı
    if (rng() < 0.42) {
      coins.push({ x: p.x + PIPE_W / 2, y: center + (rng() * 44 - 22), ph: rng() * 6.28, taken: false });
    }
    // Rüzgar bölgesi (dikey itiş, görsel çizgilerle)
    if (score >= O.wind && rng() < .12) {
      winds.push({ x: W + 80 + rng() * 60, w: 100 + rng() * 60, f: O.windForce() * (rng() < .5 ? -1 : 1), ph: rng() * 6.28 });
    }
    // Düşman kuşlar / yarasalar
    if (score >= O.bat) {
      const maxB = O.batMax(score);
      let cnt = 0;
      for (const e of enemies) if (e.type === 'bat' && e.x > W - 40) cnt++;
      if (cnt < maxB && rng() < .22) {
        enemies.push({
          type: 'bat', x: W + 60 + rng() * 50, baseY: 80 + rng() * Math.max(80, FLOOR - 180),
          amp: 34 + rng() * 30, ph: rng() * 6.28, spd: O.batSpd(), r: 10
        });
      }
    }
    // Oyun içi güç (borular arasında toplanır)
    if (score >= 6 && rng() < .085 && !boss) {
      const types = CONFIG.powerups.map(w => w.id);
      const type = types[Math.floor(rng() * types.length)];
      pickups.push({ x: p.x + PIPE_W / 2 + 110, y: center + (rng() * 60 - 30), type, ph: rng() * 6.28, taken: false });
    }
  }

  function layoutPipe(p) {
    // Hareketli boru: merkez salınır (kenarlardan en az 45px uzak)
    if (p.moveAmp) {
      const c = p.moveBase + Math.sin(time * p.moveSpd + p.movePh) * p.moveAmp;
      const half = effGap(p) / 2;
      p.center = Math.max(PIPE_SAFE_TOP + half, Math.min(FLOOR - PIPE_SAFE_BOTTOM - half, c));
      p.top = p.center - half;
      p.gap = effGap(p);
    } else if (p.breathAmp) {
      const g = effGap(p);
      p.gap = g;
      p.top = p.center - g / 2;
    }
  }

  function circleHitsRect(cx, cy, r, x, y, w, h) {
    const nx = Math.max(x, Math.min(cx, x + w));
    const ny = Math.max(y, Math.min(cy, y + h));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  function zenBounce() {

    shakeT = .55; shakeMag = 7;
    flashA = .7;
    burstFeathers();
    if (isNewBest) burstConfetti();
    deathSlowT = .9;              // ölümde yavaş çekim
    zoomT = .8;                   // hafif kamera zoom
    setVib([30, 40, 30]);
    sHit(); sDie();
    recordRunResults();
    syncButtons();
  }

  function addFloat(x, y, txt, color) {
    floats.push({ x, y, txt, color, life: .9, max: .9, vy: -46 });
  }

  /* ---------------- particles ---------------- */
  const CONFETTI = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff9f43', '#c084fc'];
  function pNew(o) {
    // Nesne havuzu: kapasite aşılırsa en eski parçacık havuza alınır, yeni parçacık mümkünse yeniden kullanılır.
    if (particles.length >= (lowPerf() ? 120 : 280) && particles.length) {
      const old = particles.shift();
      if (particlePool.length < 240) particlePool.push(old);
    }
    const p = particlePool.length ? Object.assign(particlePool.pop(), o) : o;
    particles.push(p);
    return p;
  }
  function burstFeathers() {
    for (let i = 0; i < 12; i++) {
      pNew({
        type: 'feather', x: bird.x, y: bird.y,
        vx: Math.random() * 180 - 90, vy: -140 + Math.random() * 170,
        rot: Math.random() * 6.3, vr: Math.random() * 10 - 5,
        life: .9 + Math.random() * .5, max: 1.35, size: 4.5 + Math.random() * 4,
        color: ['#ffd23f', '#f5a623', '#fff3b0'][i % 3]
      });
    }
  }
  function burstConfetti() {
    for (let i = 0; i < 26; i++) {
      pNew({
        type: 'conf', x: 40 + Math.random() * 320, y: 110 + Math.random() * 60,
        vx: Math.random() * 90 - 45, vy: 60 + Math.random() * 90,
        rot: Math.random() * 6.3, vr: Math.random() * 12 - 6,
        life: 1.4 + Math.random() * .6, max: 2, size: 5 + Math.random() * 3.5,
        color: CONFETTI[i % CONFETTI.length]
      });
    }
  }
  function burstSparks(n, x, y, cols) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 140;
      pNew({
        type: 'spark', x, y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40,
        life: .45 + Math.random() * .3, max: .7, size: 2 + Math.random() * 2.6,
        color: cols[i % cols.length]
      });
    }
  }
  function flapPuffs() {
    for (let i = 0; i < 3; i++) {
      pNew({
        type: 'puff', x: bird.x - 10 + Math.random() * 10, y: bird.y + 9 + Math.random() * 7,
        vx: -50 - Math.random() * 40, vy: 24 + Math.random() * 22,
        life: .4, max: .4, size: 5 + Math.random() * 4, color: '#ffffff'
      });
    }
  }
  function groundDust() {
    for (let i = 0; i < 9; i++) {
      pNew({
        type: 'dust', x: bird.x + Math.random() * 34 - 17, y: FLOOR - 5,
        vx: Math.random() * 130 - 65, vy: -(25 + Math.random() * 45),
        life: .5, max: .5, size: 4 + Math.random() * 5, color: '#d8c98f'
      });
    }
  }

  function updateParticles(dt) {
    for (const p of particles) {
      p.life -= dt;
      if (p.type === 'feather') {
        p.vy += 240 * dt;
        p.x += p.vx * dt + Math.sin(p.life * 8) * 22 * dt;
        p.y += p.vy * dt;
        p.rot += p.vr * dt;
      } else if (p.type === 'conf') {
        p.vy += 170 * dt;
        p.vx *= .995;
        p.x += p.vx * dt + Math.sin(p.life * 6) * 26 * dt;
        p.y += p.vy * dt;
        p.rot += p.vr * dt;
      } else if (p.type === 'spark') {
        p.vy += 280 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      } else if (p.type === 'puff') {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= .96;
      } else if (p.type === 'trail') {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      } else { // dust
        p.vy += 150 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }
    }
    let k = 0;
    for (let i = 0; i < particles.length; i++) {
      if (particles[i].life > 0) particles[k++] = particles[i];
      else if (particlePool.length < 240) particlePool.push(particles[i]);
    }
    particles.length = k;
  }

  /* Yerinde sıkıştırma: her karede yeni dizi ayırmadan ölü nesneleri atar. */
  function compactInPlace(arr, alive, pool, poolMax) {
    let k = 0;
    for (let i = 0; i < arr.length; i++) {
      const v = arr[i];
      if (alive(v)) arr[k++] = v;
      else if (pool && pool.length < (poolMax || 80)) pool.push(v);
    }
    arr.length = k;
  }
  function bNew(o) {
    const b = bulletPool.length ? Object.assign(bulletPool.pop(), { wsp: 0, ph: 0, amp: 0, dead: false }, o) : Object.assign({ wsp: 0, ph: 0, amp: 0, dead: false }, o);
    bullets.push(b);
    return b;
  }
  function clearBullets() {
    for (const b of bullets) if (bulletPool.length < 60) bulletPool.push(b);
    bullets.length = 0;
  }
  function sNew(o) {
    const s = shotPool.length ? Object.assign(shotPool.pop(), o) : o;
    s.dead = false;
    shots.push(s);
    return s;
  }
  function clearShots() {
    for (const s of shots) if (shotPool.length < 60) shotPool.push(s);
    shots.length = 0;
  }

  /* ---------------- update ---------------- */
  function update(dt0) {
    // Ölümde yavaş çekim: timeScale yumuşak geri döner.
    if (deathSlowT > 0) {
      deathSlowT = Math.max(0, deathSlowT - dt0);
      timeScale = deathSlowT > 0 ? Math.max(.3, 1 - (deathSlowT / .9) * .7) : 1;
    } else timeScale = 1;
    if (zoomT > 0) zoomT = Math.max(0, zoomT - dt0);
    if (gemFlash > 0) gemFlash = Math.max(0, gemFlash - dt0 * 1.3);

    // Bildirim kartları
    if (notifQ.length) {
      const n = notifQ[0];
      n.t += dt0;
      if (n.t > n.life) notifQ.shift();
    }

    // Gecikmeli kuyruk (setTimeout2): duraklatma dışında her durumda akar
    if (state !== 'paused') pumpDelayed();
    // Arka plan sahneleri en fazla 30 FPS güncellenir (düşük performansta 20 FPS).
    bgAcc += dt0;
    const bgStep = lowPerf() ? 1 / 20 : 1 / 30;
    if (bgAcc >= bgStep) { bgTime += bgAcc; bgAcc = 0; }

    if (state !== 'paused') {
      const dt = dt0 * timeScale;
      time += dt;
      const spd = speed() * (active === 'yavas' && slowPipes > 0 ? .65 : 1);
      const T = 360;
      if (state !== 'gameover') {
        groundOffset = (groundOffset + spd * dt) % T;
        fgGroundOffset = (fgGroundOffset + spd * 1.25 * dt) % T;
      }
      if (state === 'playing') stats.playSec += dt0;
      if (state === 'gameover' && pendingH && pendingH !== H) applyViewportH(pendingH);

      if (invT > 0) invT = Math.max(0, invT - dt);
      if (startBoostT > 0) startBoostT = Math.max(0, startBoostT - dt);
      for (const k in pu) if (pu[k] > 0) pu[k] = Math.max(0, pu[k] - dt);
      if (comboTxtT > 0) comboTxtT = Math.max(0, comboTxtT - dt);

      // Blinking (all states).
      bird.nextBlink -= dt;
      if (bird.nextBlink <= 0) { bird.blink = .13; bird.nextBlink = 2.4 + Math.random() * 3.2; }
      if (bird.blink > 0) bird.blink -= dt;
      bird.sq = Math.max(0, bird.sq - dt * 5.5);

      updateParticles(dt);
      for (const f of floats) { f.life -= dt; f.y += f.vy * dt; }
      compactInPlace(floats, f => f.life > 0);

      if (shakeT > 0) shakeT = Math.max(0, shakeT - dt);
      if (flashA > 0) flashA = Math.max(0, flashA - dt * 2.4);
      if (scorePop > 0) scorePop = Math.max(0, scorePop - dt * 3);
      scoreIdleT += dt;

      // Shooting stars (visible at night).
      shootT -= dt;
      if (shootT <= 0 && !shoot) {
        shoot = {
          x: 80 + Math.random() * 240, y: 26 + Math.random() * 110,
          vx: -(170 + Math.random() * 130), vy: 80 + Math.random() * 70,
          life: .8, max: .8
        };
        shootT = 8 + Math.random() * 10;
      }
      if (shoot) {
        shoot.x += shoot.vx * dt;
        shoot.y += shoot.vy * dt;
        shoot.life -= dt;
        if (shoot.life <= 0) shoot = null;
      }

      // Snow (snow kingdom background)
      if (bg === 'kar') {
        for (const s of snow) {
          s.y += s.vy * dt;
          s.x += (Math.sin(time * 1.4 + s.ph) * s.drift - (state === 'playing' ? spd * .12 : 0)) * dt;
          if (s.y > FLOOR) { s.y = -4; s.x = Math.random() * W; }
          if (s.x < -6) s.x = W + 4; else if (s.x > W + 6) s.x = -4;
        }
      }

      if (state !== 'playing' && state !== 'gameover') {
        // ready / shop / menü ekranları: kuş ortalanır ve süzülür
        bird.x = W / 2;
        bird.y = UI_OY + READY_BIRD_Y + Math.sin(time * 3.2) * 7;
        bird.rot = Math.sin(time * 3.2) * .08;
        bird.wing += dt * 10;
        eyeLook.x = Math.sin(time * .9) * .35;
        eyeLook.y = Math.cos(time * .7) * .3;
        // Atölye animasyonları (çark / madalyon / yumurta / kartlar)
        if (luckAnim) { luckAnim.t += dt; updateLuck(dt); }
        return;
      }

      if (state === 'gameover') {
        eyeLook.x = 0; eyeLook.y = 0;
        if (bird.y + BIRD_R < FLOOR) {
          bird.vy = Math.min(bird.vy + GRAVITY * dt, MAX_FALL);
          bird.y = Math.min(bird.y + bird.vy * dt, FLOOR - BIRD_R);
          bird.rot = Math.min(1.4, bird.rot + dt * 3);
          bird.wing += dt * 4;
        } else if (!bird.landed) {
          bird.landed = true;
          groundDust();
          shakeT = .28; shakeMag = 3;
          noise(.09, .14);
        }
        return;
      }

      /* ================= PLAYING ================= */
      // Gözler en yakın boşluğa bakar
      let tgt = null;
      for (const p of pipes) if (p.x + PIPE_W > bird.x - 30) { tgt = p; break; }
      if (tgt) {
        eyeLook.x = .8; eyeLook.y = Math.max(-1, Math.min(1, (tgt.center - bird.y) / 160));
      } else { eyeLook.x = .55; eyeLook.y = Math.max(-.6, Math.min(.6, bird.vy / 500)); }

      // Ters yerçekimi sayacı ve uyarı
      if (mode === 'ters') {
        gravFlipT -= dt;
        if (gravFlipT <= 1.2 && gravWarn === 0) { gravWarn = 1.2; sTimeUp(); }
        if (gravWarn > 0) gravWarn = Math.max(0, gravWarn - dt);
        if (gravFlipT <= 0) {
          gravDir *= -1;
          gravFlipT = 8;
          gravWarn = 0;
          flashA = .4; shakeT = .3; shakeMag = 4;
          addFloat(W / 2, 210, gravDir < 0 ? '↑ YERÇEKİMİ TERS!' : '↓ YERÇEKİMİ NORMAL', gravDir < 0 ? '#c084fc' : '#4d96ff');
          sFlip(); setVib(80);
        }
      }

      // Basılı tut = yüksel (kontrol seçeneği)
      if (SAVE.settings.ctrl === 'hold' && holdDown) {
        bird.vy -= GRAVITY * D().gravMul * CONFIG.hold.thrustMul * dt * gravDir;
      }

      // Yerçekimi
      const g = GRAVITY * D().gravMul * gravDir;
      bird.vy = Math.max(-MAX_FALL, Math.min(MAX_FALL, bird.vy + g * dt));
      if (SAVE.settings.ctrl === 'hold' && holdDown) {
        const maxUp = CONFIG.hold.maxUp;
        if (gravDir > 0) bird.vy = Math.max(bird.vy, -maxUp);
        else bird.vy = Math.min(bird.vy, maxUp);
      }
      bird.y += bird.vy * dt;
      bird.rot = Math.max(-.5, Math.min(1.1, bird.vy / 600));
      bird.wing += dt * (bird.vy * gravDir < 0 ? 26 : 10);

      trail.push({ x: bird.x, y: bird.y, rot: bird.rot });
      if (trail.length > 7) trail.shift();

      // İz efekti (TRAILS)
      const tr = TRAILS.find(t => t.id === trailSel);
      if (tr && tr.cols) {
        trailAcc += dt;
        const gap = lowPerf() ? .05 : .025;
        let spawned = 0;
        while (trailAcc >= gap && spawned < 3) {
          trailAcc -= gap;
          spawned++;
          pNew({
            type: 'trail',
            shape: trailSel === 'kalp' ? 'kalp' : 'circle',
            x: bird.x - 14,
            y: bird.y + (Math.random() * 8 - 4),
            vx: -speed() * 0.9,
            vy: Math.random() * 24 - 12,
            life: .6,
            max: .6,
            size: 4 + Math.random() * 3,
            color: tr.cols[Math.floor(Math.random() * tr.cols.length)]
          });
        }
        if (trailAcc > gap * 3) trailAcc = 0;
      }
      // Feniks / galaksi efsane kuş parıltısı
      const sk = currentSkin();
      if (sk.glow && !lowPerf() && Math.random() < .3) {
        pNew({
          type: 'spark', x: bird.x + (Math.random() * 30 - 18), y: bird.y + (Math.random() * 26 - 13),
          vx: -40, vy: Math.random() * 30 - 10,
          life: .4, max: .4, size: 1.6 + Math.random() * 2, color: sk.body[1]
        });
      }

      // Tavan / zemin kontrolü (ters yerçekiminde tavan da öldürür)
      if (bird.y - BIRD_R < 0) {
        if (gravDir < 0) { bird.y = BIRD_R; endGame(active === 'kalkan'); return; }
        bird.y = BIRD_R; bird.vy = 0;
      }

      // Yıldız yağmuru: gökten yıldız yağar
      if (pu.yagmur > 0) {
        rainT -= dt;
        if (rainT <= 0) {
          rainT = .18;
          coins.push({ x: bird.x + 90 + Math.random() * 180, y: -12, ph: Math.random() * 6.28, taken: false, rain: true });
        }
      }

      const move = spd * dt;
      for (const p of pipes) { p.x -= move; layoutPipe(p); if (p.saw) p.saw.t += p.saw.spd * dt; }
      for (const c of coins) { c.x -= move; if (c.rain) c.y += 120 * dt; }
      for (const pk of pickups) pk.x -= move;
      for (const e of enemies) {
        e.x -= move;
        if (e.type === 'bat') e.y = e.baseY + Math.sin(time * e.spd + e.ph) * e.amp;
      }
      for (const w of winds) {
        w.x -= move;
        if (bird.x > w.x && bird.x < w.x + w.w) bird.vy += w.f * dt;
      }
      compactInPlace(pipes, p => p.x + PIPE_W > -20);
      compactInPlace(winds, w => w.x + w.w > -30);
      compactInPlace(enemies, e => e.x > -30 && !e.dead);

      if (!boss && !bossPending) {
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          addPipe();
          spawnTimer += Math.max(1.05, BASE_SPAWN - score * .012);
        }
      }

      // Zamana Karşı süresi
      if (mode === 'zaman') {
        runTime -= dt;
        if (runTime <= 0) {
          runTime = 0;
          state = 'gameover';
          gameOverAt = performance.now();
          if (pendingH && pendingH !== H) applyViewportH(pendingH);
          isNewBest = score > runBest && score > 0;
          flashA = .45;
          addFloat(W / 2, 140, 'SÜRE BİTTİ!', '#ff8a8a');
          sTimeUp();
          recordRunResults();
          syncButtons();
          return;
        }
      }

      // Boru geçişi: skor + combo + mükemmel + sıyrılma
      for (const p of pipes) {
        if (!p.scored && p.x + PIPE_W < bird.x - BIRD_R) {
          p.scored = true;
          const dbl = active === 'puan2' && x2Pipes > 0;
          const pts = dbl ? 2 : 1;
          score += pts;
          scorePop = 1; scoreIdleT = 0;
          if (dbl) x2Pipes--;
          if (active === 'yavas' && slowPipes > 0) slowPipes--;
          burstSparks(7, bird.x + 6, bird.y, ['#ffd23f', '#fff3b0', '#ffec8a']);
          addFloat(bird.x + 4, bird.y - 18, '+' + pts, dbl ? '#c084fc' : '#ffffff');
          sScore();
          stats.pipes++;
          taskProg('t_pipe20', 1);

          // Mükemmel geçiş: boşluğun tam ortası
          const dist = Math.abs(bird.y - (p.center || p.top + p.gap / 2));
          if (dist < CONFIG.combo.perfectBand) {
            perfCount++;
            combo++;
            comboMul = combo >= 6 ? 3 : combo >= 3 ? 2 : 1;
            stats.bestCombo = Math.max(stats.bestCombo, comboMul);
            taskProg('t_perf3', 1);
            const st = CONFIG.economy.perfectStar + (comboMul - 1);
            addStars(st);
            comboTxt = 'MÜKEMMEL' + (comboMul > 1 ? ' ×' + comboMul : '') + ' +' + st + '⭐';
            comboTxtT = 1.1;
            addFloat(bird.x + 20, bird.y - 46, comboTxt, comboMul >= 3 ? '#ff8a3c' : '#ffd23f');
            burstSparks(9, bird.x + 18, bird.y - 30, ['#ffd23f', '#ffffff', '#4dd0e1']);
            sTask();
          } else {
            // Sıyrılma: çok yakın geçiş
            const clrTop = (bird.y - BIRD_R) - p.top;
            const clrBot = (p.top + p.gap) - (bird.y + BIRD_R);
            if (Math.min(clrTop, clrBot) < CONFIG.combo.nearMiss) {
              addStars(CONFIG.economy.nearMissStar);
              addFloat(bird.x + 10, bird.y + 26, 'SIYRILDI! +1⭐', '#a8dcff');
              taskProg('t_near3', 1);
            }
            combo = 0; comboMul = 1;
          }
          checkThreshold();
          if (score > best) {
            best = score;
            try { localStorage.setItem(BEST_KEY, String(best)); } catch (_) { /* ignore */ }
          }
          if (score > runBest && !isNewBest) {
            isNewBest = true;
            addFloat(bird.x, bird.y - 40, 'YENİ REKOR!', '#ffd23f');
            burstSparks(10, bird.x, bird.y - 24, ['#ffd23f', '#ff8a2b', '#fff3b0']);
          }
        }
      }

      // Yıldız toplama
      for (const c of coins) {
        if (c.taken) continue;
        const bobY = c.y + Math.sin(time * 3 + c.ph) * 3;
        let dx = bird.x - c.x, dy = bird.y - bobY;
        const pull = (active === 'miknatis' || pu.yagmur > 0) && dx * dx + dy * dy < 130 * 130;
        if (pull) {  // magnet: stars drift toward the bird
          const d = Math.max(28, Math.hypot(dx, dy));
          c.x += (dx / d) * 240 * dt;
          c.y += (dy / d) * 240 * dt;
        }
        if (dx * dx + dy * dy < (BIRD_R + 11) * (BIRD_R + 11)) {
          c.taken = true;
          coinsGot++;
          const val = (active === 'yildizx2' ? 2 : 1) * CONFIG.economy.starValuePerCollect;
          addStars(val);
          score += 2;
          scorePop = 1; scoreIdleT = 0;
          burstSparks(12, c.x, bobY, ['#ffd23f', '#fff3b0', '#ffec8a']);
          addFloat(c.x, bobY - 16, pull ? '+' + (2) + ' 🧲' : '+2', '#ffd23f');
          if (active === 'yildizx2') addFloat(c.x, bobY - 32, '🌟×2', '#ffd23f');
          sCoin();
          if (score > best) {
            best = score;
            try { localStorage.setItem(BEST_KEY, String(best)); } catch (_) { /* ignore */ }
          }
          if (score > runBest && !isNewBest) {
            isNewBest = true;
            addFloat(bird.x, bird.y - 40, 'YENİ REKOR!', '#ffd23f');
          }
        }
      }
      compactInPlace(coins, c => !c.taken && c.x > -30);

      // Güç toplama
      for (const pk of pickups) {
        if (pk.taken) continue;
        const dx = bird.x - pk.x, dy = bird.y - pk.y;
        if (dx * dx + dy * dy < 30 * 30) {
          pk.taken = true;
          pu[pk.type] = CONFIG.powerups.find(w => w.id === pk.type).dur;
          stats.powerups++;
          taskProg('t_power3', 1);
          const def = CONFIG.powerups.find(w => w.id === pk.type);
          addFloat(pk.x, pk.y - 20, def.icon + ' ' + def.name, '#4d96ff');
          burstSparks(10, pk.x, pk.y, ['#4d96ff', '#a8dcff', '#ffffff']);
          if (!puShown[pk.type]) { puShow(def.icon + ' ' + def.name, '#4d96ff'); puShown[pk.type] = true; }
          sPower(); setVib(25);
        }
      }
      compactInPlace(pickups, pk => !pk.taken && pk.x > -30);

      // Düşmanlar (yarasa) çarpışma / ezme
      const effR = BIRD_R * birdScale();
      if (pu.hiz <= 0) {
        for (const e of enemies) {
          if (e.dead) continue;
          const dx = bird.x - e.x, dy = bird.y - (e.y || 0);
          const rr = effR + e.r - 3;
          if (dx * dx + dy * dy < rr * rr) {
            if (pu.dev > 0) {
              e.dead = true;
              score += 1; scorePop = 1; scoreIdleT = 0;
              burstSparks(10, e.x, e.y, ['#c084fc', '#ffffff', '#6bcb77']);
              addFloat(e.x, e.y - 16, 'EZİLDİ! +1', '#c084fc');
              sCrash();
              checkThreshold();
            } else {
              endGame(active === 'kalkan');
              return;
            }
          }
        }
      } else {
        for (const e of enemies) {
          const dx = bird.x - e.x, dy = bird.y - (e.y || 0);
          if (dx * dx + dy * dy < 34 * 34 && !e.dead) {
            e.dead = true;
            burstSparks(10, e.x, e.y, ['#4d96ff', '#ffffff']);
          }
        }
      }

      // Testere çarpışması (boruya bağlı)
      if (pu.hiz <= 0 && pu.dev <= 0) {
        for (const p of pipes) {
          if (!p.saw) continue;
          const ext = Math.max(0, p.saw.reach * (0.5 + 0.5 * Math.sin(p.saw.t)));
          const cy = p.saw.side === 'top' ? p.top + 26 + ext : p.top + p.gap - 26 - ext;
          const dx = bird.x - (p.x + PIPE_W / 2), dy = bird.y - cy;
          const rr = effR + p.saw.r - 4;
          if (dx * dx + dy * dy < rr * rr) { endGame(active === 'kalkan'); return; }
        }
      }

      // Boss zamanı (eşik kontrolü)
      if (!boss && !bossPending && score >= bossNext) {
        bossPending = true;
        bossPendingT = 0;
        bossWarned = false;
      }

      // Boss bekleme ve geliş uyarısı (borular geçince ~1 sn sonra)
      if (bossPending && !boss) {
        const pipesClear = pipes.every(p => p.x + PIPE_W < bird.x);
        if (pipesClear) {
          if (!bossWarned) {
            bossWarned = true;
            addFloat(W - 90, 130, '👹 BOSS GELİYOR!', '#ff6b6b');
          }
          bossPendingT += dt;
          if (bossPendingT >= 1.0) {
            bossPending = false;
            spawnBoss();
          }
        }
      }

      // Boss güncelleme
      if (boss) updateBoss(dt);

      // Kuş ateşi (boss varken)
      if (boss) {
        birdShotT -= dt;
        if (birdShotT <= 0) {
          birdShotT = CONFIG.boss.fireGap || 0.45;
          sNew({ x: bird.x + 16, y: bird.y, vx: 460, r: 6 });
          sShot();
        }
      }

      // Kuş mermileri ve çarpışmalar
      for (const s of shots) {
        s.x += s.vx * dt;
        // Kuş mermisi boss mermisine çarparsa (savunma)
        for (const b of bullets) {
          if (b.dead || s.dead) continue;
          const dx = s.x - b.x, dy = s.y - b.y;
          const rSum = s.r + (b.r || CONFIG.boss.bulletR || 9);
          if (dx * dx + dy * dy <= rSum * rSum) {
            s.dead = true;
            b.dead = true;
            burstSparks(6, b.x, b.y, ['#ffd23f', '#ff8a2b', '#ffffff']);
          }
        }
        // Kuş mermisi boss'a çarparsa
        if (boss && !s.dead) {
          const cx = 352, cy = boss.y;
          const dx = s.x - cx, dy = s.y - cy;
          if (dx * dx + dy * dy <= (s.r + 30) * (s.r + 30)) {
            s.dead = true;
            boss.hp -= 1;
            boss.hitFlash = 1;
            burstSparks(8, cx - 15, cy, ['#ffd23f', '#ff4d4d', '#ffffff']);
            sBossHit();
            if (boss.hp <= 0) {
              defeatBoss();
            }
          }
        }
      }
      compactInPlace(shots, s => s.x < W + 20 && !s.dead, shotPool, 60);

      // Boss Mermileri
      for (const b of bullets) { b.x -= b.vx * dt; if (b.amp) b.y = b.baseY + Math.sin(time * b.wsp + b.ph) * b.amp; }
      compactInPlace(bullets, b => b.x > -24 && !b.dead, bulletPool, 60);
      if (pu.hiz <= 0) {
        for (const b of bullets) {
          const dx = bird.x - b.x, dy = bird.y - b.y;
          const rr = effR + CONFIG.boss.bulletR;
          if (dx * dx + dy * dy < rr * rr) { endGame(active === 'kalkan'); return; }
        }
      }

      // Zemin çarpışması
      if (bird.y + BIRD_R >= FLOOR) {
        bird.y = FLOOR - BIRD_R;
        if (invT > 0 || gravDir < 0) {           // shield grace veya ters modda zemin güvenli
          bird.vy = -380;
          flashA = Math.max(flashA, .25);
          burstSparks(8, bird.x, FLOOR - 8, ['#4d96ff', '#a8dcff', '#ffffff']);
        } else {
          endGame(active === 'kalkan');
          return;
        }
      }

      // Boru çarpışması
      if (invT <= 0 && pu.hiz <= 0 && pu.dev <= 0) {
        for (const p of pipes) {
          if (p.smashed) continue;
          const hit = circleHitsRect(bird.x, bird.y, effR - 1, p.x, 0, PIPE_W, p.top) ||
                      circleHitsRect(bird.x, bird.y, effR - 1, p.x, p.top + p.gap, PIPE_W, FLOOR - p.top - p.gap);
          if (hit) {
            endGame(active === 'kalkan');
            return;
          }
        }
      }
      // Dev kuş boruları ezer
      if (pu.dev > 0) {
        for (const p of pipes) {
          if (!p.smashed && bird.x + effR > p.x && bird.x - effR < p.x + PIPE_W) {
            p.smashed = true;
            score += 1; scorePop = 1; scoreIdleT = 0;
            shakeT = .2; shakeMag = 3;
            for (let i = 0; i < 10; i++) {
              pNew({
                type: 'dust', x: p.x + Math.random() * PIPE_W, y: Math.random() * FLOOR,
                vx: (Math.random() * 160 - 60), vy: -(40 + Math.random() * 90),
                life: .55, max: .55, size: 5 + Math.random() * 5, color: '#7fd964'
              });
            }
            addFloat(p.x + PIPE_W / 2, bird.y - 40, '🦣 EZİLDİ +1', '#6bcb77');
            sCrash();
            checkThreshold();
          }
        }
      }
    }
  }

  function birdScale() {
    let s = 1;
    if (pu.mini > 0) s *= .68;
    if (pu.dev > 0) s *= 1.55;
    return s;
  }

  /* ================= v4: boss / görev / başarım / bildirim ================= */
  let runStarsStart = 0, runGemsStart = 0, achChecking = false;

  function spawnBoss() {
    const type = Math.floor(rng() * 3);
    const baseY = clamp(bird.y, 70, FLOOR - 70);
    boss = {
      type,
      t: 0,
      hp: CONFIG.boss.hp,
      timeout: CONFIG.boss.timeout || 45,
      shotT: 1.3,
      burstT: 0,
      y: baseY,
      hitFlash: 0,
      wavePh: 0
    };
    sBoss(); setVib([30, 50, 30]);
    shakeT = .4; shakeMag = 5;
    addFloat(W - 90, 130, '👹 BOSS GELDİ!', '#ff6b6b');
  }

  function updateBoss(dt) {
    boss.t += dt;
    boss.hitFlash = Math.max(0, boss.hitFlash - dt * 3);
    boss.wavePh += dt;
    // Kuşun y'sini yumuşak takip et (~%120 lerp) + küçük sinüs salınımı, [70, FLOOR - 70]
    const targetY = clamp(bird.y + Math.sin(boss.t * 2.5) * 22, 70, FLOOR - 70);
    boss.y += (targetY - boss.y) * Math.min(1, dt * 1.2);
    boss.y = clamp(boss.y, 70, FLOOR - 70);

    // Tip 0 ardışık 2. mermi (0.15 sn arayla)
    if (boss.burstT > 0) {
      boss.burstT -= dt;
      if (boss.burstT <= 0) {
        bNew({ x: 330, y: boss.y + 6, baseY: boss.y + 6, vx: 175, wsp: 0, ph: 0, amp: 0, r: 9 });
        sBossHit();
      }
    }

    boss.shotT -= dt;
    if (boss.shotT <= 0) {
      if (boss.type === 0) {           // Ateş Ejderi: düz ateş topları (0.15 sn arayla 2 top)
        bNew({ x: 330, y: boss.y + 6, baseY: boss.y + 6, vx: 175, wsp: 0, ph: 0, amp: 0, r: 9 });
        boss.burstT = 0.15;
        boss.shotT = 1.05;
      } else if (boss.type === 1) {    // Deniz Yılanı: sinüs dalgası (o anki boss.y'den)
        for (let i = 0; i < 3; i++) {
          bNew({ x: 340 + i * 30, y: boss.y, baseY: boss.y, vx: 150 - i * 16, wsp: 2.4 + i * .5, ph: boss.wavePh, amp: 42, r: 8 });
        }
        boss.shotT = 1.5;
      } else {                          // Buz Feneri: zikzak buz kırıkları
        bNew({ x: 340, y: boss.y, baseY: boss.y, vx: 195, wsp: 3.6, ph: boss.wavePh * 2, amp: 78, r: 8 });
        bNew({ x: 340, y: FLOOR - 70, baseY: FLOOR - 70, vx: 195, wsp: 3.6, ph: boss.wavePh * 2 + Math.PI, amp: 60, r: 8 });
        boss.shotT = 1.25;
      }
      sBossHit();
    }
    // 45 sn içinde yenilmezse kaçar (ödülsüz, borular devam eder)
    boss.timeout -= dt;
    if (boss.timeout <= 0) {
      escapeBoss();
    }
  }

  function pushNotif(title, sub) {
    notifQ.push({ title, sub, t: 0, life: 3.4 });

  function taskProg(id, n) {
    const t = SAVE.tasks.list.find(x => x.id === id && !x.done);
    if (!t) return;
    const def = CONFIG.tasks.find(x => x.id === id);
    if (!def) return;
    t.p = Math.min(def.goal, t.p + n);
    if (t.p >= def.goal) {
      t.done = true;
      pushNotif(def.icon + ' GÖREV TAMAM!', def.name + ' → +' + def.star + '⭐ +' + def.gem + '💎');
      if (def.star) addStars(def.star);
      if (def.gem) addGems(def.gem);
      sTask();

      checkAchievements();
    } else saveSave();

  function checkThreshold() {
    const step = CONFIG.gemThresholds.step;
    if (score >= step) {
      const mark = Math.floor(score / step) * step;
      if (!SAVE.threshold.includes(mark)) {
        SAVE.threshold.push(mark);
        saveSave();
        addGems(CONFIG.gemThresholds.gems(mark), bird.x, bird.y - 56);
        addFloat(bird.x, bird.y - 78, '💎 EŞİK ÖDÜLÜ!', '#4dd0e1');

  function checkAchievements() {
    if (achChecking) return;

    let got = false;
    try {
      for (const a of CONFIG.achievements) {
        if (SAVE.ach[a.id]) continue;
        let ok = false;
        try { ok = !!a.test(); } catch (_) { ok = false; }
        if (ok) {
          SAVE.ach[a.id] = true;
          got = true;
          pushNotif('🏅 BAŞARIM: ' + a.name, a.desc + ' → +' + a.star + '⭐ +' + a.gem + '💎');
          if (a.star) addStars(a.star);

          sAch();
        }
      }
    } catch (_) { /* ignore */ }
    achChecking = false;

  /* ---------------- color helpers ---------------- */
  function parseRGB(col) {
    if (!col) return [0, 0, 0];
    if (col[0] === '#') {
      let h = col.slice(1);
      if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
      const n = parseInt(h, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    const m = String(col).match(/\d+/g);
    if (m && m.length >= 3) return [Number(m[0]), Number(m[1]), Number(m[2])];
    return [0, 0, 0];
  }
  function mixHex(a, b, t) {
    const [ra, ga, ba] = parseRGB(a);
    const [rb, gb, bb] = parseRGB(b);
    const r = clamp(Math.round(ra + (rb - ra) * t), 0, 255);
    const g = clamp(Math.round(ga + (gb - ga) * t), 0, 255);
    const bl = clamp(Math.round(ba + (bb - ba) * t), 0, 255);
    return '#' + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1);
  }
  function colorBrightness(col) {
    const [r, g, b] = parseRGB(col);
    return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  }
  function quantizeColor(col, levels = 8) {
    const [r, g, b] = parseRGB(col);
    const step = 256 / levels;
    const qr = clamp(Math.floor(r / step), 0, levels - 1);
    const qg = clamp(Math.floor(g / step), 0, levels - 1);
    const qb = clamp(Math.floor(b / step), 0, levels - 1);
    return '' + qr + '-' + qg + '-' + qb;
  }
  function mixN(a, b, t) { return a + (b - a) * t; }
  function rgba(col, a) {
    if (col && col[0] === '#') {   // hex (3 or 6 digits)
      let h = col.slice(1);
      if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
      const n = parseInt(h, 16);
      return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    }
    const m = String(col).match(/\d+/g);
    if (!m) return 'rgba(255,255,255,' + a + ')';
    return 'rgba(' + m[0] + ',' + m[1] + ',' + m[2] + ',' + a + ')';
  }
  function scaleColor(col, mul) {
    if (mul >= .999 || !col) return col;
    if (col[0] === '#') {
      let h = col.slice(1);
      if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
      const n = parseInt(h, 16);
      const r = clamp(Math.round(((n >> 16) & 255) * mul), 0, 255);
      const g = clamp(Math.round(((n >> 8) & 255) * mul), 0, 255);
      const b = clamp(Math.round((n & 255) * mul), 0, 255);
      return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
    }
    const m = String(col).match(/\d+/g);
    if (!m || m.length < 3) return col;
    const r = clamp(Math.round(Number(m[0]) * mul), 0, 255);
    const g = clamp(Math.round(Number(m[1]) * mul), 0, 255);
    const b = clamp(Math.round(Number(m[2]) * mul), 0, 255);
    return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
  }
  function worldColorMul() {
    const t = SAVE && SAVE.settings && SAVE.settings.theme;
    return t === 'amoled' ? .45 : t === 'dark' ? .65 : 1;
  }
  function darkenThemeObj(obj, mul) {
    if (mul >= .999) return obj;
    return {
      top: scaleColor(obj.top, mul),
      mid: scaleColor(obj.mid, mul),
      bot: scaleColor(obj.bot, mul),
      sunA: obj.sunA * mul,
      moonA: obj.moonA,
      starA: Math.max(obj.starA, mul < .5 ? .55 : obj.starA),
      sunCol: scaleColor(obj.sunCol, mul),
      hillA: scaleColor(obj.hillA, mul),
      hillB: scaleColor(obj.hillB, mul),
      mtnA: scaleColor(obj.mtnA, mul),
      mtnB: scaleColor(obj.mtnB, mul),
      cloudCol: scaleColor(obj.cloudCol, mul),
      cloudA: obj.cloudA * (mul < .5 ? .65 : .85),
      darkA: obj.darkA
    };
  }

  /* ---------------- day / night themes ---------------- */
  const THEMES = [
    { top: '#54c1fd', mid: '#a9e7ff', bot: '#e8fbf3', sunA: 1,   moonA: 0,   starA: 0,   sunCol: '#fff6c8', hillA: '#96e3a8', hillB: '#72cf8b', mtnA: '#9fd8c2', mtnB: '#7fc2a8', cloudCol: '#ffffff', cloudA: .92, darkA: 0   }, // gündüz
    { top: '#6f5bb0', mid: '#ff9d76', bot: '#ffdfae', sunA: .9,  moonA: 0,   starA: .15, sunCol: '#ffb45e', hillA: '#c9b97b', hillB: '#a99a5f', mtnA: '#c091c4', mtnB: '#a06fae', cloudCol: '#ffe4c8', cloudA: .75, darkA: .07 }, // gün batımı
    { top: '#101a3e', mid: '#2b3d69', bot: '#3f5386', sunA: 0,   moonA: 1,   starA: 1,   sunCol: '#fff7c4', hillA: '#35624f', hillB: '#2a5143', mtnA: '#2a3a60', mtnB: '#212e4c', cloudCol: '#8fa3c8', cloudA: .45, darkA: .27 }, // gece
    { top: '#7d82c8', mid: '#f4a9c3', bot: '#ffe8d2', sunA: .55, moonA: .25, starA: .35, sunCol: '#ffd9a8', hillA: '#93cd9d', hillB: '#78bd88', mtnA: '#b5a0cc', mtnB: '#9784b6', cloudCol: '#ffe8ef', cloudA: .75, darkA: .09 }  // şafak
  ];

  function theme() {
    let base = null;
    // Purchased backgrounds use their own fixed palette.
    if (bg !== 'klasik') {
      const bd = BGS.find(b => b.id === bg);
      if (bd && bd.th) base = bd.th;
    }
    if (!base) {
      // Cycle every 10 points: day → sunset → night → dawn → day ...
      const f = (score % 40) / 10;
      const i0 = Math.floor(f) % 4, i1 = (i0 + 1) % 4;
      let t = f % 1;
      t = t * t * (3 - 2 * t);
      const A = THEMES[i0], B = THEMES[i1];
      base = {
        top: mixHex(A.top, B.top, t), mid: mixHex(A.mid, B.mid, t), bot: mixHex(A.bot, B.bot, t),
        sunA: mixN(A.sunA, B.sunA, t), moonA: mixN(A.moonA, B.moonA, t), starA: mixN(A.starA, B.starA, t),
        sunCol: mixHex(A.sunCol, B.sunCol, t),
        hillA: mixHex(A.hillA, B.hillA, t), hillB: mixHex(A.hillB, B.hillB, t),
        mtnA: mixHex(A.mtnA, B.mtnA, t), mtnB: mixHex(A.mtnB, B.mtnB, t),
        cloudCol: mixHex(A.cloudCol, B.cloudCol, t), cloudA: mixN(A.cloudA, B.cloudA, t),
        darkA: mixN(A.darkA, B.darkA, t)
      };
    }
    return darkenThemeObj(base, worldColorMul());
  }

  const stars = [];
  for (let i = 0; i < 46; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * (FLOOR * .62), r: .6 + Math.random() * 1.4, ph: Math.random() * 6.28, big: Math.random() < .13 });

  }
