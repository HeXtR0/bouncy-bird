  /* ---------------- shop ---------------- */
  function shopLayout() {
    const panel = { x: 28, y: 66, w: 344, h: 508 };
    const back = { x: 44, y: 82, w: 72, h: 28 };
    const tabs = [];
    ctx.save();
    ctx.font = FONTS.f700_11;
    const names = ['SKİNLER', 'GÜÇLER', 'ARKA PLAN', 'İZLER', '💎 ÖZEL'];
    const gap = 4;
    let ws = names.map(n => textWidth(n) + 18);
    ctx.restore();
    const maxTabsW = panel.w - 24;
    const rawTabsW = ws.reduce((a, b) => a + b, 0) + gap * 4;
    if (rawTabsW > maxTabsW) {
      const ew = (maxTabsW - gap * 4) / 5;
      ws = [ew, ew, ew, ew, ew];
    }
    const totalTabsW = ws.reduce((a, b) => a + b, 0) + gap * 4;
    let tx = W / 2 - totalTabsW / 2;
    for (let i = 0; i < 5; i++) {
      tabs.push({ x: tx, y: 122, w: ws[i], h: 26 });
      tx += ws[i] + gap;
    }
    const listY = 156, listH = 388;
    const cols = [46, 210];
    const cw = 144, ch = shopTab === 1 ? 74 : 62, cardGap = 8;
    const items = shopItems();
    const rowCount = Math.max(1, Math.ceil(items.length / 2));
    const rows = [];
    for (let r = 0; r < rowCount; r++) rows.push(listY + r * (ch + cardGap));
    const totalContentH = rows.length * (ch + cardGap);
    shopScrollMax = Math.max(0, totalContentH - listH);
    shopScroll = clamp(shopScroll, 0, shopScrollMax);
    return { panel, back, tabs, cols, rows, cw, ch, gap: cardGap, listY, listH };
  }

  function specialItems() {
    // 💎 ÖZEL sekmesi: efsane skinler + özel iz + kalıcı güçler + Altın Çark / Efsane Yumurta
    const list = [];
    for (const s of SKINS) if (s.gem) list.push({ kind: 'skin', ref: s, price: s.price });
    for (const t of TRAILS) if (t.gem) list.push({ kind: 'trail', ref: t, price: t.price });
    list.push({ kind: 'perm', id: 'kalkan', icon: '🛡️', name: 'Otomatik Kalkan', desc: 'Her oyuna hazır kalkan', price: CONFIG.shop.special.permKalkan });
    list.push({ kind: 'perm', id: 'can', icon: '❤️', name: '+1 Can', desc: 'Her oyuna 1 ekstra can', price: CONFIG.shop.special.permCan });
    list.push({ kind: 'action', id: 'goldWheel', icon: '🎡', name: 'Altın Çark', desc: '💎 ile döner, ödülü süper', price: CONFIG.luck.wheel.goldCost });
    list.push({ kind: 'action', id: 'goldEgg', icon: '🥚', name: 'Efsane Yumurta', desc: 'Efsane skin çıkabilir', price: CONFIG.luck.egg.goldCost });
    return list;
  }

  function shopItems() {
    if (shopTab === 0) return SKINS.filter(s => !s.gem);   // efsane 💎 skinleri ÖZEL sekmesinde
    if (shopTab === 1) return BOOSTERS;
    if (shopTab === 2) return BGS;
    if (shopTab === 3) return TRAILS.filter(t => !t.gem);  // altın iz ÖZEL sekmesinde
    return specialItems();
  }

  function drawPrice(cx, cy, price, pstate, cur) {
    // pstate: 'selected' | 'owned' | 'afford' | 'locked' | 'action' | 'max'
    const sk = SK();
    const curIcon = cur === 'gem' ? '💎' : '⭐';
    const label = pstate === 'max' ? 'MAX'
      : pstate === 'selected' ? '✓ SEÇİLİ'
      : pstate === 'owned' ? (shopTab === 0 ? 'KUŞAN' : 'SEÇ')
      : pstate === 'action' ? 'AÇ →'
      : curIcon + ' ' + price;
    ctx.save();
    ctx.font = FONTS.f700_11;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const w = textWidth(label) + 18;
    ctx.fillStyle = (pstate === 'selected' || pstate === 'max') ? 'rgba(62, 203, 125, .95)'
      : pstate === 'owned' ? sk.accent
      : pstate === 'action' ? 'rgba(77, 205, 235, .95)'
      : pstate === 'afford' ? sk.warn : sk.panelSoft;
    roundRect(cx - w / 2, cy - 10, w, 20, 10);
    ctx.fill();
    ctx.fillStyle = pstate === 'locked' ? sk.textDim
      : pstate === 'owned' ? sk.textInv
      : (pstate === 'afford' && cur !== 'gem') ? '#5c4000' : '#fff';
    ctx.fillText(label, cx, cy + .5);
    ctx.restore();
  }

  function drawBgPreview(x, y, w, h, bd) {
    ctx.save();
    roundRect(x, y, w, h, 8);
    ctx.clip();
    const th = bd.th || THEMES[0];
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, th.top); g.addColorStop(.55, th.mid); g.addColorStop(1, th.bot);
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, h);
    if (th.starA > .3) {
      ctx.fillStyle = 'rgba(255, 255, 255, .8)';
      for (let i = 0; i < 7; i++) {
        ctx.beginPath(); ctx.arc(x + 12 + i * 17, y + 8 + (i % 3) * 7, 1.1, 0, Math.PI * 2); ctx.fill();
      }
    }
    if (th.sunA > .05) {
      ctx.fillStyle = th.sunCol;
      ctx.globalAlpha = th.sunA;
      ctx.beginPath(); ctx.arc(x + w - 18, y + 12, 6, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // hills
    ctx.fillStyle = th.hillA;
    ctx.beginPath(); ctx.arc(x + 26, y + h + 6, 22, Math.PI, 0); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 78, y + h + 6, 28, Math.PI, 0); ctx.fill();
    // mini pipes
    const body = bd.pipes ? bd.pipes.body : DEFAULT_PIPES;
    ctx.fillStyle = body[1];
    ctx.fillRect(x + 44, y + 14, 12, h - 14);
    ctx.fillRect(x + 92, y + 30, 12, h - 30);
    ctx.fillStyle = body[4];
    ctx.fillRect(x + 42, y + 14, 16, 5);
    ctx.fillRect(x + 90, y + 30, 16, 5);
    ctx.restore();
  }

  function drawShop() {
    const sk = SK();
    ctx.fillStyle = sk.overlay;
    ctx.fillRect(0, -UI_OY, W, H);

    const L = shopLayout();
    const e = Math.min(1, (performance.now() - shopOpenedAt) / 320);
    const eb = 1 - Math.pow(1 - e, 3);
    ctx.save();
    ctx.globalAlpha = e;
    ctx.translate(0, (1 - eb) * 22);

    panel(L.panel.x, L.panel.y, L.panel.w, L.panel.h, 24, sk.panel);

    // Back pill
    ctx.save();
    ctx.fillStyle = sk.panelSoft;
    roundRect(L.back.x, L.back.y, L.back.w, L.back.h, 14);
    ctx.fill();
    ctx.strokeStyle = sk.border;
    ctx.lineWidth = 1;
    roundRect(L.back.x, L.back.y, L.back.w, L.back.h, 14);
    ctx.stroke();
    ctx.fillStyle = sk.text;
    ctx.font = FONTS.f700_12;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('‹ GERİ', L.back.x + L.back.w / 2, L.back.y + L.back.h / 2 + .5);
    ctx.restore();

    // Bakiye çipleri (⭐ ve 💎 yan yana, sağ üst — drawWalletChip / formatCompact + fitTextFont ile)
    {
      const maxChipW = 104;
      const gw = measureWalletChip(gems, maxChipW);
      const sw = measureWalletChip(wallet, maxChipW);
      const gy = 84;
      drawWalletChip(L.panel.x + L.panel.w - 14 - gw, gy, 'gem', gems, null, maxChipW);
      drawWalletChip(L.panel.x + L.panel.w - 14 - gw - 6 - sw, gy, 'star', wallet, null, maxChipW);
    }

    // Tabs
    const tabNames = ['SKİNLER', 'GÜÇLER', 'ARKA PLAN', 'İZLER', '💎 ÖZEL'];
    for (let i = 0; i < 5; i++) {
      const t = L.tabs[i];
      const sel = shopTab === i;
      ctx.save();
      ctx.fillStyle = sel ? sk.accent : sk.panelSoft;
      roundRect(t.x, t.y, t.w, t.h, 13);
      ctx.fill();
      ctx.font = FONTS.f700_11;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = sel ? sk.textInv : sk.textDim;
      ctx.fillText(tabNames[i], t.x + t.w / 2, t.y + t.h / 2 + .5, t.w - 6);
      ctx.restore();
    }

    // Cards (panel içinde clip'li kaydırma alanı)
    const items = shopItems();
    const now = performance.now();
    ctx.save();
    roundRect(L.panel.x + 10, L.listY, L.panel.w - 20, L.listH, 14);
    ctx.clip();

    for (let i = 0; i < items.length; i++) {
      const col = i % 2, row = Math.floor(i / 2);
      const cx0 = L.cols[col], cy0 = L.rows[row] - shopScroll;
      if (cy0 + L.ch < L.listY - 4 || cy0 > L.listY + L.listH + 4) continue;
      const it = items[i];

      // Yetersiz bakiyede kart titrer
      const shaking = shopShakeI === i && now < shopShakeUntil;
      const jx = shaking ? Math.sin(now / 18) * CONFIG.feedback.failBuyAmp : 0;
      ctx.save();
      ctx.translate(jx, 0);

      // Sekmeye göre sahip / seçili / fiyat bilgisi
      let owned = false, selected = false, afford = true, cur = 'star', pstate = 'afford';
      let itemPrice = it.price;
      if (shopTab === 0) {
        owned = inv.skins.includes(it.id);
        selected = skin === it.id;
        afford = wallet >= it.price;
      } else if (shopTab === 1) {
        const lv = luckLevel(it.id);
        const maxLv = CONFIG.luck.power.maxLevel;
        itemPrice = luckNextPrice(it.id);
        if (lv >= maxLv || itemPrice === 0) { pstate = 'max'; selected = true; }
        else afford = wallet >= itemPrice;
      } else if (shopTab === 2) {
        owned = inv.bgs.includes(it.id);
        selected = bg === it.id;
        afford = wallet >= it.price;
      } else if (shopTab === 3) {
        owned = inv.trails.includes(it.id);
        selected = trailSel === it.id;
        afford = wallet >= it.price;
      } else {
        cur = 'gem';
        if (it.kind === 'skin') { owned = inv.skins.includes(it.ref.id); selected = skin === it.ref.id; }
        else if (it.kind === 'trail') { owned = inv.trails.includes(it.ref.id); selected = trailSel === it.ref.id; }
        else if (it.kind === 'perm') { owned = !!SAVE.perm[it.id]; selected = owned; }
        afford = gems >= it.price;
        if (it.kind === 'action') pstate = 'action';
      }
      const priceState = pstate === 'max' ? 'max' : selected ? 'selected' : owned ? 'owned' : (pstate === 'action' ? 'action' : afford ? 'afford' : 'locked');

      // Card background
      ctx.save();
      ctx.fillStyle = selected ? 'rgba(62, 203, 125, .14)' : (priceState === 'locked' ? sk.panelSoft : sk.panelAlt);
      ctx.strokeStyle = selected ? 'rgba(40, 168, 98, .8)' : sk.border;
      ctx.lineWidth = 1.6;
      roundRect(cx0, cy0, L.cw, L.ch, 14);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      if (shopTab === 0) {
        drawMiniBird(cx0 + 26, cy0 + 28, .62, it);
        ctx.save();
        ctx.fillStyle = sk.text;
        ctx.font = FONTS.f700_11;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(it.name, cx0 + 48, cy0 + 18, L.cw - 54);
        if (it.legendary) {
          ctx.fillStyle = '#e0a820';
          ctx.font = FONTS.f700_11;
          ctx.fillText('★ EFSANE', cx0 + 48, cy0 + 32, L.cw - 54);
        }
        ctx.restore();
        drawPrice(cx0 + L.cw / 2, cy0 + L.ch - 13, it.price, priceState, 'star');
      } else if (shopTab === 1) {
        const lv = luckLevel(it.id);
        const maxLv = CONFIG.luck.power.maxLevel;
        const pct = Math.round(lv * (CONFIG.luck.power.chance[it.id] || 0) * 100);
        ctx.save();
        ctx.font = '15px "Segoe UI Emoji", system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(it.icon, cx0 + 16, cy0 + 13);
        ctx.fillStyle = sk.text;
        ctx.font = FONTS.f700_11;
        ctx.textAlign = 'left';
        const st2 = inv.boost[it.id] || 0;
        ctx.fillText(it.name, cx0 + 28, cy0 + 12, L.cw - (st2 ? 64 : 34));
        if (st2) {
          ctx.fillStyle = 'rgba(62, 203, 125, .92)';
          roundRect(cx0 + L.cw - 34, cy0 + 5, 26, 14, 7);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.font = FONTS.f700_11;
          ctx.textAlign = 'center';
          ctx.fillText('×' + st2, cx0 + L.cw - 21, cy0 + 12.5, 22);
          ctx.textAlign = 'left';
        }
        ctx.fillStyle = sk.textDim;
        ctx.font = FONTS.f500_10;
        ctx.fillText(truncateText(it.desc, L.cw - 14), cx0 + 8, cy0 + 25, L.cw - 16);
        ctx.fillStyle = lv > 0 ? '#3ecb7d' : sk.textDim;
        ctx.font = FONTS.f600_11;
        const lvTxt = 'Seviye ' + lv + '/' + maxLv + ' · %' + pct;
        ctx.fillText(lvTxt, cx0 + 8, cy0 + 38, L.cw - 16);
        // Sürekli progress bar (min 6px, yuvarlak uçlu)
        const availW = L.cw - 16;
        const barH = 6;
        ctx.fillStyle = sk.panelSoft;
        roundRect(cx0 + 8, cy0 + 46, availW, barH, barH / 2);
        ctx.fill();
        if (lv > 0) {
          const fillW = Math.max(barH, Math.round((lv / maxLv) * availW));
          ctx.fillStyle = lv >= maxLv ? '#3ecb7d' : sk.accent;
          roundRect(cx0 + 8, cy0 + 46, fillW, barH, barH / 2);
          ctx.fill();
        }
        ctx.restore();
        drawPrice(cx0 + L.cw / 2, cy0 + L.ch - 12, itemPrice, priceState, 'star');
      } else if (shopTab === 2) {
        drawBgPreview(cx0 + 8, cy0 + 7, 50, 34, it);
        ctx.save();
        ctx.fillStyle = sk.text;
        ctx.font = FONTS.f700_11;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(it.name, cx0 + 64, cy0 + 24, L.cw - 70);
        ctx.restore();
        drawPrice(cx0 + L.cw / 2, cy0 + L.ch - 13, it.price, priceState, 'star');
      } else if (shopTab === 3) {
        ctx.save();
        if (it.cols) {
          for (let d2 = 0; d2 < it.cols.length; d2++) {
            ctx.fillStyle = it.cols[d2];
            ctx.beginPath();
            ctx.arc(cx0 + 14 + d2 * 7.5, cy0 + 20, 3.2, 0, Math.PI * 2);
            ctx.fill();
          }
        } else {
          ctx.strokeStyle = sk.textDim;
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(cx0 + 10, cy0 + 20); ctx.lineTo(cx0 + 38, cy0 + 20); ctx.stroke();
        }
        ctx.fillStyle = sk.text;
        ctx.font = FONTS.f700_11;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(it.name, cx0 + 52, cy0 + 20, L.cw - 58);
        ctx.restore();
        drawPrice(cx0 + L.cw / 2, cy0 + L.ch - 13, it.price, priceState, it.gem ? 'gem' : 'star');
      } else {
        // 💎 ÖZEL
        ctx.save();
        ctx.font = '16px "Segoe UI Emoji", system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const icon = it.kind === 'skin' ? '🐦' : it.kind === 'trail' ? '✨' : it.icon;
        ctx.fillText(icon, cx0 + 18, cy0 + 16);
        ctx.fillStyle = sk.text;
        ctx.font = FONTS.f700_11;
        ctx.textAlign = 'left';
        const nm = it.kind === 'skin' || it.kind === 'trail' ? it.ref.name : it.name;
        ctx.fillText(nm, cx0 + 32, cy0 + 14, L.cw - 38);
        ctx.fillStyle = sk.textDim;
        ctx.font = FONTS.f500_10;
        const dd = (it.kind === 'perm' || it.kind === 'action' ? it.desc : (it.kind === 'skin' ? 'Efsane skin' : 'Özel iz efekti'));
        ctx.fillText(truncateText(dd, L.cw - 38), cx0 + 32, cy0 + 29, L.cw - 38);
        ctx.restore();
        drawPrice(cx0 + L.cw / 2, cy0 + L.ch - 13, it.price, priceState, 'gem');
      }
      ctx.restore(); // shake translate
    }

    // Üst / alt gradient solma overlay
    if (shopScroll > 1) {
      const fgTop = ctx.createLinearGradient(0, L.listY, 0, L.listY + 18);
      fgTop.addColorStop(0, rgba(sk.panel, .95));
      fgTop.addColorStop(1, rgba(sk.panel, 0));
      ctx.fillStyle = fgTop;
      ctx.fillRect(L.panel.x + 10, L.listY, L.panel.w - 20, 18);
    }
    if (shopScroll < shopScrollMax - 1) {
      const fgBot = ctx.createLinearGradient(0, L.listY + L.listH - 18, 0, L.listY + L.listH);
      fgBot.addColorStop(0, rgba(sk.panel, 0));
      fgBot.addColorStop(1, rgba(sk.panel, .95));
      ctx.fillStyle = fgBot;
      ctx.fillRect(L.panel.x + 10, L.listY + L.listH - 18, L.panel.w - 20, 18);
    }

    // İnce scroll çubuğu (sağ iç kenar, yuvarlak, yarı şeffaf)
    if (shopScrollMax > 0) {
      const trackX = L.panel.x + L.panel.w - 14;
      const trackY = L.listY + 4;
      const trackH = L.listH - 8;
      ctx.fillStyle = sk.panelSoft;
      roundRect(trackX, trackY, 4, trackH, 2);
      ctx.fill();
      const thumbH = Math.max(26, trackH * (L.listH / (L.listH + shopScrollMax)));
      const thumbY = trackY + (trackH - thumbH) * (shopScroll / shopScrollMax);
      ctx.fillStyle = sk.textDim;
      roundRect(trackX, thumbY, 4, thumbH, 2);
      ctx.fill();
    }
    ctx.restore(); // clip restore

    // Hint
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = FONTS.f500_10;
    ctx.fillStyle = sk.textDim;
    const hintTxt = shopTab === 1 ? 'Güç seviyesini yükselt, her koşuda şansla aktif olsun'
      : shopTab === 3 ? 'Kuşandığın iz uçuşta seni takip eder'
      : shopTab === 4 ? '💎 ÖZEL: elmasla alınan efsanevi eşyalar'
      : 'Yıldız topla, mağazadan kuşan';
    ctx.fillText(hintTxt, W / 2, 558, L.panel.w - 28);
    ctx.restore();

    ctx.restore();
  }

  function shopCardAt(px, py) {
    const L = shopLayout();
    if (py < L.listY || py > L.listY + L.listH) return -1;
    const items = shopItems();
    for (let i = 0; i < items.length; i++) {
      const cx0 = L.cols[i % 2], cy0 = L.rows[Math.floor(i / 2)] - shopScroll;
      if (px >= cx0 && px <= cx0 + L.cw && py >= cy0 && py <= cy0 + L.ch) return i;
    }
    return -1;
  }

  let shopShakeI = -1, shopShakeUntil = 0, luckGold = false;
  function failBuy(idx, px, py, cur) {
    shopShakeI = idx;
    shopShakeUntil = performance.now() + CONFIG.feedback.failBuyDuration;
    sErr(); setVib(60);
    addFloat(px, py - 10, cur === 'gem' ? 'YETERSİZ 💎' : 'YETERSİZ ⭐', '#ff8a8a');
  }

  function shopTap(px, py) {
    if (performance.now() - shopOpenedAt < 200) return false;
    if (shopDrag && shopDrag.moved) return false;
    const L = shopLayout();
    const fy = py + UI_OY;
    if (px >= L.back.x && px <= L.back.x + L.back.w && py >= L.back.y && py <= L.back.y + L.back.h) {
      closeShop();
      return true;
    }
    for (let i = 0; i < 5; i++) {
      const t = L.tabs[i];
      if (px >= t.x && px <= t.x + t.w && py >= t.y && py <= t.y + t.h) {
        if (shopTab !== i) { shopTab = i; shopScroll = 0; shopDrag = null; sClick(); }
        return true;
      }
    }
    const idx = shopCardAt(px, py);
    if (idx >= 0) {
      const items = shopItems();
      const it = items[idx];
      if (shopTab === 0) {
        const isOwned = inv.skins.includes(it.id);
        if (isOwned) {
          skin = it.id; saveSkin();
          sClick();
          addFloat(px, fy - 10, 'SEÇİLDİ!', '#3ecb7d');
        } else if (spend('star', it.price)) {
          inv.skins.push(it.id);
          saveInv();
          skin = it.id; saveSkin();
          sBuy(); setVib(30);
          addFloat(px, fy - 10, 'SATIN ALINDI!', '#3ecb7d');
          burstSparks(14, px, fy, ['#ffd23f', '#3ecb7d', '#fff3b0']);
          checkAchievements();
        } else failBuy(idx, px, fy, 'star');
      } else if (shopTab === 1) {
        const lv = luckLevel(it.id);
        const maxLv = CONFIG.luck.power.maxLevel;
        const price = luckNextPrice(it.id);
        if (lv >= maxLv || price === 0) {
          shopShakeI = idx;
          shopShakeUntil = performance.now() + 420;
          sErr(); setVib(40);
          addFloat(px, fy - 10, 'ZATEN MAX', '#ffd23f');
        } else {
          if (spend('star', price)) {
            SAVE.luck.levels[it.id] = lv + 1;
            saveSave();
            sBuy(); setVib(30);
            const pct = Math.round(luckLevel(it.id) * (CONFIG.luck.power.chance[it.id] || 0) * 100);
            addFloat(px, fy - 10, 'SEVİYE ' + (lv + 1) + '/' + maxLv + ' · %' + pct, '#3ecb7d');
            burstSparks(14, px, fy, ['#ffd23f', '#3ecb7d', '#fff3b0']);
          } else failBuy(idx, px, fy, 'star');
        }
      } else if (shopTab === 2) {
        const isOwned = inv.bgs.includes(it.id);
        if (isOwned) {
          bg = it.id; saveBg();
          sClick();
          addFloat(px, fy - 10, 'SEÇİLDİ!', '#3ecb7d');
        } else if (spend('star', it.price)) {
          inv.bgs.push(it.id);
          saveInv();
          bg = it.id; saveBg();
          sBuy(); setVib(30);
          addFloat(px, fy - 10, 'SATIN ALINDI!', '#3ecb7d');
          burstSparks(14, px, fy, ['#ffd23f', '#3ecb7d', '#fff3b0']);
          checkAchievements();
        } else failBuy(idx, px, fy, 'star');
      } else if (shopTab === 3) {
        const isOwned = inv.trails.includes(it.id);
        if (isOwned) {
          trailSel = it.id; saveTrail();
          sClick();
          addFloat(px, fy - 10, 'SEÇİLDİ!', '#3ecb7d');
        } else if (spend('star', it.price)) {
          inv.trails.push(it.id);
          saveInv();
          trailSel = it.id; saveTrail();
          sBuy(); setVib(30);
          addFloat(px, fy - 10, 'SATIN ALINDI!', '#3ecb7d');
          burstSparks(14, px, fy, ['#ffd23f', '#3ecb7d', '#fff3b0']);
        } else failBuy(idx, px, fy, 'star');
      } else {
        // 💎 ÖZEL sekmesi
        if (it.kind === 'skin') {
          const isOwned = inv.skins.includes(it.ref.id);
          if (isOwned) {
            skin = it.ref.id; saveSkin();
            sClick();
            addFloat(px, fy - 10, 'SEÇİLDİ!', '#3ecb7d');
          } else if (spend('gem', it.price)) {
            inv.skins.push(it.ref.id);
            saveInv();
            skin = it.ref.id; saveSkin();
            sBuy(); setVib(30);
            addFloat(px, fy - 10, 'SATIN ALINDI!', '#3ecb7d');
            burstSparks(16, px, fy, ['#4dd0e1', '#ffd23f', '#ffffff']);
            checkAchievements();
          } else failBuy(idx, px, fy, 'gem');
        } else if (it.kind === 'trail') {
          const isOwned = inv.trails.includes(it.ref.id);
          if (isOwned) {
            trailSel = it.ref.id; saveTrail();
            sClick();
            addFloat(px, fy - 10, 'SEÇİLDİ!', '#3ecb7d');

  function resetAllData() {

        if (k && k.startsWith('flappy-')) toDelete.push(k);

      for (const k of toDelete) localStorage.removeItem(k);

  function settingsTap(px, py) {

          if (px >= 46 + i * 105 && px <= 46 + i * 105 + 98 && py >= r.y + 18 && py <= r.y + 42) {

            st.diff = ['kolay', 'normal', 'zor'][i];
            saveSave(); sClick(); setVib(20);
            return true;
          }
        }
      } else if (r.id === 'sfx' || r.id === 'mus') {
        // ses seviyesi düğmeleri
        if (px >= 282 && px <= 306 && py >= r.y + 4 && py <= r.y + 30) {
          const k = r.id === 'sfx' ? 'sfxVol' : 'musVol';
          st[k] = Math.max(0, Math.round((st[k] - .1) * 10) / 10);
          saveSave(); sClick();
          return true;
        }
        if (px >= 314 && px <= 338 && py >= r.y + 4 && py <= r.y + 30) {
          const k = r.id === 'sfx' ? 'sfxVol' : 'musVol';
          st[k] = Math.min(1, Math.round((st[k] + .1) * 10) / 10);
          saveSave(); sClick();
          return true;
        }
        if (r.id === 'sfx') { toggleSfx(); setVib(20); return true; }
        else { toggleMus(); return true; }
      } else if (r.id === 'vib') {
        st.vib = !st.vib; saveSave(); sClick(); if (st.vib) setVib(30);
        return true;
      } else if (r.id === 'perf') {
        st.lowPerf = !st.lowPerf; saveSave(); sClick();
        invalidateVisualCaches(); resizeCanvas();
        return true;
      } else if (r.id === 'ctrl') {
        if (px >= 180 && px <= 254) st.ctrl = 'tap';
        else if (px >= 255 && px <= 354) st.ctrl = 'hold';
        else return true;
        saveSave(); sClick();
        return true;
      } else if (r.id === 'luck') {
        st.hideLuck = !st.hideLuck; saveSave(); sClick();
        return true;
      } else if (r.id === 'transfer') {
        if (px >= 46 && px <= 354) { openScreen('transfer'); return true; }
      } else if (r.id === 'share') {
        if (px >= 46 && px <= 354) { openScreen('share'); return true; }
      } else if (r.id === 'reset') {
        if (px >= 46 && px <= 354) {
          resetConfirm = true;
          sClick(); setVib(30);
          return true;
        }
      }

  function drawCoin() {
    const sk = SK();
    ctx.fillStyle = sk.overlay;
    ctx.fillRect(0, -UI_OY, W, H);
    const { e, eb } = screenOpenAnim();
    ctx.save();
    ctx.globalAlpha = e;
    ctx.translate(0, (1 - eb) * 24);
    panel(28, 66, 344, 508, 24, sk.panel);
    drawBackBtn();
    screenTitle('🪙 ŞANSLI YAZI TURA', 'Kuş madalyonu havada döner — tahmin et!');
    // miktar seçimi
    const amounts = CONFIG.luck.coin.amounts;
    for (let i = 0; i < amounts.length; i++) {
      ctx.save();
      const sel = coinSel === amounts[i];
      ctx.fillStyle = sel ? 'rgba(255, 190, 40, .95)' : sk.panelSoft;
      roundRect(46 + i * 78, 138, 70, 28, 14);
      ctx.fill();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '700 12px ' + FONT;
      ctx.fillStyle = sel ? '#5c4000' : sk.textDim;
      ctx.fillText('⭐ ' + amounts[i], 46 + i * 78 + 35, 152.5);
      ctx.restore();
    }
    // madalyon animasyon hesapları
    const spin = luckAnim && luckAnim.kind === 'coin' && !luckAnim.done;
    const sp = spin ? luckAnim.t * (14 - luckAnim.t * 6) : 0;
    const cosVal = spin ? Math.cos(sp) : (luckAnim && luckAnim.kind === 'coin' && luckAnim.done && luckAnim.result === 'tura' ? -1 : 1);
    const faceFade = spin ? Math.abs(cosVal) : 1;
    const showFront = spin ? (cosVal >= 0) : (luckAnim && luckAnim.kind === 'coin' && luckAnim.done ? luckAnim.result !== 'tura' : true);

    ctx.save();
    ctx.translate(W / 2, 296);
    if (spin) {
      ctx.scale(Math.max(.12, Math.abs(cosVal)), 1);
      ctx.rotate(Math.sin(luckAnim.t * 20) * .2);
      // Motion blur halesi (hızlı dönüşte)
      ctx.save();
      ctx.globalAlpha = 0.28 * Math.min(1, Math.abs(Math.sin(sp)) * 1.6);
      ctx.fillStyle = '#ffe08a';
      ctx.beginPath(); ctx.ellipse(0, 0, 58, 52, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else if (luckAnim && luckAnim.kind === 'coin' && luckAnim.done && luckAnim.result === 'tura') {
      ctx.scale(-1, 1);
    }

    // 5 duraklı metalik gradient disk
    const cv = CONFIG.luckVisuals.coin;
    const mg = ctx.createLinearGradient(-35, -50, 35, 50);
    for (const st of cv.metallicStops) mg.addColorStop(st[0], st[1]);
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.arc(0, 0, cv.outerRadius, 0, Math.PI * 2); ctx.fill();

    // 36 tırtık (reeded edge)
    ctx.save();
    ctx.strokeStyle = cv.rimColor;
    ctx.lineWidth = 1.6;
    for (let i = 0; i < cv.reedTicks; i++) {
      const ang = i * Math.PI * 2 / cv.reedTicks;
      ctx.beginPath();
      ctx.moveTo(Math.cos(ang) * 46, Math.sin(ang) * 46);
      ctx.lineTo(Math.cos(ang) * 51.5, Math.sin(ang) * 51.5);
      ctx.stroke();
    }
    ctx.restore();

    // İç altın halka
    ctx.strokeStyle = cv.rimColor; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(0, 0, cv.innerRadius, 0, Math.PI * 2); ctx.stroke();

    // Crossfade yüz çizimi (Kuş / Yıldız)
    ctx.save();
    ctx.globalAlpha = clamp(faceFade * 1.25, 0.25, 1);
    if (showFront) {
      ctx.save();
      ctx.translate(0, 4);

    let n = 0n;
    for (let i = 0; i < b43Str.length; i++) {
      const ch = b43Str[i];
      const idx = B43_ALPHABET.indexOf(ch);
      if (idx === -1) throw new Error('Geçersiz base43 karakteri: ' + ch);
      n = n * B43_BIGINT + BigInt(idx);
    }
    let hex = n.toString(16);
    if (hex.length % 2 !== 0) hex = '0' + hex;
    if (!hex.startsWith('01')) throw new Error('Geçersiz sentinel baytı');
    hex = hex.slice(2);
    let binStr = '';
    for (let i = 0; i < hex.length; i += 2) {
      binStr += String.fromCharCode(parseInt(hex.substr(i, 2), 16));
    }
    return binStr;
  }

  function base43ToByteArray(b43Str) {
    let n = 0n;
    for (let i = 0; i < b43Str.length; i++) {
      const ch = b43Str[i];
      const idx = B43_ALPHABET.indexOf(ch);
      if (idx === -1) throw new Error('Geçersiz base43 karakteri: ' + ch);
      n = n * B43_BIGINT + BigInt(idx);
    }
    let hex = n.toString(16);
    if (hex.length % 2 !== 0) hex = '0' + hex;
    if (!hex.startsWith('01')) throw new Error('Geçersiz sentinel baytı');
    hex = hex.slice(2);
    const arr = [];
    for (let i = 0; i < hex.length; i += 2) {
      arr.push(parseInt(hex.substr(i, 2), 16));
    }
    return arr;
  }

  const SETTINGS_THEMES = ['light', 'dark', 'amoled'];
  const SETTINGS_DIFFS = ['kolay', 'normal', 'zor'];
  const SETTINGS_CTRLS = ['tap', 'hold'];
  const STATS_NUM_FIELDS = [
    'games', 'jumps', 'starsWon', 'starsSpent', 'gemsWon', 'gemsSpent',
    'pipes', 'bestCombo', 'bestPerf', 'bestScore', 'playSec', 'bossWins', 'powerups'
  ];

  function writeVarint(buf, v) {
    v = Math.max(0, Math.floor(Number(v) || 0));
    while (v >= 0x80) {
      buf.push((v & 0x7f) | 0x80);
      v = Math.floor(v / 128);
    }
    buf.push(v & 0x7f);
  }

  function readVarint(buf, reader) {
    let res = 0, shift = 0;
    while (reader.pos < buf.length) {
      const b = buf[reader.pos++];
      res += (b & 0x7f) * Math.pow(2, shift);
      shift += 7;
      if ((b & 0x80) === 0) break;
    }
    return res;
  }

  function writeBitmask(buf, items, hasFn) {
    const numBytes = Math.ceil(items.length / 8);
    for (let b = 0; b < numBytes; b++) {
      let byteVal = 0;
      for (let bit = 0; bit < 8; bit++) {
        const idx = b * 8 + bit;
        if (idx < items.length && hasFn(items[idx], idx)) {
          byteVal |= (1 << bit);
        }
      }
      buf.push(byteVal);
    }
  }

  function readBitmask(buf, reader, count) {
    const numBytes = Math.ceil(count / 8);
    const bits = [];
    for (let b = 0; b < numBytes; b++) {
      const byteVal = buf[reader.pos++];
      for (let bit = 0; bit < 8; bit++) {
        if (bits.length < count) {
          bits.push((byteVal & (1 << bit)) !== 0);
        }
      }
    }
    return bits;
  }

  const BASE_EPOCH_MS = Date.UTC(2020, 0, 1);
  const MS_PER_DAY = 86400000;

  function dayKeyToDays(dk) {
    if (!dk || typeof dk !== 'string') return 0;
    const p = dk.split('-');
    if (p.length !== 3) return 0;
    const t = Date.UTC(+p[0], +p[1] - 1, +p[2]);
    if (isNaN(t)) return 0;
    return Math.max(0, Math.round((t - BASE_EPOCH_MS) / MS_PER_DAY));
  }

  function daysToDayKey(days) {
    if (typeof days !== 'number' || days <= 0) return '';
    const d = new Date(BASE_EPOCH_MS + days * MS_PER_DAY);
    return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
  }

  function encodeSaveFPS2() {
    flushSaves();
    SAVE.updatedAt = Date.now();
    try { localStorage.setItem(CONFIG.saveKey, JSON.stringify(SAVE)); } catch (_) {}
    const payload = {
      fmt: 'FPS2',
      v: SAVE_VERSION,
      updatedAt: SAVE.updatedAt,
      keys: {}
    };
    for (const k of [BEST_KEY, MUTE_KEY, WALLET_KEY, INV_KEY, SKIN_KEY, BG_KEY, TRAIL_KEY, PIPES_KEY, CONFIG.saveKey]) {
      const v = localStorage.getItem(k);
      if (v !== null) payload.keys[k] = v;
    }
    const jsonStr = JSON.stringify(payload);
    const b64 = LZString.compressToBase64(jsonStr);
    const binStr = atob(b64);
    const b43 = bytesToBase43(binStr);
    const crc = crc32(b43).toUpperCase();
    return 'FPS2.' + b43 + '.' + crc;
  }

  function encodeSave() {
    flushSaves();
    SAVE.updatedAt = Date.now();
    try { localStorage.setItem(CONFIG.saveKey, JSON.stringify(SAVE)); } catch (_) {}

    const bytes = [];

    // 1. Format sürümü: 1 bayt (=3)
    bytes.push(3);

    // 2. best (BEST_KEY), yıldız cüzdanı (WALLET_KEY), SAVE.gems: varint
    const curBest = Math.max(best, Number(localStorage.getItem(BEST_KEY)) || 0);
    const curWallet = Math.max(wallet, Number(localStorage.getItem(WALLET_KEY)) || 0);
    writeVarint(bytes, curBest);
    writeVarint(bytes, curWallet);
    writeVarint(bytes, SAVE.gems || 0);

    // 3. inv.skins, inv.bgs, inv.trails, inv.pipes: SKINS / BGS / TRAILS / PIPE_THEMES dizilerinin sırasına göre bitmask (sahipse 1). inv.boost: BOOSTERS sırasıyla her biri varint (yoksa 0)
    writeBitmask(bytes, SKINS, s => inv.skins && inv.skins.includes(s.id));
    writeBitmask(bytes, BGS, b => inv.bgs && inv.bgs.includes(b.id));
    writeBitmask(bytes, TRAILS, t => inv.trails && inv.trails.includes(t.id));
    writeBitmask(bytes, PIPE_THEMES, p => inv.pipes && inv.pipes.includes(p.id));
    for (const b of BOOSTERS) {
      writeVarint(bytes, (inv.boost && inv.boost[b.id]) || 0);
    }

    // 4. Seçili skin, bg, trailSel, pipesSel: dizideki indeks (1 bayt her biri). MUTE_KEY: bayrak
    const sIdx = SKINS.findIndex(s => s.id === skin);
    const bIdx = BGS.findIndex(b => b.id === bg);
    const trIdx = TRAILS.findIndex(t => t.id === trailSel);
    const pIdx = PIPE_THEMES.findIndex(p => p.id === pipesSel);
    bytes.push(sIdx === -1 ? 0 : sIdx);
    bytes.push(bIdx === -1 ? 0 : bIdx);
    bytes.push(trIdx === -1 ? 0 : trIdx);
    bytes.push(pIdx === -1 ? 0 : pIdx);
    const curMuted = muted || localStorage.getItem(MUTE_KEY) === '1';
    bytes.push(curMuted ? 1 : 0);

    // 5. SAVE.settings: theme, diff, ctrl indeksleri; sfx, mus, vib, lowPerf, hideLuck tek bayta bayrak olarak; sfxVol ve musVol 0-100 tam sayı
    const st = SAVE.settings || {};
    const thIdx = SETTINGS_THEMES.indexOf(st.theme);
    const dfIdx = SETTINGS_DIFFS.indexOf(st.diff);
    const ctIdx = SETTINGS_CTRLS.indexOf(st.ctrl);
    bytes.push(thIdx === -1 ? 0 : thIdx);
    bytes.push(dfIdx === -1 ? 1 : dfIdx);
    bytes.push(ctIdx === -1 ? 0 : ctIdx);

    let setFlags = 0;
    if (st.sfx) setFlags |= 1;
    if (st.mus) setFlags |= 2;
    if (st.vib) setFlags |= 4;
    if (st.lowPerf) setFlags |= 8;
    if (st.hideLuck) setFlags |= 16;
    bytes.push(setFlags);

    bytes.push(clamp(Math.round((Number(st.sfxVol) || 0) * 100), 0, 100));
    bytes.push(clamp(Math.round((Number(st.musVol) || 0) * 100), 0, 100));

    // 6. SAVE.stats: defaultStats() içindeki tüm sayısal alanlar sabit sırada varint; stats.luck'un 3 alanı; stats.modeGames CONFIG.modes sırasında varint
    const statsObj = SAVE.stats || {};
    for (const f of STATS_NUM_FIELDS) {
      writeVarint(bytes, Math.round(Number(statsObj[f]) || 0));
    }
    const sl = statsObj.luck || {};
    writeVarint(bytes, sl.tours || 0);
    writeVarint(bytes, sl.wins || 0);
    writeVarint(bytes, sl.bestStreak || 0);

    const sm = statsObj.modeGames || {};
    for (const m of CONFIG.modes) {
      writeVarint(bytes, sm[m.id] || 0);
    }

    // 7. SAVE.ach: başarım listesi sırasına göre bitmask (listeyi CONFIG içindeki `{ id: 'b1', ... test: ... }` dizisinde bul)
    writeBitmask(bytes, CONFIG.achievements, a => !!(SAVE.ach && SAVE.ach[a.id]));

    // 8. SAVE.streak: last (dayKey → 2020-01-01'den gün sayısı, varint), count, pending
    const strk = SAVE.streak || {};
    writeVarint(bytes, dayKeyToDays(strk.last));
    writeVarint(bytes, strk.count || 0);
    writeVarint(bytes, strk.pending || 0);

    // 9. SAVE.luck.levels ve SAVE.luck.misses: güç id'lerinin sırasıyla varint
    const lk = SAVE.luck || {};
    const lkLv = lk.levels || {};
    const lkMs = lk.misses || {};
    for (const b of BOOSTERS) {
      writeVarint(bytes, lkLv[b.id] || 0);
    }
    for (const b of BOOSTERS) {
      writeVarint(bytes, lkMs[b.id] || 0);
    }

    // 10. SAVE.top: adet (1 bayt) + her giriş için skor (varint), mod indeksi (1 bayt), gün (2020'den gün sayısı, varint). İçe aktarırken d alanı yine dayKey biçiminde yazılsın (istatistik ekranı t.d'yi gösteriyor)
    const topArr = Array.isArray(SAVE.top) ? SAVE.top.slice(0, 10) : [];
    bytes.push(topArr.length);
    for (let i = 0; i < topArr.length; i++) {
      const it = topArr[i] || {};
      writeVarint(bytes, it.s || 0);
      const mIdx = CONFIG.modes.findIndex(m => m.id === it.m);
      bytes.push(mIdx === -1 ? 0 : mIdx);
      writeVarint(bytes, dayKeyToDays(it.d));
    }

    // 11. SAVE.mbest: her mod için varint
    const mb = SAVE.mbest || {};
    for (const m of CONFIG.modes) {
      writeVarint(bytes, mb[m.id] || 0);
    }

    // 12. SAVE.perm: iki bayrak (1 bayt)
    const pm = SAVE.perm || {};
    let permByte = 0;
    if (pm.kalkan) permByte |= 1;
    if (pm.can) permByte |= 2;
    bytes.push(permByte);

    // 13. updatedAt: saniye cinsinden 4 bayt
    const sec = Math.floor((SAVE.updatedAt || Date.now()) / 1000);
    bytes.push(sec & 0xff, (sec >> 8) & 0xff, (sec >> 16) & 0xff, (sec >>> 24) & 0xff);

    // 14. Sağlama: önceki tüm baytların CRC32'sinin alt 2 baytı
    const crc = crc32Val(bytes);
    const crcLow = crc & 0xffff;
    bytes.push(crcLow & 0xff, (crcLow >> 8) & 0xff);

    const b43 = bytesToBase43(bytes);
    return 'FPS3.' + b43;
  }

  function decodeSave(code) {
    if (!code || typeof code !== 'string') throw new Error('Kayıt kodu boş');
    const trimmed = code.trim();

    if (/^FPS3\./i.test(trimmed)) {
      const b43 = trimmed.slice(5).replace(/\s+/g, '');
      const bytes = base43ToByteArray(b43);
      if (bytes.length < 25) throw new Error('Eksik veya bozuk veri');

      const payloadBytes = bytes.slice(0, bytes.length - 2);
      const expectedCrc = bytes[bytes.length - 2] | (bytes[bytes.length - 1] << 8);
      const computedCrc = crc32Val(payloadBytes) & 0xffff;
      if (expectedCrc !== computedCrc) {
        throw new Error('Bozuk veya eksik veri (CRC doğrulaması başarısız)');
      }

      const reader = { pos: 0 };
      // 1. Format sürümü: 1 bayt (=3)
      const ver = bytes[reader.pos++];
      if (ver !== 3) throw new Error('Desteklenmeyen format sürümü: ' + ver);

      // 2. best, wallet, gems
      const bestVal = readVarint(bytes, reader);
      const walletVal = readVarint(bytes, reader);
      const gemsVal = readVarint(bytes, reader);

      // 3. inv.skins, inv.bgs, inv.trails, inv.pipes, inv.boost
      const skinBits = readBitmask(bytes, reader, SKINS.length);
      const impSkins = [];
      for (let i = 0; i < SKINS.length; i++) {
        if (skinBits[i]) impSkins.push(SKINS[i].id);
      }
      if (!impSkins.includes('klasik')) impSkins.unshift('klasik');

      const bgBits = readBitmask(bytes, reader, BGS.length);
      const impBgs = [];
      for (let i = 0; i < BGS.length; i++) {
        if (bgBits[i]) impBgs.push(BGS[i].id);
      }
      if (!impBgs.includes('klasik')) impBgs.unshift('klasik');

      const trailBits = readBitmask(bytes, reader, TRAILS.length);
      const impTrails = [];
      for (let i = 0; i < TRAILS.length; i++) {
        if (trailBits[i]) impTrails.push(TRAILS[i].id);
      }
      if (!impTrails.includes('yok')) impTrails.unshift('yok');

      const pipeBits = readBitmask(bytes, reader, PIPE_THEMES.length);
      const impPipes = [];
      for (let i = 0; i < PIPE_THEMES.length; i++) {
        if (pipeBits[i]) impPipes.push(PIPE_THEMES[i].id);
      }
      if (!impPipes.includes('klasik')) impPipes.unshift('klasik');

      const impBoost = {};
      for (const b of BOOSTERS) {
        const cnt = readVarint(bytes, reader);
        if (cnt > 0) impBoost[b.id] = cnt;
      }
      const importedInv = {
        skins: impSkins,
        bgs: impBgs,
        boost: impBoost,
        trails: impTrails,
        pipes: impPipes
      };

      // 4. Seçili skin, bg, trailSel, pipesSel, MUTE_KEY
      const sIdx = bytes[reader.pos++];
      const bIdx = bytes[reader.pos++];
      const trIdx = bytes[reader.pos++];
      const pIdx = bytes[reader.pos++];
      const mutedByte = bytes[reader.pos++];

      const selSkin = (sIdx >= 0 && sIdx < SKINS.length) ? SKINS[sIdx].id : 'klasik';
      const selBg = (bIdx >= 0 && bIdx < BGS.length) ? BGS[bIdx].id : 'klasik';
      const selTrail = (trIdx >= 0 && trIdx < TRAILS.length) ? TRAILS[trIdx].id : 'yok';
      const selPipes = (pIdx >= 0 && pIdx < PIPE_THEMES.length) ? PIPE_THEMES[pIdx].id : 'klasik';
      const isMuted = (mutedByte & 1) !== 0;

      // 5. SAVE.settings
      const thIdx = bytes[reader.pos++];
      const dfIdx = bytes[reader.pos++];
      const ctIdx = bytes[reader.pos++];
      const setFlags = bytes[reader.pos++];
      const sfxVolByte = bytes[reader.pos++];
      const musVolByte = bytes[reader.pos++];

      const impTheme = (thIdx >= 0 && thIdx < SETTINGS_THEMES.length) ? SETTINGS_THEMES[thIdx] : 'light';
      const impDiff = (dfIdx >= 0 && dfIdx < SETTINGS_DIFFS.length) ? SETTINGS_DIFFS[dfIdx] : 'normal';
      const impCtrl = (ctIdx >= 0 && ctIdx < SETTINGS_CTRLS.length) ? SETTINGS_CTRLS[ctIdx] : 'tap';

      const impSettings = {
        theme: impTheme,
        diff: impDiff,
        ctrl: impCtrl,
        sfx: (setFlags & 1) !== 0,
        mus: (setFlags & 2) !== 0,
        vib: (setFlags & 4) !== 0,
        lowPerf: (setFlags & 8) !== 0,
        hideLuck: (setFlags & 16) !== 0,
        sfxVol: clamp(sfxVolByte, 0, 100) / 100,
        musVol: clamp(musVolByte, 0, 100) / 100
      };

      // 6. SAVE.stats
      const impStats = defaultStats();
      for (const f of STATS_NUM_FIELDS) {
        impStats[f] = readVarint(bytes, reader);
      }
      impStats.luck = {
        tours: readVarint(bytes, reader),
        wins: readVarint(bytes, reader),
        bestStreak: readVarint(bytes, reader)
      };
      impStats.modeGames = {};
      for (const m of CONFIG.modes) {
        impStats.modeGames[m.id] = readVarint(bytes, reader);
      }

      // 7. SAVE.ach
      const achBits = readBitmask(bytes, reader, CONFIG.achievements.length);
      const impAch = {};
      for (let i = 0; i < CONFIG.achievements.length; i++) {
        if (achBits[i]) impAch[CONFIG.achievements[i].id] = true;
      }

      // 8. SAVE.streak
      const strkDays = readVarint(bytes, reader);
      const strkCount = readVarint(bytes, reader);
      const strkPending = readVarint(bytes, reader);
      const impStreak = {
        last: daysToDayKey(strkDays),
        count: strkCount,
        pending: strkPending
      };

      // 9. SAVE.luck.levels ve misses
      const impLevels = {}, impMisses = {};
      for (const b of BOOSTERS) {
        impLevels[b.id] = readVarint(bytes, reader);
      }
      for (const b of BOOSTERS) {
        impMisses[b.id] = readVarint(bytes, reader);
      }

      // 10. SAVE.top
      const topCount = bytes[reader.pos++];
      const impTop = [];
      for (let i = 0; i < topCount; i++) {
        const s = readVarint(bytes, reader);
        const mIdx = bytes[reader.pos++];
        const dDays = readVarint(bytes, reader);
        const m = (mIdx >= 0 && mIdx < CONFIG.modes.length) ? CONFIG.modes[mIdx].id : 'klasik';
        const d = daysToDayKey(dDays);
        impTop.push({ s, m, d });
      }

      // 11. SAVE.mbest
      const impMbest = {};
      for (const m of CONFIG.modes) {
        impMbest[m.id] = readVarint(bytes, reader);
      }
      impMbest.klasik = Math.max(impMbest.klasik || 0, bestVal);

      // 12. SAVE.perm
      const permByte = bytes[reader.pos++];
      const impPerm = {
        kalkan: (permByte & 1) !== 0,
        can: (permByte & 2) !== 0
      };

      // 13. updatedAt: 4 bayt saniye
      const b0 = bytes[reader.pos++];
      const b1 = bytes[reader.pos++];
      const b2 = bytes[reader.pos++];
      const b3 = bytes[reader.pos++];
      const sec = (b0 | (b1 << 8) | (b2 << 16) | (b3 << 24)) >>> 0;
      const updatedAtMs = sec * 1000;

      // SAVE.threshold: best'e ve mod rekorlarına göre üretilsin (100, 200, ... <= maxScore)
      const maxScore = Math.max(bestVal, ...Object.values(impMbest));
      const impThreshold = [];
      for (let mark = 100; mark <= maxScore; mark += 100) {
        impThreshold.push(mark);
      }

      // Reconstruct SAVE object
      const importedSave = {
        v: SAVE_VERSION,
        updatedAt: updatedAtMs,
        gems: gemsVal,
        settings: impSettings,
        stats: impStats,
        ach: impAch,
        tasks: { day: '', list: [] },
        streak: impStreak,
        luck: {
          day: '',
          tours: 0,
          wheelFreeUsed: false,
          coinStreak: 0,
          levels: impLevels,
          misses: impMisses
        },
        top: impTop,
        mbest: impMbest,
        perm: impPerm,
        convDay: '',
        convCount: 0,
        threshold: impThreshold,
        daily: { day: '', done: false }
      };

      return {
        fmt: 'FPS3',
        v: SAVE_VERSION,
        updatedAt: updatedAtMs,
        keys: {
          [BEST_KEY]: String(bestVal),
          [MUTE_KEY]: isMuted ? '1' : '0',
          [WALLET_KEY]: String(walletVal),
          [INV_KEY]: JSON.stringify(importedInv),
          [SKIN_KEY]: selSkin,
          [BG_KEY]: selBg,
          [TRAIL_KEY]: selTrail,
          [PIPES_KEY]: selPipes,
          [CONFIG.saveKey]: JSON.stringify(importedSave)
        }
      };
    } else if (/^FPS2\./i.test(trimmed)) {
      const cleaned = trimmed.replace(/\s+/g, '').toUpperCase();
      const parts = cleaned.split('.');
      if (parts.length !== 3) throw new Error('Eksik veya bozuk format');
      const b43 = parts[1];
      const expectedCrc = parts[2];
      const actualCrc = crc32(b43).toUpperCase();
      if (actualCrc !== expectedCrc) throw new Error('Bozuk veya eksik veri (CRC doğrulaması başarısız)');
      const binStr = base43ToBytes(b43);
      const b64 = btoa(binStr);
      const jsonStr = LZString.decompressFromBase64(b64);
      if (!jsonStr) throw new Error('Sıkıştırılmış veri açılamadı');
      const data = JSON.parse(jsonStr);
      if (!data || typeof data !== 'object' || !data.keys) throw new Error('Geçersiz kayıt yapısı');
      return data;
    } else if (trimmed.startsWith('FPS1.')) {
      const parts = trimmed.split('.');
      if (parts.length !== 3) throw new Error('Eksik veya bozuk format');
      const b64 = parts[1], expectedCrc = parts[2].toLowerCase();
      const actualCrc = crc32(b64).toLowerCase();
      if (actualCrc !== expectedCrc) throw new Error('Bozuk veya eksik veri (CRC doğrulaması başarısız)');
      const jsonStr = LZString.decompressFromBase64(b64);
      if (!jsonStr) throw new Error('Sıkıştırılmış veri açılamadı');
      const data = JSON.parse(jsonStr);
      if (!data || typeof data !== 'object' || !data.keys) throw new Error('Geçersiz kayıt yapısı');
      return data;
    } else {
      throw new Error('Geçersiz format (FPS3, FPS2 veya FPS1 ile başlamalı)');
    }
  }

  // 6. Transfer Ekranı Durumu ve Kamera Yöneticisi
  let transferTab = 0; // 0 = Gönder, 1 = Al
  let transferConflict = null; // { currentTs, incomingTs, payload }
  let transferCode = '';
  let transferQr = null;
  let videoEl = null;
  let cameraActive = false;
  let scanTimer = null;
  let fileInputEl = null;
  let photoInputEl = null;
  let cameraErrorMsg = '';

  function initTransferCamera() {
    if (!videoEl) {
      videoEl = document.createElement('video');
      videoEl.setAttribute('playsinline', 'true');
      videoEl.playsInline = true;
      videoEl.muted = true;
      videoEl.style.position = 'fixed';
      videoEl.style.left = '-9999px';
      videoEl.style.width = '2px';
      videoEl.style.height = '2px';
      videoEl.style.opacity = '0';
      videoEl.style.pointerEvents = 'none';
      document.body.appendChild(videoEl);
    }
    if (!fileInputEl) {
      fileInputEl = document.createElement('input');
      fileInputEl.type = 'file';
      fileInputEl.accept = 'image/*';
      fileInputEl.style.display = 'none';
      fileInputEl.addEventListener('change', e => handleFileSelect(e, false));
      document.body.appendChild(fileInputEl);
    }
    if (!photoInputEl) {
      photoInputEl = document.createElement('input');
      photoInputEl.type = 'file';
      photoInputEl.accept = 'image/*';
      photoInputEl.setAttribute('capture', 'environment');
      photoInputEl.style.display = 'none';
      photoInputEl.addEventListener('change', e => handleFileSelect(e, true));
      document.body.appendChild(photoInputEl);
    }
  }

  function handleCameraError(err) {
    cameraActive = false;
    sErr();
    console.warn(err);
    if (!err) {
      cameraErrorMsg = 'Kamera açılamadı';
      return;
    }
    const name = err.name || '';
    if (name === 'NotAllowedError' || name === 'SecurityError') {
      cameraErrorMsg = 'Kamera izni engellendi. Adres çubuğundaki kilit simgesinden kameraya izin ver, sonra tekrar dene';
    } else if (name === 'NotFoundError') {
      cameraErrorMsg = 'Kamera bulunamadı';
    } else if (name === 'NotReadableError') {
      cameraErrorMsg = 'Kamera başka uygulamada açık';
    } else {
      cameraErrorMsg = name || String(err);
    }
  }

  function requestCamera(constraints, isRetry = false) {
    navigator.mediaDevices.getUserMedia(constraints)
      .then(stream => {
        videoEl.srcObject = stream;
        const playPromise = videoEl.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(e => console.warn('videoEl.play() hatası:', e));
        }
        cameraActive = true;
        cameraErrorMsg = '';
        sClick();
        if (scanTimer) clearInterval(scanTimer);
        scanTimer = setInterval(scanCameraFrame, CONFIG.transfer.scanIntervalMs);
      })
      .catch(err => {
        console.warn(err);
        if (!isRetry && err && err.name === 'OverconstrainedError') {
          requestCamera({ video: true }, true);
          return;
        }
        handleCameraError(err);
      });
  }

  function startCamera() {
    initTransferCamera();
    if (cameraActive) return;
    cameraErrorMsg = '';

    if (typeof window !== 'undefined' && window.isSecureContext === false) {
      cameraErrorMsg = 'Kamera için https veya localhost gerekir';
      console.warn(cameraErrorMsg);
      sErr();
      return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      cameraErrorMsg = 'Kamera bulunamadı';
      console.warn(cameraErrorMsg);
      sErr();
      return;
    }

    requestCamera({
      video: {
        facingMode: 'environment',
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });
  }

  function stopCamera() {
    if (scanTimer) { clearInterval(scanTimer); scanTimer = null; }
    if (videoEl && videoEl.srcObject) {
      const stream = videoEl.srcObject;
      const tracks = stream.getTracks();
      tracks.forEach(t => t.stop());
      videoEl.srcObject = null;
    }
    cameraActive = false;
  }

  async function scanBarcodeFromCanvas(cvs) {
    if ('BarcodeDetector' in window) {
      try {
        const detector = new window.BarcodeDetector({ formats: ['qr_code'] });
        const barcodes = await detector.detect(cvs);
        if (barcodes && barcodes.length > 0 && barcodes[0].rawValue) {
          return barcodes[0].rawValue;
        }
      } catch (_) {}
    }
    if (typeof jsQR === 'function') {
      try {
        const c2d = cvs.getContext('2d');
        const img = c2d.getImageData(0, 0, cvs.width, cvs.height);
        const res = jsQR(img.data, cvs.width, cvs.height);
        if (res && res.data) return res.data;
      } catch (_) {}
    }
    return null;
  }

  async function scanCameraFrame() {
    if (!cameraActive || !videoEl || videoEl.readyState < 2) return;
    const vw = videoEl.videoWidth, vh = videoEl.videoHeight;
    if (!vw || !vh) return;
    const off = makeCanvas(vw, vh);
    const g = off.getContext('2d');
    g.drawImage(videoEl, 0, 0, vw, vh);
    const code = await scanBarcodeFromCanvas(off);
    if (code && /^FPS[123]\./i.test(code.trim())) {
      stopCamera();
      sBuy();
      processImportCode(code);
    }
  }

  function handleFileSelect(e, isPhoto = false) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
      const img = new Image();
      img.onload = async function() {
        const off = makeCanvas(img.width, img.height);
        const g = off.getContext('2d');
        g.drawImage(img, 0, 0);
        const code = await scanBarcodeFromCanvas(off);
        if (code) {
          cameraErrorMsg = '';
          sBuy();
          processImportCode(code);
        } else {
          const failMsg = isPhoto ? 'QR okunamadı, daha yakından çek' : 'Görselde QR bulunamadı';
          cameraErrorMsg = failMsg;
          addFloat(W / 2, 340 + UI_OY, failMsg, '#ff8a8a');
          sErr();
        }
      };
      img.onerror = function() {
        const failMsg = isPhoto ? 'QR okunamadı, daha yakından çek' : 'Görselde QR bulunamadı';
        cameraErrorMsg = failMsg;
        addFloat(W / 2, 340 + UI_OY, failMsg, '#ff8a8a');
        sErr();
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  }

  function applyImportedSave(incoming) {
    cancelPendingWrites();
    for (const k in incoming.keys) {
      try { localStorage.setItem(k, incoming.keys[k]); } catch (_) {}
    }
    pushNotif('✅ AKTARIM TAMAMLANDI', 'Kayıt başarıyla yüklendi!');
    sBuy(); setVib([40, 50, 40]);
    setTimeout(() => { try { location.reload(); } catch (_) {} }, 650);
  }

  function processImportCode(code) {
    try {
      const incoming = decodeSave(code);
      const currentTs = SAVE.updatedAt || 0;
      const incomingTs = incoming.updatedAt || 0;
      if (currentTs > incomingTs) {
        // Çakışma: mevcut kayıt daha yeni!
        transferConflict = { currentTs, incomingTs, payload: incoming };
        sErr(); setVib(50);
      } else {
        applyImportedSave(incoming);
      }
    } catch (err) {
      addFloat(W / 2, 340 + UI_OY, err.message, '#ff8a8a');
      sErr(); setVib(40);
    }
  }

  function prepareTransferQr() {
    transferCode = encodeSave();
    try {
      transferQr = qrcode(0, 'L');
      transferQr.addData(transferCode, 'Alphanumeric');
      transferQr.make();
    } catch (_) {
      try {
        transferQr = qrcode(0, 'M');
        transferQr.addData(transferCode, 'Alphanumeric');
        transferQr.make();
      } catch (e) {
        transferQr = null;
      }
    }
  }

  function drawTransfer() {
    const sk = SK();
    ctx.fillStyle = sk.overlay;
    ctx.fillRect(0, -UI_OY, W, H);
    const { e, eb } = screenOpenAnim();
    ctx.save();
    ctx.globalAlpha = e;
    ctx.translate(0, (1 - eb) * 24);
    panel(28, 66, 344, 508, 24, sk.panel);
    drawBackBtn();
    screenTitle('📲 CİHAZ AKTARIMI', 'Bulutsuz doğrudan QR & kod aktarımı');

    // Sekmeler: [ 📤 GÖNDER ] [ 📥 AL ]
    const tabY = 122, tabH = 28, tabW = 148;
    const tab0Sel = transferTab === 0, tab1Sel = transferTab === 1;
    drawBtn(46, tabY, tabW, tabH, 14, tab0Sel ? CONFIG.gradients.btnPrimary : [sk.panelSoft, sk.panelSoft, sk.panelSoft], '📤 GÖNDER', tab0Sel ? '#fff' : sk.textDim, FONTS.f700_11);
    drawBtn(206, tabY, tabW, tabH, 14, tab1Sel ? CONFIG.gradients.btnPrimary : [sk.panelSoft, sk.panelSoft, sk.panelSoft], '📥 AL', tab1Sel ? '#fff' : sk.textDim, FONTS.f700_11);

    if (transferTab === 0) {
      // GÖNDER SEKME
      if (!transferQr) prepareTransferQr();
      const qrBoxX = W / 2 - 130, qrBoxY = 154, qrBoxW = 260, qrBoxH = 260;
      ctx.save();
      ctx.fillStyle = '#ffffff';
      roundRect(qrBoxX, qrBoxY, qrBoxW, qrBoxH, 18);
      ctx.fill();
      ctx.strokeStyle = sk.border;
      ctx.lineWidth = 1.5;
      roundRect(qrBoxX, qrBoxY, qrBoxW, qrBoxH, 18);
      ctx.stroke();

      if (transferQr) {
        const count = transferQr.getModuleCount();
        const boxW = qrBoxW;
        const scale = canvas.width / W;
        const cellPx = Math.max(1, Math.floor((boxW * scale - 8 * 1) / count));
        const qrWDev = count * cellPx;
        const boxXDev = qrBoxX * scale;
        const boxYDev = (qrBoxY + UI_OY) * scale;
        const oxDev = Math.round(boxXDev + (boxW * scale - qrWDev) / 2);
        const oyDev = Math.round(boxYDev + (qrBoxH * scale - qrWDev) / 2);
        const cell = cellPx / scale;
        const ox = oxDev / scale;
        const oy = oyDev / scale - UI_OY;

        ctx.imageSmoothingEnabled = false;

  function transferTap(px, py) {
    if (transferConflict) {
      const mx = 36, my = 176;
      // [VAZGEÇ]
      if (px >= mx + 18 && px <= mx + 158 && py >= my + 176 && py <= my + 212) {
        transferConflict = null;
        sClick();
        return true;
      }
      // [ÜZERİNE YAZ]
      if (px >= mx + 170 && px <= mx + 310 && py >= my + 176 && py <= my + 212) {
        const payload = transferConflict.payload;
        transferConflict = null;
        applyImportedSave(payload);
        return true;
      }
      return true;
    }

    if (tapBack(px, py)) {
      stopCamera();
      cameraErrorMsg = '';
      return true;
    }

    const tabY = 122, tabH = 28, tabW = 148;
    // Sekmeler
    if (px >= 46 && px <= 46 + tabW && py >= tabY && py <= tabY + tabH) {
      if (transferTab !== 0) {
        transferTab = 0;
        stopCamera();
        cameraErrorMsg = '';
        prepareTransferQr();
        sClick();
      }
      return true;
    }
    if (px >= 206 && px <= 206 + tabW && py >= tabY && py <= tabY + tabH) {
      if (transferTab !== 1) {
        transferTab = 1;
        cameraErrorMsg = '';
        sClick();
      }
      return true;
    }

    if (transferTab === 0) {
      // [ 📋 KODU KOPYALA ]
      if (px >= 46 && px <= 194 && py >= 480 && py <= 514) {
        const code = encodeSave();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(
            () => addFloat(W / 2, 420 + UI_OY, '📋 KOD KOPYALANDI!', '#3ecb7d'),
            () => prompt('Kayıt Kodu (kopyala):', code));
        } else {
          prompt('Kayıt Kodu (kopyala):', code);
        }
        sClick();
        return true;
      }
      // [ 📤 PAYLAŞ ]
      if (px >= 206 && px <= 354 && py >= 476 && py <= 512) {
        const code = encodeSave();
        if (navigator.share) {
          navigator.share({ title: 'Bouncy Bird Save', text: code }).catch(() => {});
        } else if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(() => addFloat(W / 2, 420 + UI_OY, '📋 KOD KOPYALANDI!', '#3ecb7d'));
        } else {
          prompt('Kayıt Kodu:', code);
        }
        sClick();
        return true;
      }
      // [ 📡 NFC KARTINA YAZ ]
      if (px >= 46 && px <= 354 && py >= 516 && py <= 548) {
        writeNfcData(encodeSave(), false);
        return true;
      }
    } else {
      // [ 📷 KAMERAYI BAŞLAT / DURDUR ]
      if (px >= 46 && px <= 354 && py >= 356 && py <= 390) {
        if (!cameraActive) startCamera();
        else stopCamera();
        return true;
      }
      // [ 📸 FOTOĞRAFLA OKU ]
      if (px >= 46 && px <= 194 && py >= 398 && py <= 432) {
        initTransferCamera();
        if (photoInputEl) photoInputEl.click();
        sClick();
        return true;
      }
      // [ 📁 GALERİDEN SEÇ ]
      if (px >= 206 && px <= 354 && py >= 398 && py <= 432) {
        initTransferCamera();
        if (fileInputEl) fileInputEl.click();
        sClick();
        return true;
      }
      // [ 📡 NFC KARTINDAN OKU ]
      if (px >= 46 && px <= 354 && py >= 474 && py <= 508) {
        startNfcScan();
        return true;
      }
      // [ 📋 KOD YAPIŞTIR ]
      if (px >= 46 && px <= 354 && py >= 436 && py <= 470) {
        const code = prompt('Kayıt Kodunu Yapıştır (FPS3 / FPS2 / FPS1):');
        if (code) {
          if (/^FPS[123]\./i.test(code.trim())) {
            processImportCode(code);
          } else {
            addFloat(W / 2, 340 + UI_OY, 'Geçersiz format (FPS3 / FPS2 / FPS1)', '#ff8a8a');
            sErr();
          }
        }
        return true;
      }
    }
    return false;
  }

  /* ================= OYUNU PAYLAŞ (QR) ================= */
  let shareQr = null, lastShareUrl = '';
  function prepareShareQr() {
    const url = shareUrl();
    if (!url) { shareQr = null; return; }
    if (shareQr && lastShareUrl === url) return;
    lastShareUrl = url;
    try {
      shareQr = qrcode(0, 'M');
      shareQr.addData(url, 'Byte');
      shareQr.make();
    } catch (_) {
      try {
        shareQr = qrcode(0, 'L');
        shareQr.addData(url, 'Byte');
        shareQr.make();
      } catch (e) {
        shareQr = null;
      }
    }
  }

  function drawShare() {
    const sk = SK();
    ctx.fillStyle = sk.overlay;
    ctx.fillRect(0, -UI_OY, W, H);
    const { e, eb } = screenOpenAnim();
    ctx.save();
    ctx.globalAlpha = e;
    ctx.translate(0, (1 - eb) * 24);
    panel(28, 66, 344, 508, 24, sk.panel);
    drawBackBtn();
    screenTitle('🔗 OYUNU PAYLAŞ', 'Arkadaşınla paylaş ve birlikte oyna');

    prepareShareQr();
    const qrBoxX = W / 2 - 130, qrBoxY = 154, qrBoxW = 260, qrBoxH = 260;
    ctx.save();
    ctx.fillStyle = '#ffffff';
    roundRect(qrBoxX, qrBoxY, qrBoxW, qrBoxH, 18);
    ctx.fill();
    ctx.strokeStyle = sk.border;
    ctx.lineWidth = 1.5;
    roundRect(qrBoxX, qrBoxY, qrBoxW, qrBoxH, 18);
    ctx.stroke();

    if (shareQr) {
      const count = shareQr.getModuleCount();
      const boxW = qrBoxW;
      const scale = canvas.width / W;
      const cellPx = Math.max(1, Math.floor((boxW * scale - 8 * 1) / count));
      const qrWDev = count * cellPx;
      const boxXDev = qrBoxX * scale;
      const boxYDev = (qrBoxY + UI_OY) * scale;
      const oxDev = Math.round(boxXDev + (boxW * scale - qrWDev) / 2);
      const oyDev = Math.round(boxYDev + (qrBoxH * scale - qrWDev) / 2);
      const cell = cellPx / scale;
      const ox = oxDev / scale;
      const oy = oyDev / scale - UI_OY;

      ctx.imageSmoothingEnabled = false;
      ctx.fillStyle = '#0a0f24';
      for (let r = 0; r < count; r++) {
        for (let c = 0; c < count; c++) {
          if (shareQr.isDark(r, c)) {
            ctx.fillRect(ox + c * cell, oy + r * cell, cell, cell);
          }
        }
      }
    }
    ctx.restore();

    // Altında linki gösteren çip
    const url = shareUrl();
    chipDark(W / 2, 440, truncateText(url || 'Link yok', 260));

    // İki buton: "📋 KOPYALA" ve "📤 PAYLAŞ"
    drawBtn(46, 476, 148, 34, 17, CONFIG.gradients.btnCyan, '📋 KOPYALA', '#ffffff', FONTS.f700_11);
    drawBtn(206, 476, 148, 34, 17, CONFIG.gradients.btnSuccess, '📤 PAYLAŞ', '#ffffff', FONTS.f700_11);

    // NFC Butonu (Her cihazda görünür)
    drawBtn(46, 516, 308, 28, 14, [sk.panelSoft, sk.panelSoft, sk.panelSoft], '📡 NFC ETİKETİNE YAZ', sk.text, FONTS.f700_10);

    // Alt yazı
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = FONTS.f500_10;
    ctx.fillStyle = sk.textDim;
    ctx.fillText("Telefona dokun (AirDrop/QuickShare), NFC veya QR okut", W / 2, 556);
    ctx.restore();

    ctx.restore();
  }

  function shareTap(px, py) {
    if (tapBack(px, py)) return true;
    const url = shareUrl();
    if (!url) return false;
    // [ 📋 KOPYALA ]
    if (px >= 46 && px <= 194 && py >= 480 && py <= 514) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(
          () => addFloat(W / 2, 420 + UI_OY, '📋 LİNK KOPYALANDI!', '#3ecb7d'),
          () => prompt('Oyun linki (kopyala):', url));
      } else {
        prompt('Oyun linki (kopyala):', url);
      }
      sClick();
      return true;
    }
    // [ 📤 PAYLAŞ ]
    if (px >= 206 && px <= 354 && py >= 476 && py <= 512) {
      if (navigator.share) {
        navigator.share({ title: 'Bouncy Bird', text: 'Bouncy Bird oyna! (Tamamen internetsiz oynanabilir)', url: url }).catch(() => {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(() => addFloat(W / 2, 396 + UI_OY, '📋 LİNK KOPYALANDI!', '#3ecb7d'));
          } else {
            prompt('Oyun linki:', url);
          }
        });
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(() => addFloat(W / 2, 396 + UI_OY, '📋 LİNK KOPYALANDI!', '#3ecb7d'));
      } else {
        prompt('Oyun linki:', url);
      }
      sClick();
      return true;
    }

    if (px >= 46 && px <= 354 && py >= 516 && py <= 548) {
      writeNfcData(url, true);
      return true;
    }
    return false;

  function draw() {
    const th = theme();
    ctx.save();
    if (shakeT > 0) {
      const m = shakeMag * (shakeT / .55);
      ctx.translate((Math.random() * 2 - 1) * m, (Math.random() * 2 - 1) * m);
    }
    // Kamera zoom (ölümde hafif yakınlaşma)
    if (zoomT > 0 && state === 'gameover') {
      const z = 1 + .06 * Math.min(1, zoomT / .8);
      ctx.translate(W / 2, H / 2);
      ctx.scale(z, z);
      ctx.translate(-W / 2, -H / 2);
    }

    drawSky(th);
    drawBgOverlay();
    drawWinds();
    drawPipes();
    drawCoins();
    drawBats();
    drawGround(th);
    drawTrail();
    drawTrailParticles();
    drawBird();
    drawPickups();
    drawBoss();
    drawBullets();
    drawShots();
    drawParticles();
    if (bg === 'kar') drawSnow();

    // Night ambience over the world (HUD stays bright above it).
    if (th.darkA > .005) {
      ctx.fillStyle = 'rgba(12, 18, 48, ' + th.darkA.toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    drawHUD();
    // Menüler her zaman 400×600 tasarımında; dikeyde ortalanır.
    ctx.save();
    ctx.translate(0, UI_OY);
    if (state === 'ready') drawReady();
    if (state === 'paused') drawPaused();
    if (state === 'gameover') drawGameOver();
    if (state === 'shop') drawShop();
    if (state === 'modes') drawModes();
    if (state === 'tasks') drawTasks();
    if (state === 'stats') drawStats();
    if (state === 'settings') drawSettings();
    if (state === 'luck') drawLuck();
    if (state === 'luckCoin') drawCoin();
    if (state === 'luckWheel') drawWheel();
    if (state === 'luckEgg') drawEgg();
    if (state === 'luckCards') drawCards();
    if (state === 'transfer') drawTransfer();
    if (state === 'share') drawShare();
    ctx.restore();
    drawComboText();
    drawFloats();
    drawNotifs();

    if (flashA > .005) {
      ctx.fillStyle = 'rgba(255, 255, 255, ' + flashA.toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();

    // Ters yerçekimi modunda hafif mor ton (dünya + HUD üstü)
    if (mode === 'ters' && state === 'playing' && gravDir < 0) {
      ctx.fillStyle = 'rgba(150, 90, 255, .07)';
      ctx.fillRect(0, 0, W, H);
    }

    ctx.fillStyle = vignetteGradient();
    ctx.fillRect(0, 0, W, H);
  }

  /* ---------------- v4: zemin efektleri & bildirim kartları ---------------- */
  function drawBgOverlay() {
    // Purchased backgrounds get a light ambient layer (deterministik, zaman tabanlı — state yok).
    if (lowPerf()) return;
    const act = state === 'playing' || state === 'ready' || state === 'paused' || state === 'gameover' ||
      MENU_STATES.includes(state);
    if (!act) return;
    if (bg === 'volkan') {
      ctx.save();
      for (let i = 0; i < 8; i++) {
        const y = FLOOR - ((time * 26 + i * 67) % (FLOOR - 40));
        const x = 30 + (i * 53) % 340 + Math.sin(time * 1.7 + i * 2.39) * 8;
        ctx.globalAlpha = .5 * (1 - y / FLOOR);
        ctx.fillStyle = i % 2 ? '#ff9c4a' : '#ff6b3c';
        ctx.beginPath(); ctx.arc(x, y, 2 + (i % 3), 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    } else if (bg === 'okyanus') {
      ctx.save();
      ctx.globalAlpha = .3;
      ctx.strokeStyle = '#bfefff';
      ctx.lineWidth = 1.6;
      for (let i = 0; i < 10; i++) {
        const x = 20 + (i * 41) % 360 + Math.sin(time * 1.1 + i) * 6;
        const y = FLOOR - ((time * 34 + i * 53) % (FLOOR - 60));
        ctx.beginPath(); ctx.arc(x, y, 3 + (i % 4), 0, Math.PI * 2); ctx.stroke();
      }
      ctx.restore();
    } else if (bg === 'siber') {
      ctx.save();
      ctx.globalAlpha = .13;
      ctx.strokeStyle = '#ff6bcb';
      ctx.lineWidth = 1;
      const step = Math.max(96, Math.round((FLOOR - 40) / 5));
      for (let i = 0; i < 6; i++) {
        const y = 40 + i * step + (time * 12) % step;
        if (y < FLOOR) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        }
      }
      ctx.restore();
    } else if (bg === 'orman') {
      ctx.save();
      ctx.globalAlpha = .5;
      const span = Math.max(120, FLOOR - 180);
      for (let i = 0; i < 6; i++) {
        const x = (W + 20) - ((time * (30 + i * 7) + i * 80) % (W + 60));
        const y = 40 + (i * 83) % span + Math.sin(time * 2 + i) * 10;
        ctx.fillStyle = ['#3f8f5c', '#2f7a4c', '#6fae52'][i % 3];
        ctx.beginPath(); ctx.ellipse(x, y, 6, 3.4, Math.sin(i) * 2, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawNotifs() {
    if (!notifQ.length) return;
    const sk = SK();
    const n = notifQ[0];
    const inK = Math.min(1, n.t / .25);
    const outK = n.t > n.life - .3 ? Math.max(0, (n.life - n.t) / .3) : 1;
    const k = Math.min(inK, outK);
    const rise = (1 - inK) * -18;
    ctx.save();
    ctx.globalAlpha = k;
    ctx.translate(W / 2, 190 + rise);
    ctx.fillStyle = sk.panelAlt;
    roundRect(-138, -32, 276, 62, 16);
    ctx.fill();
    ctx.strokeStyle = sk.border;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = k;
    ctx.translate(W / 2, 190 + rise);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = FONTS.f700_13;
    ctx.fillStyle = sk.warn;
    ctx.fillText(n.title, 0, -13, 252);
    ctx.font = '500 11px ' + FONT;
    ctx.fillStyle = sk.text;
    ctx.fillText(n.sub, 0, 10, 252);
    ctx.restore();
  }

  function frame(now) {
    const rawMs = now - lastFrame;
    const dt = Math.min(rawMs / 1000, .033);
    lastFrame = now;
    if (rawMs > 0 && rawMs < 200) {
      perfEma += (rawMs - perfEma) / 120;
      if (perfEma > 22) {
        slowFramesT += dt;
        if (!autoLow) {
          autoLow = true;
          invalidateVisualCaches();
          resizeCanvas();
        }
      } else {
        slowFramesT = Math.max(0, slowFramesT - dt);
      }
    }
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  /* ---------------- events ---------------- */
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  window.addEventListener('keydown', e => {
    // Menü ekranlarında ESC/Space geri döner; Market'te ok tuşları kaydırır
    if (MENU_STATES.includes(state)) {
      if (state === 'settings' && resetConfirm && e.code === 'Escape' && !e.repeat) {
        e.preventDefault();
        resetConfirm = false;
        sClick();
        return;
      }
      if (state === 'shop' && (e.code === 'ArrowDown' || e.code === 'ArrowUp' || e.code === 'PageDown' || e.code === 'PageUp')) {
        e.preventDefault();
        const step = (e.code === 'PageDown' || e.code === 'PageUp') ? 140 : 44;
        const dir = (e.code === 'ArrowDown' || e.code === 'PageDown') ? 1 : -1;
        shopScroll = clamp(shopScroll + dir * step, 0, shopScrollMax);
        return;
      }
      e.preventDefault();
      if ((e.code === 'Escape' || e.code === 'Space' || e.code === 'Enter') && !e.repeat) {
        if (state === 'shop') closeShop();
        else closeScreen();
      }
      return;
    }
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      if (!e.repeat) flap();
      holdDown = true;    // basılı tut = yüksel (klavye)
    } else if (e.code === 'ArrowDown' && SAVE.settings.ctrl === 'hold' && state === 'playing') {
      e.preventDefault();
      if (bird) bird.vy = Math.min(MAX_FALL, bird.vy + 900);   // hızlı dalış
    } else if (e.code === 'KeyP' || e.code === 'Escape') {
      e.preventDefault();
      togglePause();
    } else if (e.code === 'KeyS') {
      if (state === 'ready' || state === 'gameover') openShop();
    } else if (e.code === 'KeyM') {
      toggleMute();
    }
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') holdDown = false;
  });
  function toGame(e) {
    const r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : null;
    const left = r ? r.left : 0, top = r ? r.top : 0, w = (r && r.width) || W, h = (r && r.height) || H;
    const uiShift = (state === 'ready' || state === 'paused' || state === 'gameover' || MENU_STATES.includes(state)) ? UI_OY : 0;
    return {
      x: (e.clientX - left) / w * W,
      y: (e.clientY - top) / h * H - uiShift
    };
  }
  canvas.addEventListener('wheel', e => {
    if (state !== 'shop') return;
    e.preventDefault();
    const delta = Math.abs(e.deltaY) >= 40 ? (e.deltaY > 0 ? 48 : -48) : e.deltaY;
    shopScroll = clamp(shopScroll + delta, 0, shopScrollMax);
  }, { passive: false });
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    ensureAudio();
    if (e.button !== undefined && e.pointerType === 'mouse' && e.button !== 0) return;
    const p = toGame(e);
    pressedPoint = p;
    if (MENU_STATES.includes(state)) {
      if (state === 'shop') {
        const L = shopLayout();
        const inList = p.x >= L.panel.x && p.x <= L.panel.x + L.panel.w && p.y >= L.listY && p.y <= L.listY + L.listH;
        if (inList && shopScrollMax > 0) {
          shopDrag = { startY: p.y, startScroll: shopScroll, moved: false };
          return;
        }
        shopDrag = null;
        if (shopTap(p.x, p.y)) return;
        sClick();
        return;
      }
      const fn = {
        modes: modesTap, tasks: tasksTap, stats: statsTap, settings: settingsTap,
        luck: luckTap, luckCoin: coinTap, luckWheel: wheelTap, luckEgg: eggTap, luckCards: cardsTap,
        transfer: transferTap, share: shareTap
      }[state];
      if (fn && fn(p.x, p.y)) return;
      return;                            // diğer ekranlarda yanlışlıkla uçuş başlamaz
    }
    if (state === 'ready') {
      // Giriş serisi kartı açıkken diğer dokunuşlar yutulur
      if (SAVE.streak.pending > 0) { readyTap(p.x, p.y); return; }
      if (readyTap(p.x, p.y)) return;
      flap();
      return;
    }
    if (state === 'paused') { togglePause(); return; }
    if (state === 'gameover') {
      if (gameoverTapExtra(p.x, p.y)) return;
      if (performance.now() - gameOverAt > 500) flap();   // başka yere dokun → yeniden başla
      return;
    }
    // playing: zıpla / basılı tut
    holdDown = true;
    flap();
  });
  canvas.addEventListener('pointermove', e => {
    if (state !== 'shop' || !shopDrag) return;
    const p = toGame(e);
    const dy = p.y - shopDrag.startY;
    if (Math.abs(dy) >= 5) shopDrag.moved = true;
    if (shopDrag.moved) {
      shopScroll = clamp(shopDrag.startScroll - dy, 0, shopScrollMax);
    }
  });
  canvas.addEventListener('pointerup', e => {
    holdDown = false;
    pressedPoint = null;
    if (state === 'shop' && shopDrag) {
      const dragged = shopDrag.moved;
      shopDrag = null;
      if (!dragged) {
        const p = toGame(e);
        if (!shopTap(p.x, p.y)) sClick();
      }
    }
  });
  canvas.addEventListener('pointercancel', () => { holdDown = false; shopDrag = null; pressedPoint = null; });
  canvas.addEventListener('pointerleave', () => { holdDown = false; shopDrag = null; pressedPoint = null; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  btnSound.addEventListener('click', e => { e.stopPropagation(); toggleMute(); });
  btnPause.addEventListener('click', e => { e.stopPropagation(); togglePause(); });
  window.addEventListener('beforeunload', flushSaves);
  window.addEventListener('pagehide', flushSaves);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (state === 'playing') { holdDown = false; state = 'paused'; syncButtons(); }
      stopCamera();
      flushSaves();
    }
  });

  // Redraw once the display font arrives.
  if (document.fonts && document.fonts.load) {
    document.fonts.load('600 52px Manrope').then(() => {
      measureCache.clear();
      invalidateVisualCaches();
      draw();
    }).catch(() => {});
  }

  measureCache.clear();
  invalidateVisualCaches();
  reset();
  fit();
  syncButtons();
  refreshDaily();          // günlük görevler / giriş serisi / atölye limitleri
  checkAchievements();     // yüklenen kayıttan açılmış rozetler

  // Konsol testleri için dışa aktarım
  window.encodeSave = encodeSave;
  window.decodeSave = decodeSave;
  window.encodeSaveFPS2 = encodeSaveFPS2;
  window._bossState = () => ({ boss, bossPending, bossPendingT, bossWarned, shots, bullets, pipes, score, bossNext, spawnTimer });
  window._spawnBoss = spawnBoss;
  window._defeatBoss = defeatBoss;
  window._escapeBoss = escapeBoss;
  window._bNew = bNew;
  window._sNew = sNew;
  window._getPipes = () => pipes;
  window._setBossNext = (n) => { bossNext = n; };
  window.startCamera = startCamera;
  window.stopCamera = stopCamera;
  window.handleCameraError = handleCameraError;
  window.getCameraErrorMsg = () => cameraErrorMsg;
  window.handleFileSelect = handleFileSelect;
  window.qrcode = qrcode;
  window.LZString = LZString;
  window.crc32 = crc32;
  window.CONFIG = CONFIG;
  window.SAVE = SAVE;
  window.TRAILS = TRAILS;
  window.getTrailSel = () => trailSel;
  window.setTrailSel = (t) => { trailSel = t; saveTrail(); };
  window.getParticles = () => particles;
  window.getBird = () => bird;
  window.getState = () => state;
  window.startRun = startRun;
  window.reset = reset;
  window.update = update;
  window.doFlap = doFlap;
  window.setHoldDown = (v) => { holdDown = v; };
  window.setMode = (m) => { mode = m; };
  window.drawGround = drawGround;
  window.getGroundOffset = () => groundOffset;
  window.getFgGroundOffset = () => fgGroundOffset;
  window.theme = theme;
  window.setScore = (s) => { score = s; };
  window.getScore = () => score;

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
