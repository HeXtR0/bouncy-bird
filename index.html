  }

  /* ---------------- drawing helpers ---------------- */
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function roundRectOn(g, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  function panel(x, y, w, h, r, fill) {
    const sk = SK();
    ctx.save();
    ctx.fillStyle = fill || sk.panel;
    roundRect(x, y, w, h, r || 24);
    ctx.fill();
    ctx.strokeStyle = sk.border;
    ctx.lineWidth = 1.5;
    roundRect(x, y, w, h, r || 24);
    ctx.stroke();
    ctx.restore();
  }

  let pressedPoint = null;
  function isBtnPressed(x, y, w, h) {
    return pressedPoint && pressedPoint.x >= x && pressedPoint.x <= x + w && pressedPoint.y >= y && pressedPoint.y <= y + h;
  }
  function drawBtn(x, y, w, h, r, stops, label, txtCol, font, disabled) {
    const pressed = isBtnPressed(x, y, w, h);
    ctx.save();
    if (pressed) {
      ctx.translate(x + w / 2, y + h / 2);
      ctx.scale(CONFIG.feedback.pressScale, CONFIG.feedback.pressScale);
      ctx.translate(-(x + w / 2), -(y + h / 2));
    }
    if (disabled) ctx.globalAlpha = 0.45;
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, stops[0]);
    g.addColorStop(0.5, stops[1]);
    g.addColorStop(1, stops[2]);
    ctx.fillStyle = g;
    roundRect(x, y, w, h, r || 16);
    ctx.fill();
    ctx.strokeStyle = SK().border;
    ctx.lineWidth = 1.4;
    roundRect(x, y, w, h, r || 16);
    ctx.stroke();
    if (label) {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = font || FONTS.f700_12;
      ctx.fillStyle = txtCol || '#ffffff';
      ctx.fillText(label, x + w / 2, y + h / 2 + 1);
    }
    ctx.restore();
  }

  function starPath(r1, r2, rot = -Math.PI / 2) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 ? r2 : r1;
      const a = rot + i * Math.PI / 5;
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
  }

  function sparkle(s) {
    // Four-point twinkle.
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const r = i % 2 ? s * .32 : s;
      const a = -Math.PI / 2 + i * Math.PI / 4;
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
  }

  /* ---------------- sky (offscreen katman önbellekleri) ---------------- */
  const visualCache = new Map();
  function cacheScale() {
    return clamp((canvas.width || W) / W, 1, lowPerf() ? 1.5 : 3);
  }
  function layerCache(key, w, h, build) {
    const s = cacheScale();
    const fullKey = key + '@' + s.toFixed(2);
    let img = visualCache.get(fullKey);
    if (img) return img;
    img = makeCanvas(w * s, h * s);
    const g = img.getContext('2d');
    g.setTransform(s, 0, 0, s, 0, 0);
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = 'high';
    build(g, w, h);
    if (visualCache.size > 80) visualCache.clear();
    visualCache.set(fullKey, img);
    return img;
  }
  function invalidateVisualCaches() {
    visualCache.clear();
    pipeSpriteCache.clear();
    measureCache.clear();
  }
  function classicThemeIndex() { return bg === 'klasik' ? Math.floor((score % 40) / 10) : 0; }
  function layeredPalette(th) {
    const idx = classicThemeIndex();
    return bg === 'klasik' ? darkenThemeObj(THEMES[idx], worldColorMul()) : th;
  }
  function paintCloudSprite(g, th) {
    g.fillStyle = 'rgba(110, 140, 180, ' + (.2 * th.cloudA).toFixed(3) + ')';
    g.beginPath(); g.ellipse(0, 9, 33, 9, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = rgba(th.cloudCol, .95 * th.cloudA);
    g.beginPath();
    g.arc(-20, 2, 14, 0, Math.PI * 2);
    g.arc(0, -6, 19, 0, Math.PI * 2);
    g.arc(20, 2, 15, 0, Math.PI * 2);
    g.arc(0, 5, 17, 0, Math.PI * 2);
    g.fill();
  }
  function paintMountain(g, x, base, w, h, col, capA) {
    g.fillStyle = col;
    g.beginPath();
    g.moveTo(x, base);
    g.lineTo(x + w * .5, base - h);
    g.lineTo(x + w, base);
    g.closePath();
    g.fill();
    if (capA > .02) {
      const px = x + w * .5, py = base - h;
      g.fillStyle = 'rgba(255, 255, 255, ' + capA.toFixed(3) + ')';
      g.beginPath();
      g.moveTo(px - w * .1, py + h * .14);
      g.lineTo(px, py);
      g.lineTo(px + w * .1, py + h * .14);
      g.quadraticCurveTo(px, py + h * .2, px - w * .1, py + h * .14);
      g.closePath();
      g.fill();
    }
  }

  function drawSky(th) {
    // Gökyüzü + güneş/ay/gezegen: skor başına bir kez üretilen katman.
    const thTag = SAVE.settings.theme || 'light';
    const skyKey = 'sky|' + bg + '|' + thTag + '|' + (bg === 'klasik' ? score : 0) + '|' + H;
    const sky = layerCache(skyKey, W, FLOOR, (g) => {
      const sg = g.createLinearGradient(0, 0, 0, FLOOR);
      sg.addColorStop(0, th.top);
      sg.addColorStop(.6, th.mid);
      sg.addColorStop(1, th.bot);
      g.fillStyle = sg;
      g.fillRect(0, 0, W, FLOOR);
      if (th.sunA > .01) {
        g.save();
        g.globalAlpha = th.sunA;
        const glow = g.createRadialGradient(318, 88, 6, 318, 88, 62);
        glow.addColorStop(0, rgba(th.sunCol, .95));
        glow.addColorStop(1, rgba(th.sunCol, 0));
        g.fillStyle = glow;
        g.beginPath(); g.arc(318, 88, 62, 0, Math.PI * 2); g.fill();
        g.globalAlpha = .1 * th.sunA;
        g.fillStyle = '#fff8dc';
        for (let i = 0; i < 10; i++) {
          const a = i * Math.PI * 2 / 10;
          g.beginPath();
          g.moveTo(Math.cos(a) * 30, Math.sin(a) * 30);
          g.lineTo(Math.cos(a) * 88, Math.sin(a) * 88);
          g.lineTo(Math.cos(a + .04) * 88, Math.sin(a + .04) * 88);
          g.closePath();
          g.fill();
        }
        g.globalAlpha = th.sunA;
        g.fillStyle = th.sunCol;
        g.beginPath(); g.arc(318, 88, 26, 0, Math.PI * 2); g.fill();
        g.restore();
      }
      if (th.moonA > .01) {
        g.save();
        g.globalAlpha = th.moonA;
        const mg = g.createRadialGradient(318, 88, 8, 318, 88, 52);
        mg.addColorStop(0, 'rgba(214, 228, 255, .55)');
        mg.addColorStop(1, 'rgba(214, 228, 255, 0)');
        g.fillStyle = mg;
        g.beginPath(); g.arc(318, 88, 52, 0, Math.PI * 2); g.fill();
        g.fillStyle = '#eef2fb';
        g.beginPath(); g.arc(318, 88, 22, 0, Math.PI * 2); g.fill();
        g.fillStyle = 'rgba(120, 140, 180, .25)';
        g.beginPath(); g.arc(311, 82, 5, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.arc(325, 94, 3.6, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.arc(322, 78, 2.6, 0, Math.PI * 2); g.fill();
        g.restore();
      }
      if (bg === 'uzay') {
        g.save();
        const pg = g.createRadialGradient(318, 88, 10, 318, 88, 70);
        pg.addColorStop(0, 'rgba(134, 232, 206, .5)');
        pg.addColorStop(1, 'rgba(134, 232, 206, 0)');
        g.fillStyle = pg;
        g.beginPath(); g.arc(318, 88, 70, 0, Math.PI * 2); g.fill();
        g.strokeStyle = 'rgba(150, 214, 255, .5)';
        g.lineWidth = 5;
        g.beginPath(); g.ellipse(318, 88, 46, 14, -.42, Math.PI * .04, Math.PI * .96); g.stroke();
        const body = g.createRadialGradient(310, 78, 6, 318, 88, 30);
        body.addColorStop(0, '#a5f0d8');
        body.addColorStop(1, '#3aa98a');
        g.fillStyle = body;
        g.beginPath(); g.arc(318, 88, 26, 0, Math.PI * 2); g.fill();
        g.save();
        g.beginPath(); g.arc(318, 88, 26, 0, Math.PI * 2); g.clip();
        g.fillStyle = 'rgba(255, 255, 255, .16)';
        g.fillRect(292, 78, 52, 5);
        g.fillRect(292, 92, 52, 7);
        g.fillStyle = 'rgba(40, 90, 80, .22)';
        g.fillRect(292, 104, 52, 4);
        g.restore();
        g.strokeStyle = 'rgba(190, 236, 255, .8)';
        g.lineWidth = 5;
        g.beginPath(); g.ellipse(318, 88, 46, 14, -.42, Math.PI * 1.04, Math.PI * 1.96); g.stroke();
        g.restore();
      }
    });
    ctx.drawImage(sky, 0, 0, sky.width, sky.height, 0, 0, W, FLOOR);

    // Yıldızlar canlı parlar; katmana gömülmez.
    if (th.starA > .01) {
      for (const s of stars) {
        const a = th.starA * (.4 + .6 * Math.abs(Math.sin(time * 1.8 + s.ph)));
        ctx.globalAlpha = a;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
        if (s.big) {
          ctx.globalAlpha = a * .7;
          ctx.fillRect(s.x - 4, s.y - .5, 8, 1);
          ctx.fillRect(s.x - .5, s.y - 4, 1, 8);
        }
      }
      ctx.globalAlpha = 1;
    }

    if (shoot && (th.moonA > .05 || th.starA > .3)) {
      ctx.save();
      ctx.globalAlpha = th.moonA * Math.min(1, shoot.life / shoot.max) * .9;
      const tx = shoot.x - shoot.vx * .13, ty = shoot.y - shoot.vy * .13;
      const lg = ctx.createLinearGradient(shoot.x, shoot.y, tx, ty);
      lg.addColorStop(0, 'rgba(255, 255, 255, .95)');
      lg.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.strokeStyle = lg;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(shoot.x, shoot.y); ctx.lineTo(tx, ty); ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(shoot.x, shoot.y, 1.6, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    const pal = layeredPalette(th);
    const idx = classicThemeIndex();
    // Dağlar ve tepeler: yatay kayan, önbelleğe alınmış şeritler.
    const m1 = layerCache('mtn1|' + bg + '|' + thTag + '|' + idx + '|' + H, 480, FLOOR + 16, (g) => {
      const capA = .8 - .65 * pal.moonA;
      for (let i = 0; i < 3; i++) paintMountain(g, i * 160, FLOOR + 8, 170, 92 + (i % 3) * 16, pal.mtnA, capA * .8);
    });
    const off1 = (bgTime * 7) % 160;
    ctx.drawImage(m1, -off1, 0, 480, FLOOR + 16);
    if (off1 > 0) ctx.drawImage(m1, 480 - off1, 0, 480, FLOOR + 16);
    const m2 = layerCache('mtn2|' + bg + '|' + thTag + '|' + idx + '|' + H, 240, FLOOR + 16, (g) => {
      const capA = .8 - .65 * pal.moonA;
      for (let i = 0; i < 2; i++) paintMountain(g, i * 120 + 30, FLOOR + 12, 120, 58 + (i % 2) * 14, pal.mtnB, capA * .55);
    });
    const off2 = (bgTime * 13) % 120;
    ctx.drawImage(m2, -off2, 0, 240, FLOOR + 16);
    if (off2 > 0) ctx.drawImage(m2, 240 - off2, 0, 240, FLOOR + 16);

    const h1 = layerCache('hill1|' + bg + '|' + thTag + '|' + idx + '|' + H, 360, FLOOR + 24, (g) => {
      g.fillStyle = pal.hillA;
      for (let x = 0; x < 360; x += 120) {
        g.beginPath();
        g.arc(x + 60, FLOOR + 20, 95, Math.PI, 0);
        g.fill();
      }
    });
    const ho1 = (bgTime * 18) % 120;
    ctx.drawImage(h1, -ho1, 0, 360, FLOOR + 24);
    if (ho1 > 0) ctx.drawImage(h1, 360 - ho1, 0, 360, FLOOR + 24);
    const h2 = layerCache('hill2|' + bg + '|' + thTag + '|' + idx + '|' + H, 270, FLOOR + 40, (g) => {
      g.fillStyle = pal.hillB;
      for (let x = 0; x < 270; x += 90) {
        g.beginPath();
        g.arc(x + 45, FLOOR + 35, 55, Math.PI, 0);
        g.fill();
      }
    });
    const ho2 = (bgTime * 30) % 90;
    ctx.drawImage(h2, -ho2, 0, 270, FLOOR + 40);
    if (ho2 > 0) ctx.drawImage(h2, 270 - ho2, 0, 270, FLOOR + 40);

    if (th.moonA > .02 && !lowPerf()) {
      for (const fl of flies) {
        const fx = fl.x + Math.sin(time * .6 * fl.sp + fl.p1) * 20;
        const fy = fl.y + Math.sin(time * 1.05 * fl.sp + fl.p2) * 12;
        const a = th.moonA * (.25 + .75 * Math.abs(Math.sin(time * 1.7 + fl.p1 * 3)));
        ctx.globalAlpha = Math.min(.85, a);
        ctx.fillStyle = '#ffe98a';
        ctx.beginPath(); ctx.arc(fx, fy, 1.8, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    const cloud = layerCache('cloud|' + bg + '|' + thTag + '|' + idx, 170, 90, (g) => {
      g.translate(85, 45);
      paintCloudSprite(g, pal);
    });
    const clouds = [
      [((70 - bgTime * 12) % 540 + 540) % 540 - 70, 105, 1],
      [((250 - bgTime * 8) % 560 + 560) % 560 - 80, 60, .75],
      [((340 - bgTime * 16) % 550 + 550) % 550 - 75, 190, .6]
    ];
    for (const c of clouds) {
      const s = c[2];
      ctx.drawImage(cloud, 0, 0, cloud.width, cloud.height, c[0] - 85 * s, c[1] - 45 * s, 170 * s, 90 * s);
    }
  }

  /* ---------------- pipes ---------------- */
  function pipeStops() {
    // Öncelik: kullanıcı boru teması (klasik değilse) > arka plan paleti > varsayılan
    const pt = PIPE_THEMES.find(p => p.id === pipesSel);
    let base;
    if (pt && pt.pipes) base = { body: pt.pipes.body, cap: pt.pipes.cap };
    else {
      const bd = BGS.find(b => b.id === bg);
      if (bd && bd.pipes) base = { body: bd.pipes.body, cap: bd.pipes.cap };
      else base = { body: DEFAULT_PIPES, cap: DEFAULT_CAPS };
    }
    const mul = Math.min(1, worldColorMul() + .2);
    return {
      body: base.body.map(c => scaleColor(c, mul)),
      cap: base.cap.map(c => scaleColor(c, mul))
    };
  }

  const pipeSpriteCache = new Map();
  function pipeSprites() {
    const stops = pipeStops();
    const s = cacheScale();
    const key = stops.body.join('') + '|' + stops.cap.join('') + '|' + s.toFixed(2);
    let sp = pipeSpriteCache.get(key);
    if (sp) return sp;
    const pad = 4, bodyH = 900, capW = PIPE_W + 10, capH = 26;
    const body = makeCanvas((PIPE_W + pad * 2) * s, bodyH * s);
    const g = body.getContext('2d');
    g.setTransform(s, 0, 0, s, 0, 0);
    const bg = g.createLinearGradient(pad, 0, pad + PIPE_W, 0);
    bg.addColorStop(0, stops.body[0]);
    bg.addColorStop(.3, stops.body[1]);
    bg.addColorStop(.62, stops.body[2]);
    bg.addColorStop(.85, stops.body[3]);
    bg.addColorStop(1, stops.body[4]);
    g.fillStyle = bg;
    roundRectOn(g, pad, 0, PIPE_W, bodyH, 10);
    g.fill();
    g.strokeStyle = rgba(mixHex(stops.body[4], '#000000', .35), .6);
    g.lineWidth = 2;
    g.stroke();
    g.fillStyle = 'rgba(255, 255, 255, .32)';
    roundRectOn(g, pad + 9, 5, 6, bodyH - 10, 3); g.fill();
    g.fillStyle = 'rgba(255, 255, 255, .16)';
    roundRectOn(g, pad + 18, 5, 3, bodyH - 10, 1.5); g.fill();
    g.fillStyle = 'rgba(0, 0, 0, .1)';
    roundRectOn(g, pad + PIPE_W - 10, 6, 6, bodyH - 12, 3); g.fill();

    const cap = makeCanvas(capW * s, capH * s);
    const c = cap.getContext('2d');
    c.setTransform(s, 0, 0, s, 0, 0);
    const cg = c.createLinearGradient(0, 0, capW, 0);
    cg.addColorStop(0, stops.cap[0]);
    cg.addColorStop(.3, stops.cap[1]);
    cg.addColorStop(.62, stops.cap[2]);
    cg.addColorStop(.85, stops.cap[3]);
    cg.addColorStop(1, stops.cap[4]);
    c.fillStyle = cg;
    roundRectOn(c, 0, 0, capW, capH, 9); c.fill();
    c.strokeStyle = rgba(mixHex(stops.cap[4], '#000000', .35), .65);
    roundRectOn(c, 1, 1, capW - 2, capH - 2, 8); c.stroke();
    c.fillStyle = 'rgba(255, 255, 255, .3)';
    roundRectOn(c, 7, 3, 8, capH - 6, 4); c.fill();
    c.fillStyle = 'rgba(255, 255, 255, .14)';
    roundRectOn(c, 18, 3, 3, capH - 6, 1.5); c.fill();

    sp = { body, cap, s, bodyH, pad, capW, capH };
    if (pipeSpriteCache.size > 8) pipeSpriteCache.clear();
    pipeSpriteCache.set(key, sp);
    return sp;
  }

  function drawPipe(x, y, h, capAtBottom) {
    const sp = pipeSprites();
    const hh = Math.max(1, Math.min(h, sp.bodyH));
    const sy = capAtBottom ? (sp.bodyH - hh) : 0;
    ctx.drawImage(
      sp.body,
      0, sy * sp.s, sp.body.width, hh * sp.s,
      x - sp.pad, y, PIPE_W + sp.pad * 2, hh
    );
    const capY = capAtBottom ? y + h - sp.capH : y;
    ctx.drawImage(sp.cap, 0, 0, sp.cap.width, sp.cap.height, x - 5, capY, sp.capW, sp.capH);
    // Başlık gövde birleşim gölgesi
    ctx.fillStyle = 'rgba(0, 0, 0, .14)';
    if (capAtBottom) { roundRect(x + 2, y + h - 31, PIPE_W - 4, 5, 2); ctx.fill(); }
    else { roundRect(x + 2, y + 26, PIPE_W - 4, 5, 2); ctx.fill(); }
  }

  function drawPipes() {
    for (const p of pipes) {
      if (p.smashed || p.x + PIPE_W < -10 || p.x > W + 10) continue;    // dev kuş ezdi veya ekran dışı
      drawPipe(p.x, 0, p.top, true);
      drawPipe(p.x, p.top + p.gap, FLOOR - p.top - p.gap, false);
      if (p.saw) drawSaw(p);
    }
  }

  /* ---------------- v4: yeni engeller / boss / güçler çizimleri ---------------- */
  function drawSaw(p) {
    const ext = Math.max(0, p.saw.reach * (0.5 + 0.5 * Math.sin(p.saw.t)));
    const cy = p.saw.side === 'top' ? p.top + 26 + ext : p.top + p.gap - 26 - ext;
    const cx = p.x + PIPE_W / 2;
    // Zincir/askı
    ctx.save();
    ctx.strokeStyle = 'rgba(70, 80, 95, .8)';
    ctx.lineWidth = 3;
    if (p.saw.side === 'top') { ctx.beginPath(); ctx.moveTo(cx, p.top + 20); ctx.lineTo(cx, cy - 8); ctx.stroke(); }
    else { ctx.beginPath(); ctx.moveTo(cx, p.top + p.gap - 20); ctx.lineTo(cx, cy + 8); ctx.stroke(); }
    // Dönen testere
    ctx.translate(cx, cy);
    ctx.rotate(p.saw.t * 2.4);
    ctx.fillStyle = '#c8ccd8';
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = i * Math.PI / 5;
      ctx.lineTo(Math.cos(a) * p.saw.r, Math.sin(a) * p.saw.r);
      ctx.lineTo(Math.cos(a + Math.PI / 10) * p.saw.r * .74, Math.sin(a + Math.PI / 10) * p.saw.r * .74);
    }
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#5a6070'; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.fillStyle = '#5a6070';
    ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawBats() {
    for (const e of enemies) {
      if (e.type !== 'bat' || e.dead || e.x < -20 || e.x > W + 20) continue;
      const flap = Math.sin(time * 14 + e.ph * 5) * .8;
      ctx.save();
      ctx.translate(e.x, e.y);
      // Kanatlar
      ctx.fillStyle = '#5b4a8a'; ctx.strokeStyle = '#3a2f5e'; ctx.lineWidth = 1.4;
      ctx.save(); ctx.rotate(flap * .6);
      ctx.beginPath(); ctx.ellipse(-8, -2, 8, 4, -.4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.restore();
      ctx.save(); ctx.rotate(-flap * .6);
      ctx.beginPath(); ctx.ellipse(8, -2, 8, 4, .4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.restore();
      // Gövde
      ctx.fillStyle = '#7c66b8';
      ctx.beginPath(); ctx.arc(0, 0, e.r * .78, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#3a2f5e'; ctx.stroke();
      // Kulaklar
      ctx.beginPath(); ctx.moveTo(-4, -6); ctx.lineTo(-5.5, -11); ctx.lineTo(-1.5, -7.5); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(4, -6); ctx.lineTo(5.5, -11); ctx.lineTo(1.5, -7.5); ctx.closePath(); ctx.fill(); ctx.stroke();
      // Gözler
      ctx.fillStyle = '#ffe98a';
      ctx.beginPath(); ctx.arc(-2.6, -1, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(2.6, -1, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  function drawWinds() {
    for (const w of winds) {
      if (w.x + w.w < 0 || w.x > W) continue;
      const dir = w.f < 0 ? -1 : 1;      // yukarı / aşağı akış
      ctx.save();
      ctx.globalAlpha = .28;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.6;
      ctx.lineCap = 'round';
      const rows = 5, cols = 4;
      for (let i = 0; i < cols; i++) {
        const lx = w.x + (i + .5) * (w.w / cols);
        for (let r = 0; r < rows; r++) {
          const ph = w.ph + i * 1.3 + r * 2.1;
          const y = 40 + ((r / rows) * (FLOOR - 80));
          const off = ((time * 90 * dir + ph * 40) % (FLOOR - 80) + (FLOOR - 80)) % (FLOOR - 80);
          const yy = dir < 0 ? y - off + (FLOOR - 80) : y + off;
          const yy2 = ((yy - 40) % (FLOOR - 80) + (FLOOR - 80)) % (FLOOR - 80) + 40;
          ctx.beginPath();
          ctx.moveTo(lx, yy2);
          ctx.lineTo(lx, yy2 + 12 * dir);
          ctx.stroke();
        }
      }
      ctx.restore();
    }
  }

  function drawPickups() {
    for (const pk of pickups) {
      if (pk.taken || pk.x < -24 || pk.x > W + 24) continue;
      const def = CONFIG.powerups.find(w => w.id === pk.type);
      if (!def) continue;
      const bob = Math.sin(time * 3.4 + pk.ph) * 4;
      ctx.save();
      ctx.translate(pk.x, pk.y + bob);
      // Parlayan kapsül
      const gl = ctx.createRadialGradient(0, 0, 2, 0, 0, 20);
      gl.addColorStop(0, 'rgba(255, 255, 255, .85)');
      gl.addColorStop(.55, 'rgba(77, 150, 255, .5)');
      gl.addColorStop(1, 'rgba(77, 150, 255, 0)');
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255, 255, 255, .92)';
      ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(77, 150, 255, .9)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.font = '13px "Segoe UI Emoji", system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(def.icon, 0, 1);
      ctx.restore();
    }
  }

  function drawBullets() {
    for (const b of bullets) {
      if (b.x < -16 || b.x > W + 16) continue;
      ctx.save();
      ctx.translate(b.x, b.y);
      if (boss && boss.type === 0) {
        // Ateş topu
        const fg = ctx.createRadialGradient(0, 0, 1, 0, 0, 10);
        fg.addColorStop(0, '#ffe98a'); fg.addColorStop(.6, '#ff8a3c'); fg.addColorStop(1, 'rgba(232,72,43,0)');
        ctx.fillStyle = fg;
        ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
      } else if (boss && boss.type === 1) {
        // Su damlası
        ctx.fillStyle = 'rgba(120, 200, 255, .95)';
        ctx.beginPath(); ctx.arc(0, 0, 7.5, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.4; ctx.stroke();
      } else {
        // Buz kırığı
        ctx.fillStyle = 'rgba(170, 230, 255, .95)';
        ctx.rotate(time * 6);
        ctx.beginPath();
        ctx.moveTo(0, -9); ctx.lineTo(6, 2); ctx.lineTo(0, 9); ctx.lineTo(-6, 2);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawBoss() {
    if (!boss) return;
    const cx = 352, cy = boss.y;
    const flash = boss.hitFlash > 0;
    ctx.save();
    ctx.translate(cx, cy);
    // Boss gölgesi
    ctx.fillStyle = 'rgba(10, 20, 40, .18)';
    ctx.beginPath(); ctx.ellipse(0, 150, 30, 7, 0, 0, Math.PI * 2); ctx.fill();

    if (boss.type === 0) {
      // Ateş Ejderi
      ctx.fillStyle = flash ? '#ffffff' : '#e8482b';
      ctx.strokeStyle = '#7c1f10'; ctx.lineWidth = 2;
      // kanat
      ctx.save(); ctx.rotate(Math.sin(boss.t * 6) * .25);
      ctx.beginPath(); ctx.moveTo(14, -18); ctx.quadraticCurveTo(44, -44, 34, 4); ctx.quadraticCurveTo(26, -6, 12, 2); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
      // boyun + baş
      ctx.beginPath(); ctx.ellipse(-2, 0, 22, 15, -.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(-18, -6, 14, 11, -.3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      // boynuzlar
      ctx.fillStyle = '#ffe9b8';
      ctx.beginPath(); ctx.moveTo(-22, -14); ctx.lineTo(-28, -26); ctx.lineTo(-17, -17); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-12, -17); ctx.lineTo(-14, -30); ctx.lineTo(-6, -19); ctx.closePath(); ctx.fill();
      // göz
      ctx.fillStyle = '#ffe98a';
      ctx.beginPath(); ctx.arc(-21, -7, 3.2, 0, Math.PI * 2); ctx.fill();
      // alev ağzı
      const fl = Math.sin(time * 9) * 3;
      ctx.fillStyle = '#ff8a3c';
      ctx.beginPath(); ctx.moveTo(-30, -4); ctx.quadraticCurveTo(-40 - fl, -1, -31, 4); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath(); ctx.moveTo(-30, -2); ctx.quadraticCurveTo(-36 - fl, 0, -31, 2); ctx.closePath(); ctx.fill();
    } else if (boss.type === 1) {
      // Deniz Yılanı — gövde segmentleri dalga gibi
      ctx.strokeStyle = '#2c846c'; ctx.lineWidth = 7; ctx.lineCap = 'round';
      ctx.beginPath();
      for (let i = 0; i <= 6; i++) {
        const segX = i * 12, segY = Math.sin(boss.t * 3 + i * .8) * 12;
        if (i === 0) ctx.moveTo(segX, segY); else ctx.lineTo(segX, segY);
      }
      ctx.stroke();
      // baş
      ctx.fillStyle = flash ? '#ffffff' : '#3ad6c0';
      ctx.strokeStyle = '#1a6b5c'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(-4, Math.sin(boss.t * 3) * 12, 12, 9, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      // yüzgeç
      ctx.fillStyle = '#2c846c';
      ctx.beginPath(); ctx.moveTo(-2, Math.sin(boss.t * 3) * 12 - 8); ctx.lineTo(2, Math.sin(boss.t * 3) * 12 - 18); ctx.lineTo(7, Math.sin(boss.t * 3) * 12 - 8); ctx.closePath(); ctx.fill();
      // gözler
      ctx.fillStyle = '#ffe98a';
      ctx.beginPath(); ctx.arc(-8, Math.sin(boss.t * 3) * 12 - 2, 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(-1, Math.sin(boss.t * 3) * 12 - 3, 2.4, 0, Math.PI * 2); ctx.fill();
    } else {
      // Buz Feneri — kristal golem
      ctx.fillStyle = flash ? '#ffffff' : 'rgba(170, 230, 255, .92)';
      ctx.strokeStyle = '#5a90c8'; ctx.lineWidth = 2;
      // gövde
      ctx.beginPath();
      ctx.moveTo(0, -34); ctx.lineTo(16, -12); ctx.lineTo(10, 24); ctx.lineTo(-10, 24); ctx.lineTo(-16, -12);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      // kristal sırtlar
      ctx.beginPath(); ctx.moveTo(-6, -30); ctx.lineTo(0, -44); ctx.lineTo(6, -30); ctx.closePath(); ctx.fill(); ctx.stroke();
      // gözler
      ctx.fillStyle = '#1c3550';
      ctx.beginPath(); ctx.arc(-5, -10, 3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(5, -10, 3, 0, Math.PI * 2); ctx.fill();
      // kollar
      ctx.strokeStyle = '#5a90c8'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(-14, -2); ctx.lineTo(-26, 6 + Math.sin(boss.t * 5) * 4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(14, -2); ctx.lineTo(26, 6 - Math.sin(boss.t * 5) * 4); ctx.stroke();
    }
    // Kalan can halkası
    const frac = Math.max(0, boss.hp / CONFIG.boss.hp);
    ctx.strokeStyle = 'rgba(255, 255, 255, .25)';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, 46, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = '#ffd23f';
    ctx.beginPath(); ctx.arc(0, 0, 46, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac); ctx.stroke();
    ctx.restore();
    // Boss adı
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '600 11px ' + FONT;
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    const bn = ['ATEŞ EJDERİ', 'DENİZ YILANI', 'BUZ FENERİ'][boss.type];
    ctx.fillText(bn + ' · ' + boss.hp + ' can', cx, cy + 56);
    ctx.restore();
  }

  function drawShots() {
    if (!shots.length) return;
    ctx.save();
    for (const s of shots) {
      // küçük kuyruk
      ctx.fillStyle = 'rgba(255, 160, 40, .35)';
      ctx.beginPath();
      ctx.ellipse(s.x - 8, s.y, 8, 3.5, 0, 0, Math.PI * 2);
      ctx.fill();
      // dış parlak turuncu küresel gövde
      ctx.fillStyle = '#ff8a2b';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
      // iç parlak altın çekirdek
      ctx.fillStyle = '#fff078';
      ctx.beginPath();
      ctx.arc(s.x + 1, s.y, s.r * 0.55, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawComboText() {
    if (comboTxtT <= 0) return;
    const k = comboTxtT / 1.1;
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = Math.min(1, k * 1.6);
    const sc = 1 + (1 - k) * .18;
    ctx.translate(W / 2, 236 - (1 - k) * 20);
    ctx.scale(sc, sc);
    ctx.lineJoin = 'round';
    ctx.font = '700 22px ' + FONT;
    ctx.lineWidth = 6;
    ctx.strokeStyle = 'rgba(120, 60, 0, .4)';
    ctx.strokeText(comboTxt, 0, 0);
    ctx.fillStyle = comboMul >= 3 ? '#ff8a3c' : '#ffd23f';
    ctx.fillText(comboTxt, 0, 0);
    ctx.restore();
  }

  /* ---------------- bonus stars ---------------- */
  function drawCoins() {
    for (const c of coins) {
      if (c.taken || c.x < -20 || c.x > W + 20) continue;
      const bob = Math.sin(time * 3 + c.ph) * 3;
      const sx = .3 + .7 * Math.abs(Math.cos(time * 3.2 + c.ph));
      ctx.save();
      ctx.translate(c.x, c.y + bob);
      ctx.scale(Math.max(.3, sx), 1);
      ctx.shadowColor = 'rgba(255, 210, 63, .7)';
      ctx.shadowBlur = 14;
      const cg = ctx.createRadialGradient(-2.5, -2.5, 1, 0, 0, 10);
      cg.addColorStop(0, '#ffe98a');
      cg.addColorStop(.6, '#ffc93c');
      cg.addColorStop(1, '#e8a11c');
      ctx.fillStyle = cg;
      ctx.beginPath(); ctx.arc(0, 0, 9.5, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#c8871a'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = 'rgba(255, 255, 255, .55)';
      starPath(4.6, 2);
      ctx.fill();
      ctx.restore();
      // Orbiting twinkle
      const ox = c.x + Math.cos(time * 2.6 + c.ph) * 13;
      const oy = c.y + bob + Math.sin(time * 2.6 + c.ph) * 9;
      ctx.save();
      ctx.globalAlpha = .55 + .45 * Math.sin(time * 5 + c.ph);
      ctx.fillStyle = '#fff';
      ctx.translate(ox, oy);
      sparkle(3.2);
      ctx.fill();
      ctx.restore();
    }
  }

  /* ---------------- ground ---------------- */
  function drawGround(th) {
    th = th || theme();
    const thTag = SAVE.settings.theme || 'light';
    const mul = worldColorMul();
    const lum = colorBrightness(th.mid);
    const bright = clamp(0.5 + 0.6 * lum, 0.45, 1.05);

    // Zemin renklerini theme() çıktısından türet
    let cGrass1 = scaleColor(th.hillA, bright);
    let cGrass2 = scaleColor(mixHex(th.hillA, th.hillB, 0.4), bright);
    let cGrass3 = scaleColor(mixHex(th.hillB, '#000000', 0.28), bright);
    let cSand1 = scaleColor(mixHex('#f6e6b5', th.bot, 0.38), bright);
    let cSand2 = scaleColor(mixHex('#ddc98e', th.bot, 0.48), bright * 0.92);
    let cStoneShadow = scaleColor(mixHex('#927c3e', th.bot, 0.4), bright * 0.85);
    let cStoneHighlight = scaleColor(mixHex('#fffaf0', th.bot, 0.25), bright);

    // worldColorMul çarpanı bunun üstüne uygulanmaya devam etsin
    cGrass1 = scaleColor(cGrass1, mul);
    cGrass2 = scaleColor(cGrass2, mul);
    cGrass3 = scaleColor(cGrass3, mul);
    cSand1 = scaleColor(cSand1, mul);
    cSand2 = scaleColor(cSand2, mul);
    cStoneShadow = scaleColor(cStoneShadow, mul);
    cStoneHighlight = scaleColor(cStoneHighlight, mul);

    const T = 360;
    const qGrass = quantizeColor(cGrass1, 8);
    const qSand = quantizeColor(cSand1, 8);
    const groundKey = 'ground|' + thTag + '|' + qGrass + '|' + qSand + '|' + H;

    const ground = layerCache(groundKey, T, GROUND_H + 12, (g) => {
      const fy = 10;
      const gh = GROUND_H + 12;

      // Dirt / Sand base gradient
      const sand = g.createLinearGradient(0, fy + 12, 0, gh);
      sand.addColorStop(0, cSand1);
      sand.addColorStop(1, cSand2);
      g.fillStyle = sand;
      g.fillRect(0, fy + 12, T, GROUND_H - 12);

      // Belirgin eğik şerit bantları (açık/koyu iki ton, alpha ~.18)
      g.save();
      g.beginPath();
      g.rect(0, fy + 12, T, GROUND_H - 12);
      g.clip();
      for (let x = -72; x < T + 72; x += 36) {
        g.fillStyle = 'rgba(0, 0, 0, .18)';
        g.beginPath();
        g.moveTo(x, fy + 12);
        g.lineTo(x + 18, fy + 12);
        g.lineTo(x + 18 - 26, gh);
        g.lineTo(x - 26, gh);
        g.closePath();
        g.fill();

        g.fillStyle = 'rgba(255, 255, 255, .18)';
        g.beginPath();
        g.moveTo(x + 18, fy + 12);
        g.lineTo(x + 36, fy + 12);
        g.lineTo(x + 36 - 26, gh);
        g.lineTo(x + 18 - 26, gh);
        g.closePath();
        g.fill();
      }

      // Taşlar (period 60, k % 6 sapmalı)
      for (let x = 0, k = 0; x < T; x += 60, k++) {
        const ki = k % 6;
        const sx = x + ((ki * 13) % 29) + 8, sy = fy + 36 + ((ki * 29) % 34);
        g.fillStyle = cStoneShadow;
        g.beginPath(); g.ellipse(sx, sy, 5, 3, 0, 0, Math.PI * 2); g.fill();
        g.fillStyle = cStoneHighlight;
        g.beginPath(); g.ellipse(sx - 1.4, sy - 1, 2, 1.2, 0, 0, Math.PI * 2); g.fill();
      }
      g.restore();

      // Grass strip (period 18)
      g.fillStyle = cGrass1;
      g.fillRect(0, fy, T, 14);
      for (let x = 0, k = 0; x < T; x += 18, k++) {
        g.fillStyle = k % 2 ? cGrass1 : cGrass2;
        g.beginPath();
        g.arc(x + 9, fy, 9, Math.PI, 0);
        g.fill();
      }
      g.fillStyle = cGrass3;
      g.fillRect(0, fy + 12, T, 4);

      // Çiçekler (period 90)
      const fcols = ['#ff9ecb', '#ffd166', '#ffffff'].map(c => scaleColor(c, mul));
      for (let x = 0, k = 0; x < T; x += 90, k++) {
        const ki = k % 4;
        const fx = x + 18, fyy = fy + 5 + ((ki * 37) % 7);
        g.fillStyle = fcols[ki % 3];
        for (let p = 0; p < 5; p++) {
          const a = p * Math.PI * 2 / 5 - Math.PI / 2;
          g.beginPath();
          g.arc(fx + Math.cos(a) * 2.6, fyy + Math.sin(a) * 2.6, 1.9, 0, Math.PI * 2);
          g.fill();
        }
        g.fillStyle = scaleColor('#ffb63d', mul);
        g.beginPath(); g.arc(fx, fyy, 1.4, 0, Math.PI * 2); g.fill();
      }
    });

    // Zemin tile çizimi (x cihaz pikseline yuvarlı)
    const scale = canvas.width / W;
    const numTiles = Math.ceil(W / T);
    for (let i = 0; i <= numTiles; i++) {
      const dx = Math.round((-groundOffset + i * T) * scale) / scale;
      ctx.drawImage(ground, dx, FLOOR - 10, T + 0.5, GROUND_H + 12);
    }

    // Ön plan çimen/taş katmanı (1.25 kat hızlı kayan, kendi offset'i)
    const fgKey = 'fgGround|' + thTag + '|' + qGrass + '|' + H;
    const fgGround = layerCache(fgKey, T, 22, (g) => {
      for (let x = 0, k = 0; x < T; x += 24, k++) {
        const ki = k % 15;
        const h = 4 + (ki % 4);
        g.fillStyle = cGrass2;
        g.beginPath();
        g.moveTo(x + 3, 16);
        g.lineTo(x + 6, 16 - h);
        g.lineTo(x + 9, 16);
        g.closePath();
        g.fill();
        if (ki % 2 === 0) {
          g.fillStyle = cStoneHighlight;
          g.beginPath();
          g.ellipse(x + 16, 17, 2.2, 1.3, 0, 0, Math.PI * 2);
          g.fill();
        }
      }
    });
    for (let i = 0; i <= numTiles; i++) {
      const fdx = Math.round((-fgGroundOffset + i * T) * scale) / scale;
      ctx.drawImage(fgGround, fdx, FLOOR - 2, T + 0.5, 22);
    }
  }

  /* ---------------- bird ---------------- */
  function drawTrail() {
    if (state !== 'playing' || trailSel !== 'yok' || trail.length < 2) return;
    for (let i = 0; i < trail.length; i++) {
      const t = trail[i];
      ctx.save();
      ctx.translate(t.x, t.y);
      ctx.rotate(t.rot);
      ctx.globalAlpha = (i + 1) / trail.length * .14;
      ctx.fillStyle = currentSkin().body[1];
      ctx.beginPath(); ctx.ellipse(0, 0, 15, 11, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function drawBirdShadow() {
    const d = Math.max(0, Math.min(1, (FLOOR - bird.y) / FLOOR));
    ctx.save();
    ctx.fillStyle = 'rgba(25, 50, 35, ' + (.05 + .22 * (1 - d)).toFixed(3) + ')';
    ctx.beginPath();
    ctx.ellipse(bird.x, FLOOR - 3, 20 + 16 * (1 - d), 4.5 + 2.5 * (1 - d), 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function currentSkin() {
    return SKINS.find(s => s.id === skin) || SKINS[0];
  }

  function paintBird(sd, wingRot, blink) {
    // Efsane kuş parıltısı (arka hale)
    if (sd.glow) {
      const gl = ctx.createRadialGradient(0, 0, 6, 0, 0, 30);
      gl.addColorStop(0, rgba(sd.body[1], .38 + .12 * Math.sin(time * 5)));
      gl.addColorStop(1, rgba(sd.body[1], 0));
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fill();
    }
    // Tail feathers
    ctx.fillStyle = sd.tail;
    ctx.strokeStyle = sd.tailSt;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(-12, -2); ctx.lineTo(-24, -10); ctx.lineTo(-20, 1);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-12, 2); ctx.lineTo(-23, 4); ctx.lineTo(-19, 8);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    // Body
    const bg = ctx.createRadialGradient(-5, -7, 3, 0, 0, 19);
    bg.addColorStop(0, sd.body[0]);
    bg.addColorStop(.55, sd.body[1]);
    bg.addColorStop(1, sd.body[2]);
    ctx.fillStyle = bg;
    ctx.strokeStyle = sd.bodySt;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, 16, 13.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Belly
    ctx.fillStyle = sd.belly;
    ctx.beginPath();
    ctx.ellipse(1, 7, 10, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    // Skin'e özel ek detaylar (kulak/boynuz/anten/alev)
    paintExt(sd);

    // Wing
    ctx.save();
    ctx.translate(-3, 0);
    ctx.rotate(wingRot);
    ctx.fillStyle = sd.wing;
    ctx.strokeStyle = sd.wingSt;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.ellipse(-4, 0, 10, 6.2, .12, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-9, -2.5); ctx.lineTo(-3, -.5);
    ctx.moveTo(-8.5, 2.5); ctx.lineTo(-2.5, 1);
    ctx.stroke();
    ctx.restore();

    // Head tuft (penguen/panda/robot kendi baş süsünü çizer)
    if (!sd.ext || sd.ext === 'ejder' || sd.ext === 'ates' || sd.ext === 'baykus' || sd.ext === 'feniks' || sd.ext === 'galaksi') {
      ctx.fillStyle = sd.body[1];
      ctx.strokeStyle = sd.bodySt;
      ctx.lineWidth = 1.5;
      ctx.save();
      ctx.translate(-1, -13);
      ctx.rotate(-.5);
      ctx.beginPath(); ctx.ellipse(0, -3, 2.4, 5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.translate(3, -14);
      ctx.rotate(.35);
      ctx.beginPath(); ctx.ellipse(0, -3, 2, 4.4, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.restore();
    }

    // Eye — göz hareket yönü (eyeLook) takip eder; ölünce şaşkın yüz
    const deadFace = state === 'gameover';
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = sd.bodySt;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(7, -5.5, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    if (deadFace) {
      // Şaşkın yüz: X gözler + açık gaga
      ctx.strokeStyle = '#242e40';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(4.5, -8); ctx.lineTo(9.5, -3);
      ctx.moveTo(9.5, -8); ctx.lineTo(4.5, -3);
      ctx.stroke();
      ctx.fillStyle = 'rgba(36, 46, 64, .35)';
      ctx.beginPath(); ctx.arc(9, 6, 3.4, 0, Math.PI * 2); ctx.fill(); // küçük "oh!" ağzı
    } else if (blink) {
      ctx.strokeStyle = '#242e40';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(3.5, -5);
      ctx.lineTo(10.5, -5);
      ctx.stroke();
    } else {
      ctx.fillStyle = '#242e40';
      ctx.beginPath(); ctx.arc(8.6 + eyeLook.x * 2.2, -5.5 + eyeLook.y * 2.4, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(9.7 + eyeLook.x * 2.2, -6.9 + eyeLook.y * 2.4, 1.15, 0, Math.PI * 2); ctx.fill();
    }

    // Beak (two parts)
    ctx.fillStyle = sd.beak;
    ctx.strokeStyle = sd.beakSt;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(12.5, -3.5); ctx.lineTo(24, -.5); ctx.lineTo(12.5, 1.5);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = sd.beak2;
    ctx.beginPath();
    ctx.moveTo(12.5, 1.8); ctx.lineTo(20.5, 3.2); ctx.lineTo(12.5, 5.5);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    // Blush
    ctx.fillStyle = 'rgba(255, 118, 118, .32)';
    ctx.beginPath();
    ctx.arc(5, 2, 2.8, 0, Math.PI * 2);
    ctx.fill();
  }

  function paintExt(sd) {
    // Skin'e özel baş/gövde süsleri — hepsi canvas ile, dış varlık yok.
    switch (sd.ext) {
      case 'penguen': {
        // Beyaz yüz lekesi
        ctx.fillStyle = 'rgba(255,255,255,.85)';
        ctx.beginPath(); ctx.ellipse(6, -3, 6.5, 5.5, 0, 0, Math.PI * 2); ctx.fill();
        // Turuncu ayaklar
        ctx.fillStyle = '#ff9f43'; ctx.strokeStyle = 'rgba(190,90,15,.8)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.ellipse(4, 12.5, 3.4, 1.7, .2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(-3, 12.8, 3, 1.5, -.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        break;
      }
      case 'robot': {
        // Anten
        ctx.strokeStyle = '#7a8aa0'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(2, -13); ctx.lineTo(5, -20); ctx.stroke();
        ctx.fillStyle = '#ff6b6b';
        ctx.beginPath(); ctx.arc(5, -21, 2.6, 0, Math.PI * 2); ctx.fill();
        // Perçinler + panel çizgisi
        ctx.fillStyle = 'rgba(120,135,155,.9)';
        ctx.beginPath(); ctx.arc(-9, -7, 1.3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(-8, 6, 1.3, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(120,135,155,.7)'; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.moveTo(-12, 1); ctx.lineTo(-6, 3); ctx.stroke();
        break;
      }
      case 'ejder': {
        // Boynuzlar
        ctx.fillStyle = '#ffe9b8'; ctx.strokeStyle = 'rgba(150,110,40,.8)'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(1, -12); ctx.lineTo(-1, -19); ctx.lineTo(4, -13); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(6, -11); ctx.lineTo(6, -18); ctx.lineTo(10, -11.5); ctx.closePath(); ctx.fill(); ctx.stroke();
        // Sırt dikenleri
        ctx.fillStyle = '#2f8f4e';
        ctx.beginPath(); ctx.moveTo(-13, -4); ctx.lineTo(-18, -7); ctx.lineTo(-14, 0); ctx.closePath(); ctx.fill();
        break;
      }
      case 'ates': {
        // Sallanan alev tepe
        const fw = Math.sin(time * 7) * 1.6;
        ctx.fillStyle = '#ff8a3c';
        ctx.beginPath(); ctx.moveTo(2, -13); ctx.quadraticCurveTo(4 + fw, -22, 1, -19 + fw * .4); ctx.quadraticCurveTo(0, -16, 3, -13); ctx.fill();
        ctx.fillStyle = '#ffd23f';
        ctx.beginPath(); ctx.moveTo(3, -13); ctx.quadraticCurveTo(4 + fw, -18, 2, -16); ctx.fill();
        break;
      }
      case 'baykus': {
        // Kulak demetleri
        ctx.fillStyle = sd.wing; ctx.strokeStyle = sd.wingSt; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.moveTo(-2, -12); ctx.lineTo(-6, -19); ctx.lineTo(2, -14); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(4, -13); ctx.lineTo(8, -19); ctx.lineTo(10, -11); ctx.closePath(); ctx.fill(); ctx.stroke();
        break;
      }
      case 'panda': {
        // Kulaklar
        ctx.fillStyle = '#2b2b2b';
        ctx.beginPath(); ctx.arc(-4, -12, 4, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(6, -12.5, 4, 0, Math.PI * 2); ctx.fill();
        // Göz lekesi
        ctx.fillStyle = 'rgba(43,43,43,.55)';
        ctx.beginPath(); ctx.ellipse(7, -5.5, 5, 4.6, .15, 0, Math.PI * 2); ctx.fill();
        break;
      }
      case 'feniks': {
        // Alev tacı
        const fw = Math.sin(time * 6) * 2;
        for (let i = 0; i < 3; i++) {
          ctx.fillStyle = i === 0 ? '#ffd23f' : i === 1 ? '#ff8a3c' : '#e8482b';
          ctx.beginPath();
          ctx.moveTo(1 + i * 3.4, -12 + i);
          ctx.quadraticCurveTo(3 + i * 3.4 + fw, -22 - i * 2, 0 + i * 3.4, -15 - i);
          ctx.closePath(); ctx.fill();
        }
        break;
      }
      case 'galaksi': {
        // Vücutta yıldız pırıltıları
        ctx.fillStyle = 'rgba(255,255,255,.9)';
        for (let i = 0; i < 4; i++) {
          const a = time * 2 + i * 1.7;
          const sx = Math.cos(a) * 8, sy = Math.sin(a * 1.3) * 7;
          ctx.globalAlpha = .5 + .5 * Math.sin(a * 3);
          ctx.beginPath(); ctx.arc(sx, sy - 2, 1.1, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
        break;
      }
    }
  }

  function drawMiniBird(x, y, s, skinDef) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    paintBird(skinDef, .18, false);
    ctx.restore();
  }

  function drawBird() {
    drawBirdShadow();

    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);
    // Oyun içi güç ölçeği (mini/dev) + squash & stretch on flap
    const bs = birdScale();
    ctx.scale(bs * (1 - .13 * bird.sq), bs * (1 + .22 * bird.sq));

    paintBird(currentSkin(), Math.sin(bird.wing) * (bird.vy < 0 ? .85 : .35) - .12, bird.blink > 0);

    ctx.restore();

    // Shield bubble (booster or post-shield grace)
    if (active === 'kalkan' || invT > 0) {
      const flick = invT > 0 && Math.floor(time * 14) % 2 === 0 ? .35 : 1;
      const pr = 24 + Math.sin(time * 6) * 1.6;
      ctx.save();
      ctx.globalAlpha = (invT > 0 ? .55 : .8) * flick;
      ctx.strokeStyle = '#8fd0ff';
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.arc(bird.x, bird.y, pr, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = .16 * flick;
      const sg = ctx.createRadialGradient(bird.x, bird.y, 6, bird.x, bird.y, pr);
      sg.addColorStop(0, 'rgba(143, 208, 255, .05)');
      sg.addColorStop(1, 'rgba(143, 208, 255, .55)');
      ctx.fillStyle = sg;
      ctx.beginPath();
      ctx.arc(bird.x, bird.y, pr, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  /* ---------------- snow (snow kingdom) ---------------- */
  function drawSnow() {
    for (const s of snow) {
      ctx.save();
      ctx.globalAlpha = .5 + .3 * Math.sin(time * 2 + s.ph);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  /* ---------------- particles / floats ---------------- */
  function drawTrailParticles() {
    for (const p of particles) {
      if (p.type !== 'trail') continue;
      const k = Math.max(0, p.life / p.max);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.globalAlpha = .85 * k;
      ctx.fillStyle = p.color;
      if (p.shape === 'kalp') {
        const s = p.size * .8;
        ctx.beginPath();
        ctx.moveTo(0, s * .35);
        ctx.bezierCurveTo(-s, -s * .35, -s * .45, -s, 0, -s * .35);
        ctx.bezierCurveTo(s * .45, -s, s, -s * .35, 0, s * .35);
        ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(0, 0, p.size * .9, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function drawParticles() {
    for (const p of particles) {
      const k = Math.max(0, p.life / p.max);
      if (p.type === 'feather') {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = Math.min(1, k * 1.4);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, p.size, p.size * .42, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      } else if (p.type === 'conf') {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = Math.min(1, k * 1.6);
        ctx.fillStyle = p.color;
        roundRect(-p.size / 2, -p.size * .3, p.size, p.size * .6, 1.5);
        ctx.fill();
        ctx.restore();
      } else if (p.type === 'spark') {
        ctx.save();
        ctx.globalAlpha = k;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 8;
        ctx.translate(p.x, p.y);
        sparkle(p.size * (0.5 + 0.9 * k) * 2.2);
        ctx.fill();
        ctx.restore();

      } else if (p.type === 'puff') {
        ctx.save();
        ctx.globalAlpha = .26 * k;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (1 + (1 - k) * 1.6), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      } else { // dust
        ctx.save();
        ctx.globalAlpha = .35 * k;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (1 + (1 - k)), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawFloats() {
    for (const f of floats) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, f.life / f.max);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      ctx.font = '700 16px ' + FONT;
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(20, 40, 60, .4)';
      ctx.strokeText(f.txt, f.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.txt, f.x, f.y);
      ctx.restore();
    }
  }

  /* ---------------- HUD ---------------- */
  function measureWalletChip(amount, maxW) {
    ctx.save();
    let txt = formatCompact(amount);
    maxW = maxW || 190;
    let fs = 15;
    ctx.font = '600 ' + fs + 'px ' + FONT;
    let cw = textWidth(txt);
    const innerMax = Math.max(24, maxW - 34);
    if (cw > innerMax) {
      fs = fitTextFont(txt, innerMax, '600', 15, 12);
      ctx.font = '600 ' + fs + 'px ' + FONT;
      cw = textWidth(txt);
    }
    if (cw > innerMax) {
      txt = truncateText(txt, innerMax);
      cw = textWidth(txt);
    }
    ctx.restore();
    return Math.min(maxW, 32 + cw);
  }

  function drawWalletChip(x, y, icon, amount, flashCol, maxW) {
    const sk = SK();
    ctx.save();
    let txt = formatCompact(amount);
    maxW = maxW || 190;
    let fs = 15;
    ctx.font = '600 ' + fs + 'px ' + FONT;
    let cw = textWidth(txt);
    const innerMax = Math.max(24, maxW - 34);
    if (cw > innerMax) {
      fs = fitTextFont(txt, innerMax, '600', 15, 12);
      ctx.font = '600 ' + fs + 'px ' + FONT;
      cw = textWidth(txt);
    }
    if (cw > innerMax) {
      txt = truncateText(txt, innerMax);
      cw = textWidth(txt);
    }
    const w = Math.min(maxW, 32 + cw);
    ctx.textBaseline = 'middle';
    ctx.fillStyle = sk.chipBg;
    roundRect(x, y, w, 24, 12);
    ctx.fill();
    ctx.strokeStyle = sk.border;
    ctx.lineWidth = 1;
    roundRect(x, y, w, 24, 12);
    ctx.stroke();
    ctx.save();
    ctx.translate(x + 14, y + 12);
    if (icon === 'star') {
      ctx.fillStyle = '#ffd23f';
      ctx.strokeStyle = 'rgba(140, 90, 0, .55)';
      starPath(7.5, 3.2);
      ctx.fill(); ctx.stroke();
    } else {
      if (gemFlash > 0) {
        const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 16);
        g.addColorStop(0, 'rgba(141, 235, 255, ' + (gemFlash * .9).toFixed(2) + ')');
        g.addColorStop(1, 'rgba(141, 235, 255, 0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fill();
      }
      ctx.rotate(Math.sin(time * 2) * .12);
      ctx.fillStyle = flashCol || '#4dd0e1';
      ctx.beginPath();
      ctx.moveTo(0, -7.5); ctx.lineTo(5.2, -2); ctx.lineTo(0, 7.5); ctx.lineTo(-5.2, -2);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(20, 110, 130, .8)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = 'rgba(255, 255, 255, .5)';
      ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(2.4, -1.6); ctx.lineTo(0, 3); ctx.lineTo(-2.4, -1.6); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    ctx.fillStyle = sk.chipText;
    ctx.textAlign = 'left';
    ctx.font = '600 ' + fs + 'px ' + FONT;
    ctx.fillText(txt, x + 26, y + 12.5);
    ctx.restore();
    return w;
  }

  function drawHUD() {
    if (state !== 'playing' && state !== 'paused') return;
    const sk = SK();
    const isLight = (SAVE.settings.theme || 'light') === 'light';
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';

    // Score with pop animation (keskin stroke + offset gölge)
    ctx.globalAlpha = scoreIdleT < 1.5 ? 1 : Math.max(0.35, 1 - (scoreIdleT - 1.5) / 0.6 * 0.65);
    ctx.translate(W / 2, 54);
    ctx.scale(1 + .35 * scorePop, 1 + .35 * scorePop);
    ctx.font = '700 42px ' + FONT;
    ctx.lineWidth = 4;
    ctx.strokeStyle = isLight ? 'rgba(255, 255, 255, .85)' : 'rgba(0, 0, 0, .65)';
    ctx.strokeText(score, 0, 0);
    ctx.fillStyle = isLight ? 'rgba(255, 255, 255, .5)' : 'rgba(0, 0, 0, .4)';
    ctx.fillText(score, 0, 2);
    ctx.fillStyle = sk.chipText;
    ctx.fillText(score, 0, 0);
    ctx.restore();

    // Mode chip: Zamana Karşı süresi üstte ortada; diğer tüm modlarda EN İYİ sol altta
    if (mode === 'zaman') {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = FONTS.f600_13;
      const bt = '⏱ ' + runTime.toFixed(1) + ' sn';
      const tw = textWidth(bt);
      const warnTime = runTime < 10;
      ctx.fillStyle = warnTime ? sk.danger : sk.chipBg;
      roundRect(W / 2 - tw / 2 - 12, 82, tw + 24, 22, 11);
      ctx.fill();
      ctx.strokeStyle = sk.border;
      ctx.lineWidth = 1;
      roundRect(W / 2 - tw / 2 - 12, 82, tw + 24, 22, 11);
      ctx.stroke();
      ctx.fillStyle = warnTime ? '#ffffff' : sk.chipText;
      ctx.fillText(bt, W / 2, 93);
      ctx.restore();
    } else {
      ctx.save();
      ctx.globalAlpha = 0.85;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = FONTS.f600_13;
      let bt;
      if (mode === 'zen') bt = '🧘 ZEN · EN İYİ ' + (SAVE.mbest.zen || 0);
      else if (mode === 'ters') bt = '🔄 EN İYİ ' + (SAVE.mbest.ters || 0);
      else if (mode === 'gunluk') bt = '📅 EN İYİ ' + (SAVE.mbest.gunluk || 0);
      else bt = 'EN İYİ ' + best;
      const tw = textWidth(bt);
      const chipW = tw + 24;
      const chipX = 12;
      const chipH = 22;
      const chipY = Math.round(FLOOR + (GROUND_H - chipH) / 2);
      ctx.fillStyle = sk.chipBg;
      roundRect(chipX, chipY, chipW, chipH, 11);
      ctx.fill();
      ctx.strokeStyle = sk.border;
      ctx.lineWidth = 1;
      roundRect(chipX, chipY, chipW, chipH, 11);
      ctx.stroke();
      ctx.fillStyle = sk.chipText;
      ctx.fillText(bt, chipX + chipW / 2, chipY + chipH / 2 + 0.5);
      ctx.restore();
    }

    // ⭐ / 💎 çipleri (sol üst, yan yana)
    const w1 = drawWalletChip(12, 22, 'star', coinsGot);
    drawWalletChip(12 + w1 + 8, 22, 'gem', stats.gemsWon - runGemsStart);

    // Active booster chip (below the star counter)
    if (active) {
      const bd = BOOSTERS.find(b => b.id === active);
      if (bd) {
        const label = bd.icon + ' ' + bd.name;
        ctx.save();
        ctx.font = FONTS.f600_13;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        const lw = textWidth(label);
        ctx.fillStyle = sk.accent;
        roundRect(12, 54, lw + 20, 24, 12);
        ctx.fill();
        ctx.fillStyle = sk.textInv;
        ctx.fillText(label, 22, 66);
        ctx.restore();
      }
    }

    // Oyun içi güçler: süre çubukları (sağ üst)
    drawPowerBars();

    // Ters yerçekimi uyarısı
    if (gravWarn > 0 || (mode === 'ters' && gravFlipT <= 1.2)) {
      const blink = Math.floor(time * 8) % 2 === 0;
      if (blink) {
        ctx.save();
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.globalAlpha = .85;
        ctx.font = '700 16px ' + FONT;
        ctx.fillStyle = '#c084fc';
        ctx.fillText(gravDir < 0 ? '↑↑ DİKKAT: TERS DÖNÜYOR ↑↑' : '↓↓ DİKKAT: NORMAL DÖNÜYOR ↓↓', W / 2, 150);
        ctx.restore();
      }
    }
  }

  function drawPowerBars() {
    const sk = SK();
    let y = 22;
    for (const def of CONFIG.powerups) {
      const t = pu[def.id];
      if (t <= 0) continue;
      const frac = Math.max(0, Math.min(1, t / puMax[def.id]));
      ctx.save();
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.font = FONTS.f600_12;
      const label = def.icon;
      const lw = 22;
      const bw = 64;
      // çip arka
      ctx.fillStyle = sk.chipBg;
      roundRect(W - 12 - lw - bw - 14, y, lw + bw + 14, 22, 11);
      ctx.fill();
      ctx.strokeStyle = sk.border;
      ctx.lineWidth = 1;
      roundRect(W - 12 - lw - bw - 14, y, lw + bw + 14, 22, 11);
      ctx.stroke();
      ctx.font = '12px "Segoe UI Emoji", system-ui, sans-serif';
      ctx.fillStyle = sk.chipText;
      ctx.fillText(label, W - 12 - bw - 12, y + 11.5);
      // bar
      ctx.fillStyle = sk.panelSoft;
      roundRect(W - 12 - bw, y + 7, bw, 8, 4);
      ctx.fill();
      ctx.fillStyle = sk.accent;
      roundRect(W - 12 - bw, y + 7, Math.max(3, bw * frac), 8, 4);
      ctx.fill();
      ctx.restore();
      y += 26;
    }
  }

  /* ---------------- ready screen ---------------- */

  function readyLayout() {
    const modeChip = { x: Math.round((W - 220) / 2), y: 248, w: 220, h: 28 };
    const play = { x: Math.round((W - 240) / 2), y: 284, w: 240, h: 54 };
    const gridY = 346;
    const colGap = 8, rowGap = 8, bh = 30;
    const bw = Math.floor((play.w - colGap) / 2);
    const showLuck = !SAVE.settings.hideLuck;
    const pairDefs = [
      { id: 'tasks',   label: '🎯 GÖREVLER' },
      { id: 'luck',    label: '🍀 ATÖLYE' },
      { id: 'shop',    label: '🛒 MARKET' },
      { id: 'settings',label: '⚙️ AYARLAR' }
    ].filter(b => b.id !== 'luck' || showLuck);
    const smalls = [];
    const pairRows = Math.ceil(pairDefs.length / 2);
    for (let r = 0; r < pairRows; r++) {
      const i0 = r * 2;
      const hasSecond = i0 + 1 < pairDefs.length;
      const by = gridY + r * (bh + rowGap);
      if (hasSecond) {
        smalls.push({ id: pairDefs[i0].id, label: pairDefs[i0].label, x: play.x, y: by, w: bw, h: bh });
        smalls.push({ id: pairDefs[i0 + 1].id, label: pairDefs[i0 + 1].label, x: play.x + bw + colGap, y: by, w: bw, h: bh });
      } else {
        smalls.push({ id: pairDefs[i0].id, label: pairDefs[i0].label, x: Math.round(W / 2 - bw / 2), y: by, w: bw, h: bh });
      }
    }
    const statsY = gridY + pairRows * (bh + rowGap);
    smalls.push({ id: 'stats', label: '📊 İSTATİSTİK', x: play.x, y: statsY, w: play.w, h: bh });
    const bestY = statsY + bh + rowGap + 13;
    const boostY = bestY + 13 + rowGap;
    const armedY = boostY + 36;
    const handY = 562;
    return { modeChip, play, gridY, smalls, bestY, boostY, armedY, handY };
  }

  function drawReady() {
    const sk = SK();
    // ⭐ / 💎 bakiyeleri (sol üst, yan yana)
    const w1 = drawWalletChip(12, 18, 'star', wallet);
    drawWalletChip(12 + w1 + 8, 18, 'gem', gems);

    // Bouncing title, letter by letter (keskin stroke + 2px koyu offset)
    ctx.save();
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.font = '700 42px ' + FONT;
    const word = 'BOUNCY BIRD';
    const widths = [];
    let total = 0;
    for (const ch of word) {
      const w = textWidth(ch);
      widths.push(w);
      total += w;
    }
    let cx = W / 2 - total / 2;
    ctx.textAlign = 'center';
    for (let i = 0; i < word.length; i++) {
      const bobY = 74 + Math.sin(time * 3 + i * .5) * 5;
      const lx = cx + widths[i] / 2;
      ctx.lineWidth = 4.5;
      ctx.strokeStyle = 'rgba(14, 34, 62, .6)';
      ctx.strokeText(word[i], lx, bobY);
      ctx.fillStyle = 'rgba(14, 34, 62, .42)';
      ctx.fillText(word[i], lx + 1, bobY + 2);
      ctx.fillStyle = '#fff';
      ctx.fillText(word[i], lx, bobY);
      cx += widths[i];
    }
    ctx.restore();

    // Subtitle chip
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = FONTS.f600_13;
    const st = 'HAZIR MISIN?';
    const sw = textWidth(st);
    ctx.fillStyle = sk.chipBg;

      ctx.fillStyle = sk.chipBg;
      roundRect(b.x, b.y, b.w, b.h, 15);
      ctx.fill();
      ctx.strokeStyle = sk.border;
      ctx.lineWidth = 1.4;
      roundRect(b.x, b.y, b.w, b.h, 15);
      ctx.stroke();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const bfs = fitTextFont(b.label, b.w - 14, '600', 12, 12);
      ctx.font = '600 ' + bfs + 'px ' + FONT;
      ctx.fillStyle = sk.chipText;
      ctx.fillText(truncateText(b.label, b.w - 12), b.x + b.w / 2, b.y + b.h / 2 + .5);
      ctx.restore();
    }

    // 🏆 EN İYİ çipi
    chipDark(W / 2, L.bestY, '🏆 EN İYİ ' + best);

    // Güç / 🍀 Şans satırı
    drawBoostRow();
    if (armed) {

      if (ab) {

  function boostRowItems() {
    const L = readyLayout();
    const y = L.boostY;
    const st = BOOSTERS.filter(b => (inv.boost[b.id] || 0) > 0);
    const lucky = BOOSTERS.filter(b => luckLevel(b.id) > 0);
    if (!st.length && !lucky.length) return [];
    ctx.save();
    ctx.font = FONTS.f600_12;
    const items = [];
    for (const b of st) {
      const label = b.icon + ' ×' + inv.boost[b.id];
      items.push({ kind: 'stock', b, label, w: textWidth(label) + 20 });
    }
    if (lucky.length) {
      const icons = lucky.map(b => b.icon).join('');
      const label = st.length ? ('🍀 Şans ' + icons) : ('🍀 Şans · ' + icons);
      items.push({ kind: 'luck', b: null, label, w: Math.min(220, textWidth(label) + 22) });
    }
    ctx.restore();
    const gap = 8;
    const rawTotal = items.reduce((a, it) => a + it.w, 0) + gap * (items.length - 1);
    const maxRowW = W - 24;
    const availW = maxRowW - gap * (items.length - 1);
    const sumW = rawTotal - gap * (items.length - 1);
    const scale = rawTotal > maxRowW && sumW > 0 ? availW / sumW : 1;
    let total = 0;
    for (const it of items) {
      it.w = Math.max(42, Math.round(it.w * scale));
      total += it.w;
    }
    total += gap * (items.length - 1);
    let x = Math.round(W / 2 - total / 2);
    for (const it of items) {
      it.x = x;
      it.y = y;
      it.h = 26;
      x += it.w + gap;
    }
    return items;
  }

  function drawBoostRow() {
    const items = boostRowItems();
    if (!items.length) return;
    const sk = SK();
    ctx.save();
    ctx.font = FONTS.f600_12;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      if (it.kind === 'stock') {
        const b = it.b;
        const isArmed = armed === b.id;
        ctx.fillStyle = isArmed ? sk.warn : sk.chipBg;
        roundRect(it.x, it.y, it.w, it.h, 13);
        ctx.fill();
        ctx.strokeStyle = isArmed ? '#fff' : sk.border;
        ctx.lineWidth = isArmed ? 1.6 : 1;
        roundRect(it.x, it.y, it.w, it.h, 13);
        ctx.stroke();
        ctx.fillStyle = isArmed ? '#5c4000' : sk.chipText;
        ctx.fillText(it.label, it.x + it.w / 2, it.y + it.h / 2 + .5, it.w - 10);
      } else {
        ctx.save();
        if (armed) ctx.globalAlpha = .62;
        ctx.fillStyle = sk.chipBg;
        roundRect(it.x, it.y, it.w, it.h, 13);
        ctx.fill();
        ctx.strokeStyle = 'rgba(62, 203, 125, .7)';
        ctx.lineWidth = 1.3;
        roundRect(it.x, it.y, it.w, it.h, 13);
        ctx.stroke();
        ctx.fillStyle = sk.chipText;
        ctx.fillText(it.label, it.x + it.w / 2, it.y + it.h / 2 + .5, it.w - 12);
        ctx.restore();
      }
    }
    ctx.restore();
  }

  function boostRowHit(px, py) {
    const items = boostRowItems();
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      if (it.kind === 'stock' && px >= it.x && px <= it.x + it.w && py >= it.y - 2 && py <= it.y + it.h + 2) {
        return it.b;
      }
    }
    return null;
  }

  function readyTap(px, py) {
    // Önce giriş serisi kartı
    if (SAVE.streak.pending > 0) {
      const py0 = 166;
      if (py >= py0 + 190 && py <= py0 + 224 && px >= W / 2 - 70 && px <= W / 2 + 70) {
        const i = Math.min(SAVE.streak.pending, CONFIG.streak.length) - 1;
        const r = CONFIG.streak[i];
        SAVE.streak.pending = 0;
        if (r.s) addStars(r.s, W / 2, 300 + UI_OY);
        if (r.g) addGems(r.g, W / 2, 322 + UI_OY);
        pushNotif('🎁 GÜNLÜK GİRİŞ', (i + 1) + '. gün ödülü: +' + r.s + '⭐ +' + r.g + '💎');
        sStreak(); setVib(40);
        saveSave();
        return true;
      }
      return false;   // kart açıkken diğer tıklamalar pas
    }
    const L = readyLayout();
    // Mod çipi → modlar ekranı
    if (px >= L.modeChip.x && px <= L.modeChip.x + L.modeChip.w && py >= L.modeChip.y && py <= L.modeChip.y + L.modeChip.h) {
      openScreen('modes');
      return true;
    }
    // OYNA
    if (px >= L.play.x && px <= L.play.x + L.play.w && py >= L.play.y && py <= L.play.y + L.play.h) {
      startRun();
      return true;
    }
    // Küçük düğmeler (readyLayout().smalls tek kaynak)
    for (let i = 0; i < L.smalls.length; i++) {
      const b = L.smalls[i];
      if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) {
        if (b.id === 'shop') openShop();
        else openScreen(b.id);
        return true;
      }
    }
    // Boost sırası (kuşanılacak güç)
    const b = boostRowHit(px, py);
    if (b) {
      armed = armed === b.id ? null : b.id;
      sClick();
      return true;
    }
    return false;
  }

  function medalName() {
    if (score >= 40) return 'PLATİN';

  function drawMedal(cx, cy, r) {
    const sk = SK();
    const name = medalName();
    if (name === 'MADALYA YOK') {
      ctx.save();
      ctx.strokeStyle = sk.border;
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = sk.textDim;
      ctx.font = '600 22px ' + FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('—', cx, cy);
      ctx.restore();
      return;
    }
    const cols =
      name === 'PLATİN' ? ['#f2fbff', '#b9c9d6'] :
      name === 'ALTIN'  ? ['#ffe08a', '#d19a1f'] :
      name === 'GÜMÜŞ'  ? ['#f2f4f8', '#a7adb8'] :
                          ['#f2b25e', '#a5642a'];

    // Ribbon tails behind the medal
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = cols[1];
    ctx.save();
    ctx.rotate(.5);
    roundRect(-9, r * .55, 18, 30, 5);
    ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.rotate(-.5);
    roundRect(-9, r * .55, 18, 30, 5);
    ctx.fill();
    ctx.restore();
    ctx.restore();

    // Disc
    ctx.save();
    const g = ctx.createLinearGradient(cx, cy - r, cx, cy + r);
    g.addColorStop(0, cols[0]);
    g.addColorStop(1, cols[1]);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.strokeStyle = 'rgba(0, 0, 0, .22)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, r - 1, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255, 255, 255, .55)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(cx, cy, r - 5, Math.PI * 1.05, Math.PI * 1.55);
    ctx.stroke();

    // Rotating shine sweep
    const ang = performance.now() / 700;
    ctx.strokeStyle = 'rgba(255, 255, 255, .4)';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(cx, cy, r - 6, ang, ang + .7);
    ctx.stroke();

    // Embossed star
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = 'rgba(255, 255, 255, .5)';
    starPath(r * .5, r * .21);
    ctx.fill();
    ctx.restore();
  }
